<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b0a09}
  canvas{position:absolute;inset:0}
  .ov{position:absolute;left:0;right:0;text-align:center;font-family:Inter,sans-serif;color:#F3E6C8;opacity:0;will-change:opacity,transform}
  .kick{font-size:34px;letter-spacing:14px;text-transform:uppercase;color:#D9B568;font-weight:600}
  .big{font-size:88px;font-weight:800;line-height:1.05;letter-spacing:-1px;text-shadow:0 6px 40px rgba(0,0,0,.6)}
  .mid{font-size:52px;font-weight:600;line-height:1.25;text-shadow:0 4px 30px rgba(0,0,0,.7)}
  .gold{color:#E2C27A}
  .line{width:220px;height:3px;margin:28px auto;background:linear-gradient(90deg,transparent,#D9B568,transparent)}
  .cta{display:inline-block;margin-top:40px;padding:28px 60px;border:3px solid #D9B568;border-radius:80px;font-size:46px;font-weight:700;color:#11100E;background:linear-gradient(180deg,#F0D592,#C8A55F)}
  .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.65) 100%)}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div class="vign"></div>
<div id="o1" class="ov" style="top:300px"><div class="kick">Казахстан</div><div class="line"></div><div class="big">Студия<br><span class="gold">кавказского</span><br>танца</div></div>
<div id="o2" class="ov" style="top:1560px"><div class="kick">Сила · Честь · Ритм</div></div>
<div id="o3" class="ov" style="top:1500px"><div class="mid">Лезгинка и кавказские танцы<br><span class="gold">для детей и взрослых</span></div></div>
<div id="o4" class="ov" style="top:1420px"><div class="mid">Бесплатное<br><span class="gold">пробное занятие</span></div><div class="cta">Записаться</div></div>
<script type="module">
import * as THREE from 'three';
import {FontLoader} from 'three/addons/loaders/FontLoader.js';
import {TextGeometry} from 'three/addons/geometries/TextGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x2a170c,0.0075);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;

// sky dome: sunset gradient
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{},
  vertexShader:`varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 v;void main(){float h=v.y;
    vec3 top=vec3(.03,.03,.06),mid=vec3(.25,.12,.06),hor=vec3(.85,.5,.22);
    vec3 c=mix(hor,mid,smoothstep(-.02,.12,h));c=mix(c,top,smoothstep(.12,.55,h));
    float sun=pow(max(dot(v,normalize(vec3(0.,.06,-1.))),0.),220.);c+=vec3(1.,.75,.4)*sun*2.;
    gl_FragColor=vec4(c,1.);}`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400,32,16),skyMat));

// seeded random + value noise
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)-1)/2147483646;
const perm=[...Array(512)].map(()=>rnd());
function n2(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const h=(a,b)=>perm[((a*57+b*131)%512+512)%512];
  const s=t=>t*t*(3-2*t);const u=s(xf),v=s(yf);
  return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v)+(h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v;}
const fbm=(x,y)=>{let a=0,f=1,amp=1;for(let i=0;i<5;i++){a+=n2(x*f,y*f)*amp;f*=2;amp*=.5;}return a;};

// low-poly mountains
const geo=new THREE.PlaneGeometry(300,300,120,120);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;const cols=[];
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);
  let h=Math.pow(fbm(x*.018+3,z*.018+5),2.2)*26;
  const valley=Math.exp(-(x*x)/(2*14*14)); h*=1-.85*valley*THREE.MathUtils.lerp(.3,1,THREE.MathUtils.smoothstep(z,-110,-50)); if(z>-30) h*=Math.max(.15,1-(z+30)/60);
  if(z<-90) h+=Math.exp(-((x-30)**2+(z+170)**2)/(2*30*30))*22+Math.exp(-((x+45)**2+(z+190)**2)/(2*25*25))*18; // main peak behind logo
  pos.setY(i,h-4);
  const c=new THREE.Color();
  if(h>31) c.setRGB(.5,.48,.54); else if(h>12) c.setRGB(.26,.21,.19); else c.setRGB(.12,.09,.07);
  c.convertSRGBToLinear();cols.push(c.r,c.g,c.b);}
geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
const terrain=geo.toNonIndexed();terrain.computeVertexNormals();
scene.add(new THREE.Mesh(terrain,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.95,metalness:0,envMapIntensity:.15})));

// lights
scene.add(new THREE.HemisphereLight(0x5a4a7a,0x120a05,.35));
const sun=new THREE.DirectionalLight(0xffb36b,2.0);sun.position.set(-20,18,-120);scene.add(sun);
const key=new THREE.DirectionalLight(0xfff0d8,0.8);key.position.set(20,30,40);scene.add(key);
const glow=new THREE.PointLight(0xffc870,0,90,1.5);scene.add(glow);

// stars
{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<1500;i++){const th=rnd()*Math.PI*2,ph=.15+rnd()*1.2;p.push(380*Math.cos(th)*Math.cos(ph),380*Math.sin(ph),380*Math.sin(th)*Math.cos(ph));}
 g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xfff3d6,size:1.3,sizeAttenuation:false,fog:false,transparent:true,opacity:.8})));}

// golden sparks
const N=900;const sg=new THREE.BufferGeometry();const sp=new Float32Array(N*3);const sd=[];
for(let i=0;i<N;i++)sd.push({x:(rnd()-.5)*60,z:-40-rnd()*50,s:.6+rnd()*1.6,o:rnd()*30,w:rnd()*6});
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const sparks=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffd27a,size:.3,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(sparks);

const gold=new THREE.MeshStandardMaterial({color:0xd9b568,metalness:1,roughness:.22,envMapIntensity:1.6});
const goldDark=new THREE.MeshStandardMaterial({color:0xa47e35,metalness:1,roughness:.35,envMapIntensity:1.2});

// logo group
const logo=new THREE.Group();logo.position.set(0,30,-60);scene.add(logo);
// ornament rings
const ringA=new THREE.Group(),ringB=new THREE.Group();logo.add(ringA,ringB);
ringA.add(new THREE.Mesh(new THREE.TorusGeometry(15,.35,16,160),gold));
for(let i=0;i<36;i++){const a=i/36*Math.PI*2;const m=new THREE.Mesh(new THREE.ConeGeometry(.55,1.8,4),i%3?goldDark:gold);
  m.position.set(Math.cos(a)*16.2,Math.sin(a)*16.2,0);m.rotation.z=a-Math.PI/2;ringA.add(m);}
ringB.add(new THREE.Mesh(new THREE.TorusGeometry(12.5,.18,12,160),goldDark));
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const m=new THREE.Mesh(new THREE.OctahedronGeometry(.7),gold);
  m.position.set(Math.cos(a)*12.5,Math.sin(a)*12.5,0);ringB.add(m);}
// crossed daggers (kinjal) behind text
function kinjal(){const g=new THREE.Group();
  const blade=new THREE.Mesh(new THREE.CylinderGeometry(.05,.55,11,4),new THREE.MeshStandardMaterial({color:0xdfe3ea,metalness:1,roughness:.12}));blade.position.y=6;blade.scale.z=.25;
  const guard=new THREE.Mesh(new THREE.BoxGeometry(2.6,.4,.5),gold);guard.position.y=.4;
  const hilt=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,3.2,12),goldDark);hilt.position.y=-1.4;
  const pom=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),gold);pom.position.y=-3.2;
  g.add(blade,guard,hilt,pom);return g;}
const k1=kinjal(),k2=kinjal();k1.rotation.z=.75;k2.rotation.z=-.75;k1.position.z=k2.position.z=-2;logo.add(k1,k2);

let title,sub;
new FontLoader().load('./node_modules/three/examples/fonts/optimer_bold.typeface.json',f=>{
  const mk=(s,size,depth)=>{const g=new TextGeometry(s,{font:f,size,depth,curveSegments:10,bevelEnabled:true,bevelThickness:.25,bevelSize:.12,bevelSegments:4});g.center();return new THREE.Mesh(g,gold);};
  title=mk('DJIGIT',5.2,1.6);title.position.y=2.6;
  sub=mk('TAU',5.2,1.6);sub.position.y=-4.2;
  logo.add(title,sub);window.ready=true;});

const cam=new THREE.PerspectiveCamera(50,W/H,.1,1000);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const cl=(x,a,b)=>Math.min(1,Math.max(0,(x-a)/(b-a)));
const fade=(t,a,b,c,d)=>Math.min(cl(t,a,b),1-cl(t,c,d));

window.renderAt=function(t){
  // camera path: low flight over valley -> rise to face logo -> slow orbit
  const p1=ease(cl(t,0,6.5));
  const R=THREE.MathUtils.lerp(150,84,p1)-cl(t,6.5,15)*8, y=THREE.MathUtils.lerp(16,24,p1);
  const orbit=(ease(cl(t,6.5,15))-.5)*.5;
  cam.position.set(Math.sin(orbit)*R+Math.sin(t*.4)*.6, y+Math.sin(t*.7)*.3, -60+Math.cos(orbit)*R);
  cam.lookAt(0,THREE.MathUtils.lerp(12,27,p1),-60);

  // logo reveal
  const r=ease(cl(t,3.2,6.2));
  logo.position.y=THREE.MathUtils.lerp(4,30,r);
  logo.rotation.y=(1-r)*Math.PI*1.5+Math.sin(t*.6)*.12*r;
  logo.scale.setScalar(.4+.6*r);
  ringA.rotation.z=t*.35;ringB.rotation.z=-t*.55;
  ringA.scale.setScalar(ease(cl(t,4.5,7)));ringB.scale.setScalar(ease(cl(t,5,7.5)));
  const kd=ease(cl(t,5.5,7.5));k1.rotation.z=THREE.MathUtils.lerp(0,.75,kd);k2.rotation.z=THREE.MathUtils.lerp(0,-.75,kd);
  k1.visible=k2.visible=kd>0.01;
  glow.intensity=r*60;glow.position.set(0,logo.position.y+2,-44);

  // sparks rise
  for(let i=0;i<N;i++){const d=sd[i];const yy=((t*d.s*3+d.o)%30)-2;
    sp[i*3]=d.x+Math.sin(t*.8+d.w)*1.5;sp[i*3+1]=yy;sp[i*3+2]=d.z;}
  sg.attributes.position.needsUpdate=true;sparks.material.opacity=.25+.65*cl(t,3,6);

  // overlays
  const set=(id,o,dy)=>{const e=document.getElementById(id);e.style.opacity=o;e.style.transform=`translateY(${(1-o)*dy}px)`;};
  set('o1',fade(t,.6,1.6,3.0,3.8),40);
  set('o2',fade(t,6.4,7.2,8.8,9.4),30);
  set('o3',fade(t,9.4,10.2,11.8,12.4),30);
  set('o4',cl(t,12.6,13.4),30);
  renderer.render(scene,cam);
};
</script></body></html>
