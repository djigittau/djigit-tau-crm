<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1DFA8">
<title>DJIGIT TAU CRM · демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Forum&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F5F4F0;--panel:#FFFFFF;--pale:#F7F0DE;--line:#ECE7DC;--line2:#F2EEE6;
  --text:#1C1A16;--muted:#78716A;--faint:#A59D92;
  --gold:#C8A55F;--gold-deep:#9A7633;--ink:#1A1916;
  --green:#3E8E4E;--green-bg:#E5F3E6;--red:#C7392F;--red-bg:#FBE4E1;--blue:#2F5F8A;--blue-bg:#E2ECF5;--warn:#8A5A12;--warn-bg:#F8EBCF;
  --s1:#F4E8C8;--s2:#ECD9A6;--s3:#DFC17F;--s4:#CFA65C;--lost:#F0CFCB;
  --goldbar:linear-gradient(90deg,#E9D6A6,#CDA963);
  --r:12px;--r-sm:8px;
  --shadow:0 1px 2px rgba(26,25,22,.04),0 6px 18px rgba(26,25,22,.05);
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:var(--safe-b)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* sidebar: dark with gold glow, as in the mockup */
.app{display:flex;min-height:100vh}
.side{width:236px;background:radial-gradient(140% 38% at 20% 108%,rgba(214,176,98,.55) 0%,rgba(214,176,98,.12) 45%,transparent 70%),linear-gradient(180deg,#161616 0%,#0F0F0F 100%);color:#D9D4CA;padding:calc(16px + var(--safe-t)) 0 18px;position:fixed;top:0;bottom:0;left:0;overflow:auto;z-index:20;display:flex;flex-direction:column}
.brand{padding:4px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:center}
.brand img{width:184px;height:auto;display:block}
.nav{padding-top:10px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#D4CEC3;padding:10px 22px;text-align:left;font-size:14px;position:relative}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.active{background:linear-gradient(90deg,#B8924B 0%,#8A6A2E 70%,rgba(138,106,46,.35) 100%);color:#fff;font-weight:600}
.nav .cnt{margin-left:auto;background:#C8A55F;color:#1A1916;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 8px}
.sidefoot{margin-top:auto;padding:16px 22px 0;color:#9B9488;font-size:12px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#E9D6A6;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 42px}
.scrim{display:none}

/* top bar */
.main{margin-left:236px;width:calc(100% - 236px);min-width:0}
.top{min-height:62px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:calc(10px + var(--safe-t)) 24px 10px;position:sticky;top:0;z-index:10;gap:14px}
.gsearch{position:relative;flex:1;max-width:560px}
.gsearch input{width:100%;border:1px solid var(--line);background:#FAFAF8;border-radius:10px;padding:9px 12px 9px 36px;font-size:13.5px}
.gsearch input:focus{outline:none;border-color:var(--gold);background:#fff}
.gsearch>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gres,.pop{position:absolute;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(26,25,22,.12);z-index:30;display:none;max-height:380px;overflow:auto}
.gres{left:0;right:0}.gres.on,.pop.on{display:block}
.gres button,.pop .it{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13.5px}
.gres button:hover,.pop .it:hover{background:#FBF7EC}
.gres small,.pop small{color:var(--muted);font-size:12px;display:block}
.gres .k{margin-left:auto;font-size:11.5px;color:var(--gold-deep);background:var(--pale);border-radius:8px;padding:1px 7px;white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.branchsel{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:0 4px 0 12px;font-size:13px;color:var(--muted);background:#fff}
.branchsel select{border:0;background:none;font-weight:600;color:var(--ink);padding:8px 4px;max-width:200px;font-size:13px}
.branchsel select:focus{outline:none}
.iconbtn{position:relative;border:0;background:none;padding:6px;color:var(--ink);border-radius:8px}
.iconbtn:hover{background:#F4F1EA}
.iconbtn svg.i{width:22px;height:22px}
.badge{position:absolute;top:1px;right:1px;min-width:17px;height:17px;border-radius:9px;background:#C8A55F;color:#1A1916;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.badge[hidden],.cnt[hidden]{display:none}
.pop{right:0;width:330px}
.pop h4{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line2)}
.mewrap,.bellwrap{position:relative}
.me{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 6px;border-radius:10px;text-align:left}
.me:hover{background:#F4F1EA}
.av{width:38px;height:38px;border-radius:50%;background:#1A1916;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:0 0 38px}
.me b{display:block;font-size:13.5px;line-height:1.2}.me small{display:block;font-size:12px;color:var(--muted)}
.select{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;max-width:240px}
.page{max-width:1500px;margin:auto;padding:20px 24px 60px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.heading-r{display:flex;gap:10px;align-items:center}
.monthsel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 6px 0 10px;color:var(--muted)}
.monthsel select{border:0;background:none;padding:8px 2px;font-size:13px;color:var(--ink)}
.monthsel select:focus{outline:none}
.heading h1{font-weight:700;font-size:24px;line-height:1.2;margin:0}
.sub{font-size:13px;color:var(--muted)}
.btn{border:1px solid #A8853F;border-radius:var(--r-sm);padding:8px 15px;background:linear-gradient(180deg,#D3B26E,#B8924B);color:#1A1916;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.btn:hover{filter:brightness(1.05)}
.btn.secondary{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{border-color:var(--gold)}
.btn.danger{background:#8E2A35;border-color:#8E2A35;color:#fff}
.mini{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 9px;font-size:12.5px}
.mini:hover{border-color:var(--gold)}
.mini.del{color:#8E2A35}

/* cards & stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat strong{display:block;font-weight:700;font-size:26px;line-height:1.15}
.stat label{display:block;color:var(--ink);font-size:13px;margin-top:6px}
.stat small{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin:0 0 2px}
.card .hint{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.barrow{display:grid;grid-template-columns:minmax(110px,200px) 1fr minmax(44px,auto);gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar{height:16px;background:#F3EFE6;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--goldbar);border-radius:5px}
.barrow b{text-align:right;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px}
.row b{font-weight:500}
.row span{color:var(--muted);text-align:right}
.tablewrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:720px}
.table th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:9px 12px;background:#FAF7EF;border-bottom:1px solid var(--line);white-space:nowrap}
.table th:first-child{border-radius:6px 0 0 0}.table th:last-child{border-radius:0 6px 0 0}
.table td{padding:10px 12px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
.table td b{font-weight:600;white-space:nowrap}
.table .num{white-space:nowrap}
.table tbody tr:hover td{background:#FCF8EE}
.table td.acts{white-space:nowrap}
.table td.acts .mini{margin:2px 2px 2px 0}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;background:var(--green-bg);color:var(--green);font-size:12px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.blue{background:var(--blue-bg);color:var(--blue)}.tag.red{background:var(--red-bg);color:var(--red)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.toolbar input{max-width:360px;flex:1}
.field{width:100%;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;outline:none}
.aichat{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow:auto;padding:4px 2px 8px}
.aimsg{padding:10px 13px;border-radius:var(--r);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-width:85%}
.aimsg.u{align-self:flex-end;background:var(--pale);border:1px solid var(--line)}
.aimsg.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.aimsg.err{border-color:var(--red);background:var(--red-bg)}
.aiform{display:flex;gap:8px;margin-top:10px}.aiform textarea{flex:1;resize:vertical;min-height:44px}
.citybar{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap}.citybar>div:first-child{flex:1;min-width:260px}
.citywrap{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;align-items:start}
.citymap{padding:10px}.citysvg{width:100%;height:auto;display:block;border-radius:var(--r-sm);font-family:var(--font)}
.citysvg .bld{cursor:pointer;outline:none}.citysvg .bld:hover .wall,.citysvg .bld:focus-visible .wall{stroke:#C79B35;stroke-opacity:1;stroke-width:2}
.citysvg .bld.sel .wall{stroke:#9A7633;stroke-opacity:1;stroke-width:3}
.citysvg .bld.busy .win{fill:#F2C14E;animation:cwin .5s ease-in-out infinite alternate}
@keyframes cwin{to{fill:#FFF1C4}}
.citysvg .ag{cursor:pointer}.citysvg .ag .bob{animation:cbob 2.6s ease-in-out infinite}
.citysvg .ag:nth-of-type(2n) .bob{animation-delay:-1.2s}
@keyframes cbob{50%{transform:translateY(-2.5px)}}
.clegend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:8px 4px 0}.clegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.cpanel{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto}
.chead{display:flex;gap:10px;align-items:center;margin-bottom:6px}.chead b{display:block;font-size:15px}.chead small{color:var(--muted);font-size:12.5px}
.cav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 38px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.cav.sm{width:26px;height:26px;flex-basis:26px;font-size:12px}
.crow2{display:flex;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line2);background:none;padding:8px 2px;text-align:left;font-size:13.5px}.crow2:hover{background:#FBF7EC}.crow2 .tag{margin-left:auto}
.amobox{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;margin:8px 0}.amobox summary{cursor:pointer;font-weight:600;font-size:13.5px}.amobox[open] summary{margin-bottom:8px}
.cchk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:8px 0 4px;cursor:pointer}.cchk input{margin-top:3px}
.cfind{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.45}.cfind .mini{margin-top:6px}
.cfind .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px;background:var(--green)}.cfind.warn .dot{background:#D99A2B}.cfind.red .dot{background:var(--red)}
@media(prefers-reduced-motion:reduce){.citysvg .ag .bob,.citysvg .bld.busy .win{animation:none}}
@media(max-width:1100px){.citywrap{grid-template-columns:1fr}.cpanel{position:static;max-height:none}}
.field:focus{border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(199,155,53,.18)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.notice{background:#FFF6DC;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:#5C4B2A;margin-bottom:14px}

/* pipeline (amo-style) */
.pipebar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pipebar .total{margin-left:auto;font-size:13px;color:var(--muted)}.pipebar .total b{color:var(--ink)}
.columns{display:flex;gap:10px;overflow-x:auto;padding-bottom:100px;align-items:flex-start}
.col{flex:1 0 250px;max-width:340px;display:flex;flex-direction:column}
.colhead{border-radius:var(--r) var(--r) 0 0;padding:10px 12px 9px;border-bottom:3px solid rgba(44,36,21,.18)}
.colhead .n{font-weight:600;font-size:13.5px;display:flex;justify-content:space-between}
.colhead .m{font-size:12px;color:rgba(44,36,21,.72);margin-top:2px}
.colbody{background:rgba(255,252,243,.55);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:8px;display:flex;flex-direction:column;gap:7px;min-height:140px;transition:background .15s}
.colbody.over{background:var(--pale)}
.quick{border:1px dashed var(--line);background:none;border-radius:var(--r-sm);padding:7px;color:var(--faint);font-size:13px;text-align:left}
.quick:hover{color:var(--ink);border-color:var(--gold)}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px 8px;box-shadow:var(--shadow);cursor:grab}
.lead:hover{border-color:var(--gold)}
.lead.dragging{opacity:.45}
.lead .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lead b{font-weight:600}
.lead .d{font-size:11.5px;color:var(--faint);white-space:nowrap}
.lead small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.lead .price{font-weight:600;font-size:13px;margin-top:4px}
.lead .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lead .tags span{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--pale);color:var(--muted)}
.lead .ltv{margin-top:6px;font-size:12px;padding:4px 8px;border-radius:6px;background:#FFF1C9;border:1px solid #EBD38E;color:#6B4F12}
.lead .ltv b{font-weight:600}
.colhead .f{font-size:12px;color:rgba(44,36,21,.72)}
.actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.dropbar{position:fixed;left:236px;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;height:80px;transform:translateY(100%);visibility:hidden;transition:transform .18s,visibility 0s .18s;z-index:25}
.dropbar.on{transform:none;visibility:visible;transition:transform .18s}
.dropbar div{display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;text-align:center;border-top:3px solid rgba(0,0,0,.15)}
.dropbar .lost{background:#8E2A35}.dropbar .del{background:#6B5C3F}
.dropbar div.over{filter:brightness(1.15)}
.dropbar.nodel{grid-template-columns:1fr}.dropbar.nodel .del{display:none}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(44,36,21,.4);display:none;place-items:center;z-index:40;padding:14px}
.modal{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-height:90vh;overflow:auto;box-shadow:0 14px 40px rgba(44,36,21,.25)}
.modal h2{font-weight:700;font-size:21px;margin:0 0 14px;line-height:1.2}
.modal .card{background:#FFFDF8}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.formfield{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.formfield label{font-size:12.5px;color:var(--muted)}
.formfield.full{grid-column:1/-1}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#F7E7B6;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hamb{display:none;background:none;border:0;padding:6px;color:var(--ink)}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:grid;place-items:center;background:var(--ink);color:#E9D6A6;font-size:28px;font-weight:600;flex:0 0 84px}

/* amoCRM-style deal card, tasks, robots */
.ptabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ptabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;color:var(--muted)}
.ptabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.ptabs button b{margin-left:6px;font-weight:600}
.lead .task{margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:12px;display:flex;gap:6px;align-items:flex-start;color:var(--text)}
.tdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:4px;background:var(--green)}
.tdot.late{background:var(--red)}.tdot.none{background:#E3A23A}
.lead .rsn{font-size:11.5px;color:var(--red)}
#askbg,#reasonbg{z-index:70}
#dealbg{position:fixed;inset:0;background:rgba(26,25,22,.35);z-index:45;display:none}
#dealbg.on{display:block}
#deal{position:fixed;top:0;right:0;bottom:0;width:min(1040px,100%);background:var(--bg);z-index:46;display:grid;grid-template-columns:380px 1fr;transform:translateX(100%);transition:transform .22s ease;box-shadow:-10px 0 34px rgba(26,25,22,.2)}
#deal.on{transform:none}
.dl{background:#fff;border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dh .x{float:right;border:0;background:none;font-size:24px;line-height:1;color:var(--muted);padding:0 4px}
.dh h2{margin:0 0 2px;font-size:20px;font-weight:700;line-height:1.2}
.dh .meta{font-size:12px;color:var(--muted)}
.sbar{display:flex;gap:3px;margin:12px 0 8px}.sbar i{flex:1;height:7px;border-radius:2px;background:#ECE7DC}.sbar i.on{background:var(--gold)}
.dh select{width:100%;font-weight:600}
.dup{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
.dup button{border:0;background:none;color:var(--blue);text-decoration:underline;padding:0;font-size:12.5px}
.df{padding:12px 18px;display:grid;gap:10px}
.df .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.df label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.df .field{padding:7px 9px}
.wa{display:inline-flex;align-items:center;gap:6px;border:1px solid #CFE6CF;background:#EEF8EE;color:#256B35;border-radius:8px;padding:6px 10px;font-size:12.5px;text-decoration:none;white-space:nowrap}
.da{margin-top:auto;padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.btn.won{background:var(--green);border-color:var(--green);color:#fff}
.btn.lostb{background:#fff;border-color:#EBC1BC;color:var(--red)}
.dr{display:flex;flex-direction:column;min-height:0}
.feed{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:9px}
.ev{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:13px}
.ev .tm{color:var(--faint);font-size:12px;padding-top:2px}
.ev .bd{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.ev.sys .bd{background:none;border:0;padding:2px 0;color:var(--muted)}
.ev.task .bd{border-left:3px solid var(--gold)}.ev.task.late .bd{border-left-color:var(--red)}
.ev.msg .bd{background:#F2FAF2;border-color:#D3EAD3}
.ev .bd b{font-weight:600}
.ev .bd .wa{margin-top:6px}
.comp{border-top:1px solid var(--line);background:#fff;padding:12px 18px}
.comp .tabs{display:flex;gap:4px;margin-bottom:8px}
.comp .tabs button{border:0;background:none;padding:4px 11px;border-radius:14px;color:var(--muted);font-size:13px}
.comp .tabs button.on{background:var(--pale);color:var(--ink);font-weight:600}
.comp textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:60px;resize:vertical}
.comp .row2{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.comp .row2 .grow{flex:1}
.titem{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px}
.titem input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold-deep)}
.titem .w{font-weight:600}.titem .dlnk{font-size:12.5px;color:var(--muted)}
.titem .dlnk button{border:0;background:none;padding:0;color:var(--blue);text-decoration:underline;font-size:12.5px}
.titem .when{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.titem.late .when{color:var(--red);font-weight:600}.titem.done{opacity:.55}.titem.done .w{text-decoration:line-through}
.tgrp h3{font-size:14px;margin:16px 0 8px}.tgrp h3 span{color:var(--muted);font-weight:400}
.dp{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.dp .stg{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dp .stg h4{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.rb{margin:8px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12.5px;background:#FDFBF6}
.rb.off{opacity:.5}
.rb .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600;font-size:13px}
.rb p{margin:4px 0 0;color:var(--muted)}
.sw{position:relative;width:34px;height:20px;flex:0 0 34px}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#DDD6C8;border-radius:12px;transition:.15s;cursor:pointer}
.sw span::after{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--gold-deep)}.sw input:checked+span::after{transform:translateX(14px)}
.sw input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.tpl{display:grid;gap:10px}.tpl label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.tpl textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
@media(max-width:760px){#deal{grid-template-columns:1fr;overflow:auto}.dl{overflow:visible}.dr{min-height:70vh}.dp{grid-template-columns:repeat(4,80vw)}}

/* home dashboard (mockup) */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .ic{color:var(--gold);flex:0 0 auto}.kpi .ic svg{width:34px;height:34px;stroke-width:1.4}
.kpi label{display:block;font-size:13px;font-weight:600}
.kpi strong{display:block;font-size:26px;font-weight:700;line-height:1.2;margin:2px 0}
.kpi small{font-size:12.5px;color:var(--muted)}.kpi small.up{color:var(--green)}.kpi small.down{color:var(--red)}
.hrow{display:grid;gap:14px;margin-bottom:14px}
.hrow.r2{grid-template-columns:1fr 1.15fr}.hrow.r3{grid-template-columns:1fr 1fr 1fr}.hrow.r4{grid-template-columns:1fr 1fr}
.hrow>*{min-width:0}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card .ch h3{margin:0;display:flex;align-items:center;gap:8px}.card .ch h3 svg{color:var(--ink)}
.card .ch h3 span{font-weight:400;color:var(--muted);font-size:13px}
.link{border:0;background:none;color:var(--blue);font-size:12.5px;padding:2px 0;white-space:nowrap}
.link:hover{text-decoration:underline}
.chev{border:0;background:none;color:var(--muted);padding:2px 4px;font-size:18px;line-height:1}
.fun{display:grid;grid-template-columns:minmax(110px,150px) 34px 1fr 46px;gap:10px;align-items:center;margin:16px 0;font-size:13.5px}
.fun .bar{height:18px}
.fun b{text-align:right}.fun .pct{text-align:right;color:var(--muted)}
.lc{width:100%;height:auto;display:block}
.lc text{font:11.5px var(--font);fill:#6F685F}
.grp{display:grid;grid-template-columns:22px minmax(0,1.25fr) minmax(70px,1fr) 30px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.grp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grp svg{width:18px;height:18px;color:var(--gold)}.grp b{text-align:right}
.money{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;margin-top:10px;font-size:13.5px}
.money b{margin-left:auto;font-size:15px}
.money.ok{background:var(--green-bg)}.money.ok svg{color:var(--green)}
.money.bad{background:var(--red-bg)}.money.bad svg{color:var(--red)}
.donutwrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.donutwrap .big{font-size:32px}
.donutwrap p{margin:6px 0 0;font-size:13px}
.deal{display:grid;grid-template-columns:24px 1fr auto 22px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px;cursor:pointer}
.deal:first-of-type{border-top:0}
.deal .av2{width:22px;height:22px;color:var(--ink)}
.deal em{font-style:normal;color:var(--muted);font-size:12.5px}
.deal .st svg{width:20px;height:20px}
.les{display:grid;grid-template-columns:56px 22px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px}
.les:first-of-type{border-top:0}
.les b{font-weight:700}.les svg{width:18px;height:18px;color:var(--gold)}
.les em{font-style:normal;color:var(--muted);font-size:12.5px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(2,1fr)}.hrow.r3{grid-template-columns:1fr 1fr}.hrow.r3>:last-child{grid-column:1/-1}}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.hrow.r2,.hrow.r3,.hrow.r4{grid-template-columns:1fr}.kpi{padding:12px}.kpi .ic svg{width:26px;height:26px}.kpi strong{font-size:20px}}

/* owner panel */
.ptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:1.05fr 1.35fr .9fr;gap:16px;margin-bottom:16px}
.pgrid2{display:grid;grid-template-columns:2.4fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.pgrid>*,.pgrid2>*,.grid2>*{min-width:0}
.big{font-size:38px;line-height:1.05;font-weight:700}
.delta{font-size:12.5px;margin-top:4px;color:var(--muted)}.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.plan{margin:14px 0 4px}.plan .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.plan .track{height:12px;border-radius:7px;background:#F1E6C6;position:relative;overflow:visible}
.plan .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--s2),var(--s4))}
.plan .mark{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
.plan .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:3px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;margin-top:14px}
.flow .box{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:#FFFDF8}
.flow .box small{display:block;font-size:12px;color:var(--muted)}.flow .box b{font-size:20px;font-weight:600}
.flow .box.dark{background:var(--ink);color:#F7E7B6;border-color:var(--ink)}.flow .box.dark small{color:#D9C38A}
.flow .arr{color:var(--faint)}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding:6px 2px 0;border-bottom:1px solid var(--line)}
.chart .m{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:100%;position:relative}
.chart .b{width:42%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.chart .b.rev{background:linear-gradient(180deg,#E9C766,#D2A744)}
.chart .b.exp{background:repeating-linear-gradient(135deg,#6E9CB8 0 4px,#BFD5E2 4px 8px)}
.chart .m.cur .b.rev{box-shadow:0 0 0 2px var(--ink)}
.chart-x{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:5px}.chart-x span{flex:1;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}.legend span{white-space:nowrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.acc{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px}
.acc .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.pay{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.pay .dt{background:var(--ink);color:#F7E7B6;border-radius:8px;text-align:center;padding:3px 0;line-height:1.1}
.pay .dt b{display:block;font-size:16px}.pay .dt small{font-size:10.5px}
.pay .what{font-size:13.5px}.pay .what small{display:block;color:var(--muted);font-size:12px}
.pay .sum{text-align:right;font-size:13.5px;font-weight:600;white-space:nowrap}
.pay .sum .mini{margin-top:3px;display:block;margin-left:auto}
.left{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:#F3F8EE;border:1px solid #D6E6C8;font-size:13.5px}
.left b{font-size:17px;color:var(--green);white-space:nowrap}.left.neg{background:var(--red-bg);border-color:#EBC1BC}.left.neg b{color:var(--red)}
.ptable tbody tr{cursor:pointer}
.ptable tr.sel td{background:#FFF3CF}
.ptable tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.ptable tfoot td{font-weight:600;border-top:2px solid var(--line);padding:10px 12px;font-size:13.5px}
.mg{display:inline-block;min-width:54px;text-align:center;padding:2px 8px;border-radius:10px;font-size:12.5px;font-weight:600}
.mg.lo{background:var(--red-bg);color:var(--red)}.mg.mid{background:var(--warn-bg);color:var(--warn)}.mg.hi{background:var(--green-bg);color:var(--green)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cmp>div{padding:4px 18px}.cmp>div+div{border-left:1px solid var(--line)}
.cmp h4{margin:4px 0 10px;font-size:14px}.cmp h4 small{font-weight:400;color:var(--muted)}
.crow{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.crow .tr{height:20px;border-radius:5px;background:#F3EAD1;position:relative;overflow:hidden}
.crow .tr i{position:absolute;top:0;bottom:0;border-radius:5px}
.crow .tr i.pos{left:0;background:linear-gradient(90deg,#F2DE9E,#E6C46F)}
.crow .tr i.neg{right:0;background:repeating-linear-gradient(135deg,#6E9CB8 0 4px,#BFD5E2 4px 8px)}
.crow .tr i.res{left:0;background:var(--green)}.crow .tr i.res.bad{background:var(--red)}
.crow b{text-align:right}
.cres{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:#FFFDF8;border:1px solid var(--line)}
.src{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);margin-top:8px;background:#FFFDF8}
.src .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:0 0 30px}
.src b{display:block;font-size:13.5px}.src small{color:var(--muted);font-size:12px}
.src .ok{margin-left:auto;color:var(--green);font-size:12px;white-space:nowrap}
.planedit{display:inline-flex;gap:6px;align-items:center}.planedit input{width:140px;padding:4px 8px}
.planline{margin-top:8px;font-size:12.5px;color:var(--muted)}.planline b{color:var(--ink)}
@media(max-width:1200px){.pgrid{grid-template-columns:1fr 1fr}.pgrid>:nth-child(2){grid-column:1/-1;order:3}.pgrid2{grid-template-columns:1fr}}
@media(max-width:760px){.pgrid{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}.cmp>div+div{border-left:0;border-top:1px solid var(--line);padding-top:12px}.flow{grid-template-columns:1fr 1fr 1fr}.flow .arr{display:none}.crow{grid-template-columns:100px 1fr 54px}}

/* login */
#login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(80% 45% at 50% 105%,rgba(214,176,98,.5) 0%,transparent 70%),linear-gradient(180deg,#161616,#0D0D0D)}
#login .lglogo{display:block;width:220px;margin:4px auto 18px}
#login .modal{width:min(420px,100%)}
#login .big{display:flex;align-items:center;gap:12px;margin-bottom:16px}
#login .big b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1}
#login .big small{display:block;color:var(--muted);font-size:13px;margin-top:3px}

@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.grid2{grid-template-columns:1fr}}
@media(max-width:760px){
  .side{transform:translateX(-100%);transition:transform .2s;width:260px;box-shadow:8px 0 30px rgba(44,36,21,.2)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(44,36,21,.3);z-index:15}
  .main{margin-left:0;width:100%}
  .top{padding:calc(6px + var(--safe-t)) 12px 6px}
  .hamb{display:block}.me>span:not(.av),.me>svg,.branchsel>span{display:none}.gsearch{order:5;flex-basis:100%;max-width:none}.top{flex-wrap:wrap}.tb-right{gap:6px}.branchsel select{max-width:130px}.heading{flex-wrap:wrap}
  .page{padding:16px 12px 60px}
  .heading h1{font-size:28px}
  .formgrid{grid-template-columns:1fr}
  .toolbar input{max-width:none}
  .col{flex-basis:80vw}
  .dropbar{left:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Главная (как на макете) ===== */
function delta(cur,prev,unit="%"){if(!prev&&!cur)return'<small>—</small>';if(unit==="pp"){const d=Math.round(cur-prev);return `<small class="${d>=0?"up":"down"}">${d>=0?"+":"−"}${Math.abs(d)} п.п.</small>`}
  if(!prev)return'<small class="up">новые</small>';const d=Math.round((cur-prev)/prev*100);return `<small class="${d>=0?"up":"down"}">${d>=0?"+":"−"}${Math.abs(d)}%</small>`}
function monthEnd(ym){return shiftMonth(ym,1)+"-00"}
function attRate(ym){const a=db.attendance.filter(inBranch).filter(x=>(x.date||"").startsWith(ym));const ok=a.filter(x=>x.status==="Присутствовал"||x.status==="Опоздал").length;return{a,ok,rate:a.length?ok/a.length*100:0}}
function lineChart(pts){
  const W=460,H=150,L=70,R=14,T=10,B=26,max=Math.max(...pts.map(p=>p.v),1),min=Math.min(...pts.map(p=>p.v));
  if(max<=0){pts=pts.map(p=>({...p}));}
  const step=Math.pow(10,Math.floor(Math.log10(Math.max(1,max-min||max))));let lo=Math.max(0,Math.floor(min*0.9/step)*step),hi=Math.ceil(max*1.05/step)*step;if(max<=1){lo=0;hi=1000000}if(hi===lo)hi=lo+step;
  const x=i=>L+(W-L-R)*(pts.length===1?0.5:i/(pts.length-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[0,1,2,3,4].map(i=>lo+(hi-lo)*i/4);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=line+`L${x(pts.length-1)},${H-B}L${x(0)},${H-B}Z`;
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Выручка по месяцам"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#D2AE66" stop-opacity=".55"/><stop offset="1" stop-color="#D2AE66" stop-opacity=".04"/></linearGradient></defs>
    ${ticks.map(t=>`<text x="${L-8}" y="${y(t)+4}" text-anchor="end">${Math.round(t).toLocaleString("ru-RU").replace(/\u00a0/g," ")}</text>`).join("")}
    <line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#E4DED2"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#E4DED2"/>
    <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#B8924B" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#B8924B"><title>${p.l}: ${money(p.v)}</title></circle><text x="${x(i)}" y="${H-8}" text-anchor="middle">${p.l}</text>`).join("")}</svg>`;
}
function donut(pct){const r=34,c=2*Math.PI*r,v=Math.max(0,Math.min(100,pct));
  return `<svg width="104" height="104" viewBox="0 0 90 90" role="img" aria-label="Посещаемость ${Math.round(v)}%"><defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#E5CB8E"/><stop offset="1" stop-color="#B38A41"/></linearGradient></defs>
  <circle cx="45" cy="45" r="${r}" fill="none" stroke="#EFEBE3" stroke-width="10"/>${v>0?`<circle cx="45" cy="45" r="${r}" fill="none" stroke="url(#gd)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 45 45)"/>`:""}
  <text x="45" y="50" text-anchor="middle" style="font:700 15px var(--font);fill:#1A1916">${Math.round(v)}%</text></svg>`}
/* Долг: активные ученики без действующего абонемента или со статусом «Нужна оплата» */
function debts(){const t=today();return db.students.filter(inBranch).filter(s=>s.status!=="Архив"&&s.status!=="Пауза"&&s.status!=="Пробное").map(s=>{const ms=db.memberships.filter(m=>m.student===s.id).sort((a,b)=>(b.expires||"").localeCompare(a.expires||""));
  const act=ms.find(m=>m.total-m.used>0&&(!m.expires||m.expires>=t));return (!act||s.status==="Нужна оплата")?{s,amount:Number(ms[0]?.price||0)}:null}).filter(Boolean)}

  const groups=db.groups.filter(inBranch).map(g=>[g.name,db.students.filter(s=>s.group===g.name&&s.status!=="Архив").length]).filter(g=>g[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const gTot=groups.reduce((a,g)=>a+g[1],0),gMax=Math.max(1,...groups.map(g=>g[1]));

  const paidR=srt.filter(isPaid).slice(0,2),recent=[...paidR,...srt.filter(l=>!isPaid(l)).slice(0,4-paidR.length)];
  const t=today();let upcoming=db.lessons.filter(inBranch).filter(l=>l.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const firstDay=upcoming[0]?.date;upcoming=upcoming.filter(l=>l.date===firstDay).slice(0,5);
  const stIcon=st=>st===STAGES[3]?svg("okc","color:var(--green)"):st===LOST?svg("xc","color:var(--red)"):svg("clockc","color:var(--gold)");
  const stLabel=st=>st===STAGES[3]?"Оплата (абонемент)":st===STAGES[2]?"Пробное занятие":st===STAGES[1]?"Связались":st===LOST?"Отказ":"Новая заявка";
  return `<div class="kpis">
    <div class="kpi"><span class="ic">${svg("users")}</span><div><label>Активные ученики</label><strong class="num">${stNow}</strong>${delta(stNow,stPrev)} <small>к прошлому месяцу</small></div></div>

    <div class="kpi"><span class="ic">${svg("coins")}</span><div><label>Выручка (месяц)</label><strong class="num">${money(rNow)}</strong>${delta(rNow,rPrev)}</div></div>
    <div class="kpi"><span class="ic">${svg("calcheck")}</span><div><label>Посещаемость</label><strong class="num">${Math.round(aN.rate)}%</strong>${delta(aN.rate,aP.rate,"pp")}</div></div>
  </div>
  <div class="hrow r2">
    <section class="card"><div class="ch"><h3>Воронка заявок</h3>${allowed("Заявки и воронка")?'<button class="chev" data-go="Заявки и воронка" aria-label="Открыть заявки">›</button>':""}</div>
      ${STAGES.map((st,i)=>`<div class="fun"><span>${st==="Купили абонемент"?"Оплата":st}</span><b class="num">${reached[i]}</b><div class="bar"><i style="width:${reached[0]?reached[i]/reached[0]*100:0}%"></i></div><span class="pct num">${reached[0]?Math.round(reached[i]/reached[0]*100):0}%</span></div>`).join("")}</section>
    <section class="card"><div class="ch"><h3>Выручка по месяцам</h3></div>${lineChart(pts)}</section>
  </div>
  <div class="hrow r3">

      ${groups.map(([n,c])=>`<div class="grp">${svg("users")}<span>${esc(n)}</span><div class="bar"><i style="width:${c/gMax*100}%"></i></div><b class="num">${c}</b></div>`).join("")||'<div class="empty">Групп пока нет</div>'}</section>
    <section class="card"><div class="ch"><h3>${svg("walletc")} Оплаты и задолженности</h3></div>

/* Поиск по всей CRM */
function globalSearch(){
  const q=$("gq").value.trim().toLowerCase(),box=$("gres");
  if(q.length<2){box.classList.remove("on");box.innerHTML="";return}
  const dq=q.replace(/\D/g,"");
  const hit=(...v)=>v.some(x=>String(x||"").toLowerCase().includes(q))||(dq.length>=3&&v.some(x=>String(x||"").replace(/\D/g,"").includes(dq)));
  const res=[];
  if(allowed("Ученики"))db.students.filter(s=>hit(s.name,s.phone)).slice(0,6).forEach(s=>res.push({k:"Ученик",t:s.name,sub:s.phone+" · "+branchName(s.branch),fn:()=>openProfile(s.id)}));
  if(allowed("Заявки и воронка"))db.leads.filter(l=>hit(l.name,l.phone)).slice(0,6).forEach(l=>res.push({k:"Заявка",t:l.name,sub:l.stage+" · "+l.phone,fn:()=>openDeal(l.id)}));
  if(allowed("Группы"))db.groups.filter(g=>hit(g.name,g.teacher)).slice(0,3).forEach(g=>res.push({k:"Группа",t:g.name,sub:(g.teacher||"")+" · "+(g.days||""),fn:()=>go("Группы")}));
  box.innerHTML=res.map((r,i)=>`<button data-i="${i}"><span><b>${esc(r.t)}</b><small>${esc(r.sub)}</small></span><span class="k">${r.k}</span></button>`).join("")||'<div class="empty" style="padding:14px">Ничего не найдено</div>';
  box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{box.classList.remove("on");$("gq").value="";res[+b.dataset.i].fn()});

/* Импорт операций из Excel / Google Таблицы (CSV) */
function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":",";
  const split=l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===sep&&!q){out.push(cur);cur=""}else cur+=c}out.push(cur);return out.map(v=>v.trim())};
  return lines.map(split);
}
function importCSV(e){
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    const rows=parseCSV(t);if(rows.length<2){toast("В файле нет строк с операциями");return}
    const H=rows[0].map(h=>h.toLowerCase());
    const col=(...names)=>H.findIndex(h=>names.some(n=>h.includes(n)));
    const ci={date:col("дата","date"),type:col("тип","type"),amount:col("сумма","amount"),desc:col("описан","назнач","description"),branch:col("филиал","branch"),cat:col("стат","катег","category"),acc:col("счёт","счет","account")};
    if(ci.date<0||ci.amount<0){toast("Нужны хотя бы столбцы «Дата» и «Сумма»");return}
    const normDate=v=>{const m=v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})$/);if(m)return (m[3].length===2?"20"+m[3]:m[3])+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");return v.slice(0,10)};
    let n=0,skip=0;
    rows.slice(1).forEach(r=>{
      const amt=Number(String(r[ci.amount]||"").replace(/\s/g,"").replace(",",".").replace(/[^\d.-]/g,""));const date=normDate(r[ci.date]||"");
      if(!amt||!/^\d{4}-\d{2}-\d{2}$/.test(date)){skip++;return}
      const tp=ci.type>=0?(r[ci.type]||""):"";const type=/дох|прих|income/i.test(tp)?"Доход":"Расход";
      const bn=ci.branch>=0?(r[ci.branch]||"").toLowerCase():"";const br=db.branches.find(b=>bn&&b.name.toLowerCase().includes(bn))||db.branches.find(b=>bn&&bn.includes(b.name.toLowerCase()));
      const an=ci.acc>=0?(r[ci.acc]||""):"";const acc=settings.accounts.find(a=>an&&a.name.toLowerCase()===an.toLowerCase());
      const cat=ci.cat>=0?(r[ci.cat]||""):"";
      db.payments.push({id:nid(),date,type,action:type==="Доход"?"Продажи":"Себестоимость",category:cat||"Прочее",description:ci.desc>=0?(r[ci.desc]||"Импорт"):"Импорт из таблицы",amount:Math.abs(amt),branch:br?br.id:(db.branches[0]?.id||1),account:acc?acc.name:settings.accounts[0]?.name});n++;
    });
    settings.lastImport=new Date().toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
    logAct("Импорт из таблицы: "+n+" операций");persist();render();
    toast(n?`Загружено ${plural(n,"операция","операции","операций")}${skip?", пропущено строк: "+skip:""}`:"Не нашлось строк с датой и суммой");
  });
  e.target.value="";
}

async function deleteItem(key,id){

  if(!await ask(`Удалить ${NAMES[K2T[key]]}${x.name?" «"+x.name+"»":""}? Это действие нельзя отменить.`))return;
  db[key]=db[key].filter(i=>i.id!==id);
  if(key==="students"){db.memberships=db.memberships.filter(m=>m.student!==id);db.attendance=db.attendance.filter(a=>a.student!==id)}
  if(key==="leads"||key==="renewals")db.tasks=db.tasks.filter(t=>t.dealId!==id);
  logAct("Удалено: "+NAMES[K2T[key]]+(x.name?" «"+x.name+"»":""));
  persist();render();toast("Запись удалена");
}

function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.branches||!d.students)throw Error();
    if(!await ask("Заменить текущие данные данными из файла?","Заменить"))return;
    COLS.forEach(k=>db[k]=Array.isArray(d[k])?d[k]:[]);persist();init();toast("Резервная копия восстановлена")}
    catch(err){toast("Это не копия CRM: выберите файл, сохранённый кнопкой «Скачать копию»")}};
  r.readAsText(f);
}

const XL={
  crcT:(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})(),
  crc(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=XL.crcT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0},
  zip(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;
    for(const f of files){const nm=enc.encode(f.name),d=f.data,crc=XL.crc(d);
      const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
      parts.push(new Uint8Array(h.buffer),nm,d);
      const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
      central.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
    const cd=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cd,true);e.setUint32(16,off,true);
    return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})},
  x:s=>String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
  col(i){let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s},
  sheetName:n=>n.replace(/[\\/?*\[\]:]/g," ").slice(0,31),
  book(sheets){
    const enc=new TextEncoder(),F=[],head='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    sheets.forEach((sh,si)=>{
      const w=sh.cols.map((c,ci)=>Math.min(48,Math.max(c.h.length+3,c.t==="money"?14:c.t==="date"?12:6,...sh.rows.slice(0,800).map(r=>String(r[ci]??"").length+2))));
      const cell=(v,r,ci,t,hd)=>{if(v===null||v===undefined||v==="")return"";const ref=XL.col(ci)+r;
        if(hd)return `<c r="${ref}" t="inlineStr" s="1"><is><t>${XL.x(v)}</t></is></c>`;
        if((t==="n"||t==="money")&&v!==""&&isFinite(+v))return `<c r="${ref}" s="${t==="money"?2:0}"><v>${+v}</v></c>`;
        if(t==="date"&&/^\d{4}-\d{2}-\d{2}/.test(v)){const ms=Date.UTC(+v.slice(0,4),+v.slice(5,7)-1,+v.slice(8,10));const tm=/T(\d{2}):(\d{2})/.exec(v);const frac=tm?(+tm[1]*60+ +tm[2])/1440:0;return `<c r="${ref}" s="${tm?4:3}"><v>${ms/864e5+25569+frac}</v></c>`}
        return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${XL.x(v)}</t></is></c>`};
      let x=head+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"'+(si===0?' tabSelected="1"':'')+'><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>'+w.map((v,i)=>`<col min="${i+1}" max="${i+1}" width="${v}" customWidth="1"/>`).join("")+'</cols><sheetData>';
      x+=`<row r="1">${sh.cols.map((c,ci)=>cell(c.h,1,ci,"s",1)).join("")}</row>`;
      sh.rows.forEach((row,ri)=>{x+=`<row r="${ri+2}">${row.map((v,ci)=>cell(v,ri+2,ci,sh.cols[ci].t)).join("")}</row>`});
      x+='</sheetData>'+(sh.rows.length?`<autoFilter ref="A1:${XL.col(sh.cols.length-1)}${sh.rows.length+1}"/>`:"")+'<pageMargins left="0.5" right="0.5" top="0.75" bottom="0.75" header="0.3" footer="0.3"/></worksheet>';
      F.push({name:`xl/worksheets/sheet${si+1}.xml`,data:enc.encode(x)})});
    const names=sheets.map(s=>XL.sheetName(s.name));
    const dn=sheets.map((sh,i)=>sh.rows.length?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${XL.x(names[i]).replace(/'/g,"''")}'!$A$1:$${XL.col(sh.cols.length-1)}$${sh.rows.length+1}</definedName>`:"").join("");
    F.push({name:"xl/workbook.xml",data:enc.encode(head+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'+names.map((n,i)=>`<sheet name="${XL.x(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+'</sheets>'+(dn?`<definedNames>${dn}</definedNames>`:"")+'</workbook>')});
    F.push({name:"xl/_rels/workbook.xml.rels",data:enc.encode(head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+names.map((n,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+`<Relationship Id="rId${names.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`)});
    F.push({name:"xl/styles.xml",data:enc.encode(head+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="3"><numFmt numFmtId="164" formatCode="#,##0 &quot;₸&quot;"/><numFmt numFmtId="165" formatCode="dd.mm.yyyy"/><numFmt numFmtId="166" formatCode="dd.mm.yyyy hh:mm"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF1E2BC"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FFC8A55F"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>')});
    F.unshift({name:"_rels/.rels",data:enc.encode(head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
    F.unshift({name:"[Content_Types].xml",data:enc.encode(head+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+names.map((n,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>')});
    return XL.zip(F)}
};

function toLocalISO(v){const d=new Date(v);if(isNaN(d))return"";const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}

function fileTag(){const v=$("branchFilter").value;const b=v&&v!=="all"?"-"+branchName(+v).split(/[ ,]/)[0]:"";return b+"-"+today()}
async function saveFile(name,blob){
  try{const dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:blob});toast("Файл сохранён: "+name);return}}
  catch(e){if(e&&e.code==="declined"){toast("Сохранение отменено");return}
    if(e&&e.code&&!["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code)){toast("Не удалось сохранить файл ("+e.code+")");return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("Файл скачивается: "+name);
}

/* ===== LTV и профиль ученика ===== */
function ltv(id){return db.memberships.filter(m=>m.student===id).reduce((a,m)=>a+Number(m.price||0),0)}
function canLtv(){return allowed("Финансы")||allowed("Абонементы")}
/* Средний LTV платящего ученика: на него опирается прогноз по воронке */
function avgLtv(list=db.students){const v=list.map(s=>ltv(s.id)).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
/* Уже клиент: ученики с тем же телефоном (родитель приводит второго ребёнка) */
function clientsByPhone(phone){const p=nd(phone);return p?db.students.filter(s=>nd(s.phone)===p):[]}
function ltvCard(){
  const st=db.students.filter(inBranch),v=st.map(s=>ltv(s.id)),tot=v.reduce((a,b)=>a+b,0),pay=v.filter(x=>x>0).length;
  const top=[...st].filter(s=>ltv(s.id)>0).sort((a,b)=>ltv(b.id)-ltv(a.id)).slice(0,5);
  const srcs=[...new Set(st.map(s=>s.source).filter(x=>x&&x!=="—"))].map(src=>{const g=st.filter(s=>s.source===src);return [src,Math.round(avgLtv(g)),g.length]}).sort((a,b)=>b[1]-a[1]);
  const maxS=Math.max(1,...srcs.map(r=>r[1]));
  return `<div class="grid2"><div class="card"><h3>LTV по источникам</h3><div class="hint">Средний LTV платящего ученика по каналу, откуда он пришёл. Помогает понять, в какую рекламу вкладывать.</div>${srcs.map(([src,v,n])=>`<div class="barrow"><span>${esc(src)} <span class="sub">· ${plural(n,"ученик","ученика","учеников")}</span></span><div class="bar"><i style="width:${v/maxS*100}%;background:var(--s4)"></i></div><b class="num" style="width:auto">${money(v)}</b></div>`).join("")||'<div class="empty">Укажите у учеников, откуда они пришли</div>'}</div>
  <div class="card"><h3>LTV учеников</h3><div class="hint">Сумма купленных абонементов на одного ученика</div><div class="row"><b>Средний LTV платящих</b><span class="num">${money(pay?tot/pay:0)}</span></div><div class="row"><b>Общий LTV</b><span class="num">${money(tot)}</span></div><div class="row"><b>Платящих учеников</b><span>${pay} из ${st.length}</span></div>${top.map(s=>`<div class="row"><b>${esc(s.name)}</b><span class="num">${money(ltv(s.id))}</span></div>`).join("")}</div></div>`;
}

function ageOf(b){if(!b)return"—";const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a}
function dur(s){if(!s)return"—";const days=Math.max(0,Math.floor((Date.now()-new Date(s))/864e5)),m=Math.floor(days/30.4);return (m>=1?m+" мес. ":"")+"("+days+" дн.)"}
function setPhoto(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,320/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const s=db.students.find(x=>x.id===id);s.photo=c.toDataURL("image/jpeg",.7);logAct("Фото ученика: "+s.name);persist();openProfile(id);toast("Фото сохранено")};im.src=r.result};r.readAsDataURL(f)}
function addNote(id){const v=$("pnote").value.trim();if(!v){$("pnote").focus();return}const s=db.students.find(x=>x.id===id);(s.notes=s.notes||[]).unshift({t:v,role,at:new Date().toLocaleString("ru-RU")});logAct("Заметка: "+s.name);persist();openProfile(id);toast("Заметка добавлена")}
function openProfile(id){
  const s=db.students.find(x=>x.id===id);if(!s)return;
  closeProfile();
  const t=today();
  const att=db.attendance.filter(a=>a.student===id).sort((a,b)=>b.date.localeCompare(a.date));
  const pres=att.filter(a=>a.status==="Присутствовал"||a.status==="Опоздал");
  const miss=att.filter(a=>a.status==="Отсутствовал"||a.status==="Уважительная причина");
  const last=pres[0]?.date||"";
  const since=s.since||(att.length?att[att.length-1].date:"");
  const nl=db.lessons.filter(l=>l.group===s.group&&l.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  const ms=db.memberships.filter(m=>m.student===id).sort((a,b)=>(b.expires||"").localeCompare(a.expires||""));
  const act=ms.find(m=>m.total-m.used>0&&(!m.expires||m.expires>=t));
  const R=(a,b)=>`<div class="row"><b>${a}</b><span>${b}</span></div>`;
  const ini=esc((s.name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join(""));
  const d=document.createElement("div");d.id="prof";d.className="modalbg";d.style.display="grid";
  d.onclick=e=>{if(e.target===d)closeProfile()};
  d.innerHTML=`<div class="modal" style="width:min(580px,100%)" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
  <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${s.photo?`<img class="avatar" alt="" src="${s.photo}">`:`<div class="avatar">${ini}</div>`}<div><h2 style="margin:0 0 6px">${esc(s.name)}</h2>${status(s.status)} <span class="tag blue">${esc(s.kind||"—")}</span></div></div>
  <label class="btn secondary" style="margin-bottom:12px;cursor:pointer">${s.photo?"Заменить фото":"Загрузить фото"}<input type="file" accept="image/*" hidden onchange="setPhoto(${id},this)"></label>
  <div class="card"><h3>Об ученике</h3>${s.parent?R("Родитель",esc(s.parent)):""}${R("Телефон",esc(s.phone))}${R("Возраст",ageOf(s.birth))}${R("Дата рождения",esc(s.birth||"—"))}${R("Филиал",esc(branchName(s.branch)))}${R("Группа",esc(s.group||"—"))}${R("Тренер",esc(db.groups.find(g=>g.name===s.group)?.teacher||"—"))}</div>
  <div class="card" style="margin-top:12px"><h3>Занятия</h3>${R("Занимается с",esc(since||"—"))}${R("Срок занятий",dur(since))}${R("Посещено занятий",pres.length)}${R("Пропусков",miss.length)}${R("Последнее занятие",esc(last||"—"))}${R("Следующее занятие",nl?esc(nl.date+" · "+nl.time):"—")}${s.status==="Архив"?R("Закончил занятия",esc(last||"—")):""}</div>
  <div class="card" style="margin-top:12px"><h3>Абонемент</h3>${act?R("Остаток занятий",(act.total-act.used)+" из "+act.total)+R("Действует до",esc(act.expires||"—")):'<div class="empty">Нет активного абонемента</div>'}${ms.map(m=>R(esc(m.title)+" · "+money(m.price),m.used+"/"+m.total+" · до "+esc(m.expires||"—"))).join("")}</div>
  ${canLtv()?`<div class="card" style="margin-top:12px"><h3>LTV</h3>${R("LTV ученика",money(ltv(id)))}${R("Покупок абонементов",ms.length)}${R("Средний чек",ms.length?money(ltv(id)/ms.length):"—")}${R("В месяц, в среднем",since?money(ltv(id)/Math.max(1,Math.floor(Math.max(0,Date.now()-new Date(since))/864e5/30.4))):"—")}</div>`:""}
  <div class="card" style="margin-top:12px"><h3>Последние посещения</h3>${att.slice(0,8).map(a=>R(esc(a.date)+" · "+esc(a.group||""),status(a.status))).join("")||'<div class="empty">Отметок пока нет</div>'}</div>
  <div class="card" style="margin-top:12px"><h3>Заметки</h3>${(s.notes||[]).map(n=>R(esc(n.t),esc(n.role)+" · "+esc(n.at))).join("")}<input class="field" id="pnote" placeholder="Новая заметка" aria-label="Новая заметка" style="margin-top:8px"><div class="modalfoot"><button class="btn" onclick="addNote(${id})">Добавить заметку</button></div></div>
  <div class="modalfoot"><button class="btn secondary" onclick="closeProfile()">Закрыть</button></div></div>`;
  document.body.append(d);
}

/* ===== Вход (демо) ===== */
function logout(){try{sessionStorage.removeItem(SKEY)}catch(e){}me=null;role=null;loginScreen()}
function fillLogin(p,w){$("lg_p").value="+"+p;$("lg_w").value=w}
function doLogin(e){
  e?.preventDefault();
  const u=users.find(x=>x.phone===nd($("lg_p").value)&&x.pass===$("lg_w").value);
  if(u)enter(u);else toast("Неверный номер или пароль");
}

function enter(u){
  try{sessionStorage.setItem(SKEY,u.phone)}catch(e){}
  me=u;role=u.role;

  init();
}
function addUser(){
  const g=id=>$(id).value.trim();
  const phone=nd(g("nu_phone")),name=g("nu_name"),pass=g("nu_pass");
  if(!phone||!name||!pass){toast("Заполните имя, номер и пароль");return}
  if(phone.length<11){toast("Введите номер полностью, например +7 701 000 00 00");return}
  if(users.some(x=>x.phone===phone)){toast("Такой номер уже есть");return}
  users.push({phone,pass,name,role:g("nu_role")});
  logAct("Добавлен сотрудник: "+name+" ("+g("nu_role")+")");persist();render();toast("Сотрудник добавлен");
}
async function removeUser(phone){
  const u=users.find(x=>x.phone===phone);if(!u)return;
  if(!await ask(`Убрать сотрудника «${u.name}»? Он больше не сможет войти.`,"Убрать"))return;
  users=users.filter(x=>x.phone!==phone);logAct("Убран сотрудник: "+u.name);persist();render();toast("Сотрудник убран");
}

  let r;try{r=await fetch(AI_URL,{method:"POST",headers:{"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},body:JSON.stringify({model:aiGet(AI_MKEY)||AI_MODELS[0][0],messages,max_tokens:max,temperature:.4})})}
  catch(e){throw new Error("Нет связи с models.github.ai (сеть или блокировка браузером).")}
  const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(_){}
  if(!r.ok){const m=j?.error?.message||j?.message||t.slice(0,200);throw new Error(r.status===401?"Токен недействителен или без права Models: Read.":r.status===429?"Исчерпан бесплатный лимит запросов. Попробуйте позже или другую модель.":"Ошибка "+r.status+": "+m)}

}

    msgs=[{role:"system",content:"Ты — Аксакал, старейшина «города агентов» CRM студии кавказских танцев «DJIGIT TAU» (Казахстан). Агенты принесли тебе отчёты обхода. Сведи их в единый план: 5 приоритетных действий на сегодня (что сделать, кто из сотрудников — руководитель, администратор, отдел продаж или тренер), затем одна строка о главном риске месяца. "+base+"\n\nОтчёты агентов:\n"+cityReport()+"\n\nОбщая сводка CRM:\n"+aiContext()},
      {role:"user",content:q||"Составь план на сегодня."}];
    walkers=CITY.map((a,i)=>({a,rt:cityRoute(a,i)}));}
  else{const a=CITY.find(x=>x.id===id),r=cityScan(a);
    msgs=[{role:"system",content:a.persona+" "+base+"\n\nТвой обход:\n"+r.f.map(x=>"- "+x.t).join("\n")+"\n\nОбщая сводка CRM:\n"+aiContext()},{role:"user",content:q||"Что сделать сегодня в твоей зоне? Дай 3–5 действий по приоритету."}];
    walkers=[{a,rt:cityRoute(a,CITY.indexOf(a))}]}
  walkers.forEach(w=>cityBusyMark(w.a,true));
  const [res]=await Promise.all([aiCall(msgs,1000).then(t=>({text:t}),e=>({text:e.message,err:true})),...walkers.map(w=>cityWalk(w.a,w.rt))]);
  cityAI[id]=res;if(!res.err)cityLog(id==="mayor"?MAYOR.nm:CITY.find(x=>x.id===id).nm,id==="mayor"?"Совет города: составлен план на день":"Ответ на вопрос"+(q?": «"+q.slice(0,60)+"»":""));
  await Promise.all(walkers.map(w=>cityWalk(w.a,w.rt.slice().reverse())));walkers.forEach(w=>cityBusyMark(w.a,false));
  persist();citySetBusy(false);cityRefresh()}
function wireCityPanel(){const p=$("cityPanel");if(!p)return;
  p.querySelectorAll("[data-agent]").forEach(b=>b.onclick=()=>{citySel=b.dataset.agent;cityRefresh()});
  p.querySelectorAll("[data-cback]").forEach(b=>b.onclick=()=>{citySel="mayor";cityRefresh()});
  document.querySelectorAll("[data-cgo]").forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.cgo)});
  p.querySelectorAll("[data-cact]").forEach(b=>b.onclick=async()=>{const [aid,i]=b.dataset.cact.split(":"),a=CITY.find(x=>x.id===aid),it=cityRes[aid]?.f[+i];if(!it?.act)return;
    if(it.act.go){go(it.act.go);return}
    b.disabled=true;let msg;try{msg=await it.act.run()}catch(e){msg=e.message;b.disabled=false;toast(msg);cityLog(a.nm,"Ошибка: "+msg);persist();cityRefresh();return}
    logAct(a.nm+" ("+a.role+"): "+msg);cityLog(a.nm,msg);persist();CITY.forEach(cityScan);toast(msg);render()});
  if(citySel==="amo")wireAmo(p);
  p.querySelector('[data-wa="send"]')?.addEventListener("click",e=>waSendSummary(e.target));
  const f=$("cityForm"),q=$("cityQ");if(f){q.onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))f.requestSubmit()};
    f.onsubmit=e=>{e.preventDefault();cityAskAI(citySel,q.value.trim())};if(cityBusy)$("cityAsk").disabled=true}}
/* ===== Автоматика агентов: автообход, пока CRM открыта, и WhatsApp через функцию agents-cron (WhatsApp Cloud API).
   Адрес функции и ключ хранятся только в этом браузере. */
const WA_KEY="djigit_crm_wa";
const waCfg=()=>{try{return JSON.parse(localStorage.getItem(WA_KEY)||"{}")}catch(e){return{}}};
const waOn=()=>{const c=waCfg();return !!(c.url&&c.key)};
let cityAutoAt="";
async function waPost(payload){const c=waCfg();if(!waOn())throw new Error("WhatsApp не подключён");let r;
  try{r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"application/json","x-agents-key":c.key},body:JSON.stringify(payload)})}catch(e){throw new Error("Нет связи с функцией agents-cron")}
  const j=await r.json().catch(()=>({}));
  if(r.status===401)throw new Error("Функция не приняла ключ агентов");
  if(!r.ok)throw new Error("WhatsApp: "+(j.error||(j.errors||[]).join("; ")||"ошибка "+r.status));
  return j}
function cityWaText(){const d=new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const all=CITY.flatMap(a=>cIssues(a).map(x=>({a,x}))).sort((p,q)=>(p.x.lv==="red"?0:1)-(q.x.lv==="red"?0:1));
  const lines=all.slice(0,8).map(({a,x})=>(x.lv==="red"?"🔴 ":"🟡 ")+a.nm+": "+x.t);
  const m=cityAI.mayor,plan=m&&!m.err&&m.text!=="Думаю…"?"\nПлан Аксакала:\n"+m.text:"";
  return "Сводка агентов DJIGIT TAU, "+d+"\n"+(lines.join("\n")||"Всё спокойно")+plan}
async function waSendSummary(btn){if(btn)btn.disabled=true;
  try{CITY.forEach(cityScan);const r=await waPost({text:cityWaText()});cityLog(MAYOR.nm,"Сводка отправлена в WhatsApp: получателей "+r.sent);toast("Сводка отправлена в WhatsApp")}
  catch(e){cityLog(MAYOR.nm,e.message);toast(e.message)}
  persist();if(btn)btn.disabled=false;cityRefresh()}
async function cityAutoRun(){if(!me||!allowed("Город агентов"))return;
  if(amoOn()&&Date.now()-(amoData?.at||0)>25*6e4){try{await amoLoad();amoErr=""}catch(e){amoErr=e.message}}
  CITY.forEach(cityScan);cityAutoAt=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  if(waOn()&&settings.waDaily&&settings.waLastDaily!==today()&&new Date().getHours()>=8){settings.waLastDaily=today();
    try{const r=await waPost({text:cityWaText()});cityLog(MAYOR.nm,"Утренняя сводка отправлена в WhatsApp: получателей "+r.sent)}catch(e){cityLog(MAYOR.nm,e.message)}persist()}
  updateBell();if(current==="Город агентов"&&!cityBusy)cityRefresh()}
function cityAutoStart(){clearInterval(cityAutoStart.h);if(!me||!allowed("Город агентов")||settings.agentsAuto===false)return;
  cityAutoRun();cityAutoStart.h=setInterval(cityAutoRun,30*6e4)}
function cityBellItem(){if(!allowed("Город агентов")||settings.agentsAuto===false)return null;
  const red=CITY.flatMap(a=>(cityRes[a.id]?.f||[]).filter(x=>x.lv==="red").map(x=>a.nm+": "+x.t));
  return red.length?{t:"Агенты: "+plural(red.length,"срочная находка","срочные находки","срочных находок"),s:red[0],go:"Город агентов"}:null}
function cityAutoCard(){const c=waCfg();return `<div class="card" style="margin-top:16px" id="cityAuto"><h3>Автоматика и WhatsApp</h3>
  <label class="cchk"><input type="checkbox" id="caAuto" ${settings.agentsAuto!==false?"checked":""}><span>Автообход при входе в CRM и каждые 30 минут, пока CRM открыта. Срочные находки появляются в колокольчике.</span></label>
  <div class="hint">Последний автообход: ${cityAutoAt||"ещё не было"}</div>
  <details class="amobox"${waOn()?"":" open"}><summary>WhatsApp${waOn()?" · подключён":""}</summary>
  <div class="hint">Сообщения отправляет функция <b>agents-cron</b> в Supabase через официальный WhatsApp Cloud API. Она же по расписанию проверяет amoCRM и присылает отчёт, даже когда CRM закрыта. Настройка описана в supabase/functions/agents-cron/README.md.</div>
  <div class="formfield"><label for="waUrl">Адрес функции</label><input class="field" id="waUrl" value="${esc(c.url||SB_FN+"agents-cron")}"></div>
  <div class="formfield"><label for="waKey">Ключ агентов (Supabase → Project Settings → Vault → agents_key)</label><input class="field" id="waKey" type="password" autocomplete="off" value="${esc(c.key||"")}"></div>
  <label class="cchk"><input type="checkbox" id="caDaily" ${settings.waDaily?"checked":""}><span>Утренняя сводка в WhatsApp: при первом обходе за день, после 8:00</span></label>
  <div class="actions"><button class="btn" data-wa="save">Сохранить</button>${waOn()?`<button class="btn secondary" data-wa="test">Проверить связь</button><button class="btn secondary" data-wa="send">Отправить сводку сейчас</button><button class="btn secondary" data-wa="off">Отключить</button>`:""}</div></details></div>`}
function wireCityAuto(){const box=$("cityAuto");if(!box)return;const q=s=>box.querySelector(`[data-wa="${s}"]`);
  $("caAuto").onchange=e=>{settings.agentsAuto=e.target.checked;persist();cityAutoStart();if(!e.target.checked){clearInterval(cityAutoStart.h);updateBell()}toast(e.target.checked?"Автообход включён":"Автообход выключен")};
  $("caDaily").onchange=e=>{settings.waDaily=e.target.checked;persist()};
  q("save").onclick=()=>{const c={url:$("waUrl").value.trim(),key:$("waKey").value.trim()};
    if(!/^https:\/\//.test(c.url)){toast("Адрес функции должен начинаться с https://");return}if(!c.key){toast("Вставьте ключ агентов");return}
    try{localStorage.setItem(WA_KEY,JSON.stringify(c))}catch(e){}settings.waDaily=$("caDaily").checked;persist();toast("WhatsApp сохранён");render()};
  q("test")&&(q("test").onclick=async e=>{e.target.disabled=true;try{const r=await waPost({test:true});toast("Проверочное сообщение отправлено: "+r.sent+(r.errors?.length?" · ошибки: "+r.errors.join("; "):""))}catch(err){toast(err.message)}e.target.disabled=false});
  q("send")&&(q("send").onclick=e=>waSendSummary(e.target));
  q("off")&&(q("off").onclick=async()=>{if(!await ask("Отключить WhatsApp в этом браузере?","Отключить"))return;try{localStorage.removeItem(WA_KEY)}catch(e){}render()})}
views["Город агентов"]=()=>{CITY.forEach(cityScan);return `
  <div class="card citybar"><div><h3>Семь агентов и старейшина</h3><div class="hint">Каждый агент живёт в своём здании и следит за своей зоной CRM. «Обход города» — агенты проверяют данные и приносят находки в штаб. Нажмите на здание, чтобы открыть агента.</div></div>

  m.onclick=e=>{const g=e.target.closest("[data-agent]");if(!g)return;citySel=g.dataset.agent;cityRefresh();if(innerWidth<900)$("cityPanel").scrollIntoView({behavior:"smooth",block:"start"})};
  m.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset?.agent){e.preventDefault();citySel=e.target.dataset.agent;cityRefresh()}};
  document.querySelector('[data-act="cityrun"]').onclick=cityTour;
  document.querySelector('[data-act="citycouncil"]').onclick=()=>{citySel="mayor";cityRefresh();cityAskAI("mayor","")};

(async function boot(){
  let st=null;try{const z=localStorage.getItem(ZKEY);st=z&&window.DecompressionStream?JSON.parse(await gunz(z)):JSON.parse(localStorage.getItem(UKEY))}catch(e){try{st=JSON.parse(localStorage.getItem(UKEY))}catch(_){}}
  if(st&&st.db){COLS.forEach(k=>db[k]=Array.isArray(st.db[k])?st.db[k]:[]);settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),st.settings||{});users=Array.isArray(st.users)&&st.users.length?st.users:DEMO_USERS.map(u=>({...u}))}
  else{cleanSeed();users=DEMO_USERS.map(u=>({...u}));persist()}
  db.leads.forEach(l=>{if(l.price===undefined)l.price=0;l.pipeline=l.pipeline||"sales";l.feed=l.feed||[];if(l.stage===LOST&&!l.reason)l.reason="Другое"});
  settings.robots=settings.robots||{};settings.templates=settings.templates||{};if(!settings.sla)settings.sla=15;
  if(XLS&&settings.xlsVersion!==XLS.v){importXls();persist()}
  {const cm=new Date().toISOString().slice(0,7);if(!db.payments.some(p=>isInc(p)&&(p.date||"").startsWith(cm))){const last=db.payments.filter(isInc).map(p=>(p.date||"").slice(0,7)).filter(Boolean).sort().pop();if(last)panelMonth=last}}
  let sp=null;try{sp=sessionStorage.getItem(SKEY)}catch(e){}
  const u=users.find(x=>x.phone===sp);
  if(u)enter(u);else loginScreen();
})();
