<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>DJIGIT TAU CRM · ДЕМО</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#302e29;--text:#f3f0e9;--muted:#918b80;--gold:#c7a35b;--gold2:#e0c17b;--green:#83ae83;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:245px;background:#151515;border-right:1px solid var(--line);padding:20px 14px;position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;overflow:auto;z-index:10}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,var(--gold2),#8a6732);display:grid;place-items:center;color:#17130b;font-size:22px}
.brand b{letter-spacing:1.5px}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:2px;margin-top:4px}
.navgroup{margin-top:22px}
.navtitle{font-size:9px;color:#777168;letter-spacing:1.4px;padding:0 10px 8px;font-weight:bold}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#b8b2a7;padding:11px 10px;border-radius:8px;text-align:left;font-size:12px;margin:2px 0}
.nav button:hover,.nav button.active{background:#332b1e;color:var(--gold2)}
.nav .ico{width:18px;text-align:center;font-size:16px}
.sidefoot{margin-top:24px;color:#827c70;font-size:10px;padding:10px}
.main{margin-left:245px;width:calc(100% - 245px);min-width:0}
.top{min-height:66px;background:#151515;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 28px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;gap:8px}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:#eee}
.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.select{background:#211f1b;border:1px solid #49402e;color:#e7d8b8;border-radius:8px;padding:9px 11px;font-size:11px}
.page{max-width:1500px;margin:auto;padding:28px}
.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.eyebrow{font-size:9px;color:var(--gold);letter-spacing:1.8px;font-weight:bold}
.heading h1{font-size:26px;margin:7px 0 5px}.sub{font-size:11px;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:10px 14px;background:linear-gradient(135deg,var(--gold2),#a47b3b);color:#17130b;font-weight:bold;font-size:11px}
.btn.secondary{background:#2a2823;color:#e8d8b5;border:1px solid #4a402e}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:14px}
.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px}
.stat label{color:#aaa397;font-size:11px}.stat strong{display:block;font-size:25px;margin:10px 0 5px}.stat small{color:var(--green);font-size:10px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}
.card h3{font-size:13px;margin:0 0 6px}.card .hint{font-size:10px;color:var(--muted);margin-bottom:15px}
.barrow{display:grid;grid-template-columns:130px 1fr 30px;gap:9px;align-items:center;margin:13px 0;font-size:10px;color:#bcb5a8}
.bar{height:7px;background:#333029;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:11px}
.row span{color:#aaa397;text-align:right}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}
.table th{text-align:left;color:#827c72;font-size:9px;padding:12px;border-bottom:1px solid var(--line)}
.table td{padding:13px 12px;border-bottom:1px solid #292722;font-size:10px;color:#c8c1b5}.table td b{color:#f1ece2}
.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#292f25;color:#9bc293;font-size:9px}
.tag.warn{background:#382d1e;color:#e0ba73}.tag.blue{background:#202c36;color:#9dbad2}
.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:14px}.toolbar input{max-width:350px;flex:1}
.field{width:100%;padding:11px;background:#111;border:1px solid #403c33;color:#fff;border-radius:7px;font-size:11px;outline:none}.field:focus{border-color:var(--gold)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.columns{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:11px;overflow:auto}
.col{background:#181818;border:1px solid var(--line);border-radius:10px;padding:11px;min-width:180px}
.colhead{font-size:11px;font-weight:bold;padding:5px 2px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.lead{background:#24221e;border:1px solid #39352d;border-radius:8px;padding:11px;margin-top:9px}
.lead b{font-size:11px}.lead small{display:block;color:var(--muted);font-size:9px;margin-top:6px}
.actions{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.mini{border:1px solid #51452e;background:#30291e;color:#d9bb7a;border-radius:6px;padding:5px 7px;font-size:9px}
.modalbg{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:30;padding:14px}
.modal{width:min(460px,100%);background:#1c1b18;border:1px solid #55462e;border-radius:13px;padding:20px;max-height:90vh;overflow:auto}
.modal h2{font-size:18px;margin:0 0 18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formfield{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.formfield label{font-size:10px;color:#bdb5a8}.formfield.full{grid-column:1/-1}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:18px;right:18px;background:#2a281f;border:1px solid #76603a;color:#f0ddb2;padding:12px 16px;border-radius:8px;z-index:50;font-size:11px}
.hamb{display:none;background:none;color:#fff;border:0;font-size:20px}
.notice{background:#29251d;border:1px solid #55452b;color:#d8c397;border-radius:8px;padding:12px;font-size:10px;line-height:1.6;margin-bottom:14px}
@media(max-width:950px){.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.stats{grid-template-columns:repeat(2,1fr)}.page{padding:20px}.grid2{grid-template-columns:1fr}}
@media(max-width:680px){
.side{transform:translateX(-100%);transition:.2s;width:250px}.side.open{transform:none}
.main{margin-left:0;width:100%}.top{padding:8px 12px}.hamb{display:block}.crumb{flex:1}
.page{padding:18px 12px}.heading h1{font-size:22px}
.heading .btn{font-size:0;padding:10px}.heading .btn:after{content:"+";font-size:18px}
.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.grid2{gap:9px}
.formgrid{grid-template-columns:1fr}.formfield.full{grid-column:auto}
.toolbar input{max-width:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
<div class="brand"><div class="logo">♛</div><div><b>DJIGIT TAU</b><small>STUDIO CRM</small></div></div>
<div class="nav" id="nav"></div>
<div class="sidefoot">● ДЕМО · данные в этом браузере</div>
</aside>
<main class="main">
<header class="top">
<button class="hamb" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
<div class="crumb">DJIGIT TAU　›　<b id="crumb">Главная</b></div>
<div class="topright">
<span class="sub" id="whoami"></span>
<select class="select" id="branchFilter" onchange="render()"></select>
<button class="btn secondary" id="expBtn" onclick="exportData()">Экспорт</button>
</div>
</header>
<div class="page">
<div class="heading">
<div><div class="eyebrow" id="eyebrow">УПРАВЛЕНИЕ СТУДИЕЙ</div><h1 id="title">Главная</h1><div class="sub" id="subtitle"></div></div>
<button class="btn" id="primary" onclick="openCreate()">＋ Добавить</button>
</div>
<div id="content"></div>
</div>
</main>
</div>
<div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()">
<form class="modal" onsubmit="saveForm(event)">
<h2 id="modalTitle">Добавить</h2>
<div id="formFields"></div>
<div class="modalfoot"><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" type="submit">Сохранить</button></div>
</form>
</div>
<div id="toast" class="toast" style="display:none"></div>
<script>
const sections=[
["РАБОТА С КЛИЕНТАМИ",["Главная","Заявки и воронка","Ученики","Посещаемость"]],
["СТУДИЯ",["Расписание","Группы","Тренеры","Абонементы"]],
["УПРАВЛЕНИЕ",["Финансы","Филиалы","Аналитика","Команда","Журнал","Настройки"]]
];
const icons={"Главная":"▦","Заявки и воронка":"◫","Ученики":"♙","Посещаемость":"✓","Расписание":"▦","Группы":"♧","Тренеры":"♙","Абонементы":"▤","Финансы":"₸","Филиалы":"⌂","Аналитика":"◷","Журнал":"☰","Команда":"♟","Настройки":"⚙"};
/* Какие разделы видит каждая роль. null = всё. */
const ROLES={
"Руководитель":null,
"Администратор":["Ученики","Посещаемость","Расписание","Группы","Абонементы","Финансы"],
"Тренер":["Посещаемость","Расписание","Группы","Ученики"],
"Отдел продаж":["Заявки и воронка","Ученики","Абонементы"]
};
const STAGES=["Новая заявка","Связались","Пробное занятие","Купили абонемент"];
const seed={
branches:[{id:1,name:"Алматы · Центр",address:""},{id:2,name:"Алматы · Восток",address:""},{id:3,name:"Алматы · Запад",address:""}],
students:[
{id:1,name:"Алиев Тимур",phone:"+7 707 123-45-67",branch:1,group:"Младшая группа",status:"Активен",birth:"2016-04-12"},
{id:2,name:"Мамедова Амина",phone:"+7 701 222-18-40",branch:2,group:"Средняя группа",status:"Активен",birth:"2013-08-22"},
{id:3,name:"Гусейнов Рамиль",phone:"+7 777 555-09-11",branch:1,group:"Старшая группа",status:"Нужна оплата",birth:"2010-01-18"},
{id:4,name:"Керимова Лейла",phone:"+7 705 100-22-31",branch:3,group:"Начинающие",status:"Пробное",birth:"2015-11-02"}],
leads:[
{id:1,name:"Алиева Сабина",phone:"+7 777 111-22-33",branch:1,stage:"Новая заявка",source:"Instagram",manager:""},
{id:2,name:"Мурадов Эмиль",phone:"+7 701 555-44-33",branch:2,stage:"Связались",source:"Звонок",manager:""},
{id:3,name:"Гасанова Лана",phone:"+7 705 444-22-11",branch:1,stage:"Пробное занятие",source:"Instagram",manager:""}],
groups:[
{id:1,name:"Младшая группа",branch:1,teacher:"Камран",age:"6–9 лет",days:"Пн, Ср, Пт",time:"17:00"},
{id:2,name:"Средняя группа",branch:2,teacher:"Вугар",age:"10–13 лет",days:"Вт, Чт, Сб",time:"18:30"},
{id:3,name:"Старшая группа",branch:1,teacher:"Эльман",age:"14+",days:"Пн, Ср, Пт",time:"20:00"}],
teachers:[
{id:1,name:"Камран",phone:"",branch:1,role:"Главный тренер"},
{id:2,name:"Вугар",phone:"",branch:2,role:"Тренер"},
{id:3,name:"Эльман",phone:"",branch:1,role:"Тренер"}],
memberships:[
{id:1,student:1,title:"12 занятий",total:12,used:4,price:30000,expires:"2026-11-28",branch:1},
{id:2,student:2,title:"8 занятий",total:8,used:2,price:24000,expires:"2026-12-02",branch:2}],
attendance:[],
payments:[
{id:1,branch:1,amount:30000,type:"Доход",description:"Абонемент Алиев Тимур",date:"2026-11-10"},
{id:2,branch:2,amount:24000,type:"Доход",description:"Абонемент Мамедова Амина",date:"2026-11-12"}],
lessons:[
{id:1,branch:1,group:"Младшая группа",teacher:"Камран",date:"2026-11-16",time:"17:00",room:"Зал 1"},
{id:2,branch:2,group:"Средняя группа",teacher:"Вугар",date:"2026-11-16",time:"18:30",room:"Зал 1"},
{id:3,branch:1,group:"Старшая группа",teacher:"Эльман",date:"2026-11-16",time:"20:00",room:"Зал 1"}],
log:[]
};
const COLS=["branches","students","leads","groups","teachers","memberships","attendance","payments","lessons","log"];
let db={},role=null,current="Главная",editing=null,formType="";
COLS.forEach(k=>db[k]=[]);
let DB=null,U=null,ME=null,BOSS=false,roleMap={},last={},ready=false;
const fail=()=>toast("Не удалось сохранить: нет прав или связи");
/* Каждая запись — отдельный документ общей базы, поэтому два сотрудника не затирают друг другу правки. */
function persist(){
if(!DB)return;
COLS.forEach(k=>{
const cur={};db[k].forEach(x=>cur[x.id]=JSON.stringify(x));
const prev=last[k]||{};
Object.keys(cur).forEach(id=>{if(cur[id]!==prev[id])DB.doc("crm_"+k+"/"+id).set(JSON.parse(cur[id])).catch(fail)});
Object.keys(prev).forEach(id=>{if(!(id in cur))DB.doc("crm_"+k+"/"+id).delete().catch(fail)});
last[k]=cur;
});
}
function calcRole(){role=BOSS?"Руководитель":(roleMap[ME]||null)}
function showMsg(t){document.getElementById("content").innerHTML=`<div class="notice">${esc(t)}</div>`}
function refresh(){
if(!ready)return;
calcRole();
if(!role){document.getElementById("nav").innerHTML="";document.getElementById("whoami").textContent="";showMsg("Доступ ещё не назначен. Попросите руководителя назначить вам роль в разделе «Команда».");return}
init();
}
async function seedOnce(){
if(!BOSS)return;
try{const m=await DB.doc("meta/init").get();if(m.exists)return;await DB.doc("meta/init").set({at:Date.now()});if(!db.branches.length){db.branches=seed.branches.map(b=>({...b}));persist();refresh()}}catch(e){}
}
async function boot(){
showMsg("Загрузка…");
try{U=await claude.use("user");DB=await claude.use("db")}catch(e){}
if(!U||!DB){showMsg("Откройте страницу в Claude и войдите в аккаунт, чтобы работать с CRM.");return}
BOSS=await U.isOwner();ME=(await U.me()).id;
const tm=setTimeout(()=>{if(!ready)showMsg("Не удалось загрузить данные. Обновите страницу.")},10000);
const loaded={};
const check=()=>{if(!ready&&loaded.roles&&COLS.every(c=>loaded[c])){ready=true;clearTimeout(tm);seedOnce()}};
COLS.forEach(k=>DB.collection("crm_"+k).onSnapshot(s=>{
db[k]=s.docs.map(d=>d.data()).sort((a,b)=>k==="log"?b.id-a.id:a.id-b.id);
last[k]=Object.fromEntries(db[k].map(x=>[x.id,JSON.stringify(x)]));
loaded[k]=true;check();refresh();
},()=>showMsg("Нет доступа к данным.")));
DB.collection("roles").onSnapshot(s=>{roleMap={};s.docs.forEach(d=>roleMap[d.id]=d.data().role);loaded.roles=true;check();refresh()},()=>{loaded.roles=true;check()});
}
function fillTeam(){document.querySelectorAll("[data-uid]").forEach(async el=>{const id=el.dataset.uid;const p=(await U.profiles([id]))[id];el.textContent=p?.name||"Сотрудник"})}
async function teamSearch(q){
const box=document.getElementById("tres");box.textContent="";
if(!q.trim())return;
const hits=await U.search(q);
hits.slice(0,6).forEach(h=>{
const row=document.createElement("div");row.className="row";
const n=document.createElement("b");n.textContent=h.name||"Сотрудник";
const sel=document.createElement("select");sel.className="select";
Object.keys(ROLES).filter(r=>r!=="Руководитель").forEach(r=>sel.add(new Option(r,r)));
const b=document.createElement("button");b.className="mini";b.textContent="Назначить";
b.onclick=()=>assignRole(h.id,sel.value);
const w=document.createElement("span");w.append(sel," ",b);row.append(n,w);box.append(row);
});
}
async function assignRole(id,r){try{await DB.doc("roles/"+id).set({role:r});logAct("Роль назначена: "+r);persist();toast("Роль назначена")}catch(e){toast("Нет прав назначать роли")}}
async function removeRole(id){try{await DB.doc("roles/"+id).delete();logAct("Роль снята");persist();toast("Роль снята")}catch(e){toast("Нет прав")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function branchName(id){return db.branches.find(b=>b.id==id)?.name||"—"}
function inBranch(x){const v=document.getElementById("branchFilter").value;return v==="all"||String(x.branch)===v}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2800)}
function allowed(n){return !ROLES[role]||ROLES[role].includes(n)}
function isBoss(){return role==="Руководитель"}
function nid(k){return Date.now()*1000+Math.floor(Math.random()*1000)}
function logAct(t){db.log.unshift({id:nid("log"),t,role,at:new Date().toLocaleString("ru-RU")});db.log=db.log.slice(0,300)}
function money(n){return Number(n||0).toLocaleString("ru-RU")+" ₸"}
function status(s){const c=(s==="Активен"||s==="Присутствовал"||s==="Доход")?"":(s==="Нужна оплата"||s==="Отсутствовал"||s==="Расход")?"warn":"blue";return `<span class="tag ${c}">${esc(s)}</span>`}

function init(){
document.getElementById("whoami").textContent=role;
document.getElementById("nav").innerHTML=sections.map(g=>{
const items=g[1].filter(allowed);
return items.length?`<div class="navgroup"><div class="navtitle">${g[0]}</div>${items.map(n=>`<button data-page="${n}" onclick="go('${n}')"><span class="ico">${icons[n]}</span>${n}</button>`).join("")}</div>`:"";
}).join("");
const cur=document.getElementById("branchFilter").value||"all";
document.getElementById("branchFilter").innerHTML='<option value="all">Все филиалы</option>'+db.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");
document.getElementById("branchFilter").value=cur;
document.getElementById("expBtn").style.display=isBoss()?"":"none";
if(!allowed(current))current=sections.flatMap(g=>g[1]).find(allowed);
render();
}
function go(n){current=n;document.getElementById("side").classList.remove("open");render()}
const subs={"Главная":"Общая картина работы сети студий","Заявки и воронка":"От первого обращения до покупки абонемента","Ученики":"Единая база учеников всех филиалов","Посещаемость":"Отметка присутствия и контроль занятий","Расписание":"Календарь занятий по филиалам","Группы":"Составы, уровни и расписание групп","Тренеры":"Сотрудники и распределение по филиалам","Абонементы":"Продажи, остатки занятий и сроки","Финансы":"Доходы, расходы и кассовые операции","Филиалы":"Управление площадками сети","Аналитика":"Воронка продаж и посещаемость","Журнал":"Кто и что менял в системе","Команда":"Сотрудники и их роли","Настройки":"Резервная копия и параметры"};
function render(){
document.getElementById("title").textContent=current;
document.getElementById("crumb").textContent=current;
document.getElementById("eyebrow").textContent="РОЛЬ: "+role.toUpperCase();
document.getElementById("subtitle").textContent=subs[current]||"";
document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===current));
document.getElementById("primary").style.display=["Главная","Аналитика","Настройки","Журнал"].includes(current)?"none":"inline-block";
document.getElementById("content").innerHTML=views[current]();
if(current==="Команда")fillTeam();
}
function statsCard(l,v,n){return `<div class="stat"><label>${l}</label><strong>${v}</strong><small>${n}</small></div>`}
function sum(t){return db.payments.filter(inBranch).filter(x=>x.type===t).reduce((a,x)=>a+Number(x.amount),0)}
function bars(rows,max){return rows.map(([l,n])=>`<div class="barrow"><span>${esc(l)}</span><div class="bar"><i style="width:${Math.min(100,n/Math.max(1,max)*100)}%"></i></div><b>${n}</b></div>`).join("")}
const views={
"Главная":()=>{
const s=db.students.filter(inBranch),l=db.leads.filter(inBranch),g=db.groups.filter(inBranch),m=db.memberships.filter(inBranch);
const inc=sum("Доход"),exp=sum("Расход");

{id:2,student:2,title:"8 занятий",total:8,used:2,price:24000,expires:"2026-12-02",branch:2}];
db.payments=[
{id:1,branch:1,amount:30000,type:"Доход",action:"Продажи",category:"Групповые",description:"Абонемент Алиев Тимур",date:"2026-11-10"},
{id:2,branch:2,amount:24000,type:"Доход",action:"Продажи",category:"Групповые",description:"Абонемент Мамедова Амина",date:"2026-11-12"},
{id:3,branch:1,amount:5000,type:"Расход",action:"Возвраты",category:"Групповые",description:"Возврат за пропуск",date:"2026-11-13"},
{id:4,branch:1,amount:15000,type:"Расход",action:"Себестоимость",category:"Индивидуальные",description:"Оплата тренера",date:"2026-11-14"}];
db.lessons=[
{id:1,branch:1,group:"Лезгинка · дети",teacher:T[0],date:"2026-11-17",time:"17:00",room:"Зал 1"},
{id:2,branch:2,group:"Лезгинка · подростки",teacher:T[1],date:"2026-11-17",time:"18:30",room:"Зал 1"}];
db.attendance=[];db.log=[];
}
function persist(){try{localStorage.setItem(UKEY,JSON.stringify({db,users}))}catch(e){}}
function fillTeam(){}
function ltv(id){return db.memberships.filter(m=>m.student===id).reduce((a,m)=>a+Number(m.price||0),0)}
function canLtv(){return allowed("Финансы")||allowed("Абонементы")}
function ltvCard(){
const st=db.students.filter(inBranch),v=st.map(s=>ltv(s.id)),tot=v.reduce((a,b)=>a+b,0),pay=v.filter(x=>x>0).length;
const top=[...st].filter(s=>ltv(s.id)>0).sort((a,b)=>ltv(b.id)-ltv(a.id)).slice(0,5);
return `<div class="card" style="margin-top:14px"><h3>LTV учеников</h3><div class="hint">Сумма купленных абонементов на одного ученика</div><div class="row"><b>Средний LTV (платящие)</b><span>${money(pay?tot/pay:0)}</span></div><div class="row"><b>Общий LTV</b><span>${money(tot)}</span></div><div class="row"><b>Платящих учеников</b><span>${pay} из ${st.length}</span></div>${top.map(s=>`<div class="row"><b>${esc(s.name)}</b><span>${money(ltv(s.id))}</span></div>`).join("")}</div>`;
}
const _an=views["Аналитика"];views["Аналитика"]=()=>_an()+ltvCard();
function closeProfile(){document.getElementById("prof")?.remove()}
function ageOf(b){if(!b)return"—";const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a}
function dur(s){if(!s)return"—";const days=Math.max(0,Math.floor((Date.now()-new Date(s))/864e5)),m=Math.floor(days/30.4);return (m>=1?m+" мес. ":"")+"("+days+" дн.)"}
function setPhoto(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,320/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const s=db.students.find(x=>x.id===id);s.photo=c.toDataURL("image/jpeg",.7);logAct("Фото ученика: "+s.name);persist();openProfile(id);toast("Фото сохранено")};im.src=r.result};r.readAsDataURL(f)}
function addNote(id){const v=document.getElementById("pnote").value.trim();if(!v)return;const s=db.students.find(x=>x.id===id);(s.notes=s.notes||[]).unshift({t:v,role,at:new Date().toLocaleString("ru-RU")});logAct("Заметка: "+s.name);persist();openProfile(id)}
function openProfile(id){
const s=db.students.find(x=>x.id===id);if(!s)return;
closeProfile();
const today=new Date().toISOString().slice(0,10);
const att=db.attendance.filter(a=>a.student===id).sort((a,b)=>b.date.localeCompare(a.date));
const pres=att.filter(a=>a.status==="Присутствовал"||a.status==="Опоздал");
const miss=att.filter(a=>a.status==="Отсутствовал"||a.status==="Уважительная причина");
const last=pres[0]?.date||"";
const since=s.since||(att.length?att[att.length-1].date:"");
const nl=db.lessons.filter(l=>l.group===s.group&&l.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
const ms=db.memberships.filter(m=>m.student===id).sort((a,b)=>(b.expires||"").localeCompare(a.expires||""));
const act=ms.find(m=>m.total-m.used>0&&(!m.expires||m.expires>=today));
const R=(a,b)=>`<div class="row"><b>${a}</b><span>${b}</span></div>`;
const ini=esc((s.name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join(""));
const d=document.createElement("div");d.id="prof";d.className="modalbg";d.style.display="grid";
d.onclick=e=>{if(e.target===d)closeProfile()};
d.innerHTML=`<div class="modal" style="width:min(560px,100%)">
<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${s.photo?`<img alt="" src="${s.photo}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)">`:`<div class="logo" style="width:84px;height:84px;border-radius:50%;font-size:28px">${ini}</div>`}<div><h2 style="margin:0 0 8px">${esc(s.name)}</h2>${status(s.status)} <span class="tag blue">${esc(s.kind||"—")}</span></div></div>
<label class="btn secondary" style="display:inline-block;margin-bottom:12px">${s.photo?"Заменить фото":"Загрузить фото"}<input type="file" accept="image/*" hidden onchange="setPhoto(${id},this)"></label>
<div class="card"><h3>О ученике</h3>${R("Телефон",esc(s.phone))}${R("Возраст",ageOf(s.birth))}${R("Дата рождения",esc(s.birth||"—"))}${R("Филиал",esc(branchName(s.branch)))}${R("Группа",esc(s.group||"—"))}${R("Тренер",esc(db.groups.find(g=>g.name===s.group)?.teacher||"—"))}</div>
<div class="card" style="margin-top:12px"><h3>Занятия</h3>${R("Занимается с",esc(since||"—"))}${R("Срок занятий",dur(since))}${R("Посещено занятий",pres.length)}${R("Пропусков",miss.length)}${R("Последнее занятие",esc(last||"—"))}${R("Следующее занятие",nl?esc(nl.date+" · "+nl.time):"—")}${s.status==="Архив"?R("Закончил занятия",esc(last||"—")):""}</div>
<div class="card" style="margin-top:12px"><h3>Абонемент</h3>${act?R("Остаток занятий",(act.total-act.used)+" из "+act.total)+R("Действует до",esc(act.expires||"—")):'<div class="empty">Нет активного абонемента</div>'}${ms.map(m=>R(esc(m.title)+" · "+money(m.price),m.used+"/"+m.total+" · до "+esc(m.expires||"—"))).join("")}</div>
${canLtv()?`<div class="card" style="margin-top:12px"><h3>LTV</h3>${R("LTV ученика",money(ltv(id)))}${R("Покупок абонементов",ms.length)}${R("Средний чек",ms.length?money(ltv(id)/ms.length):"—")}${R("В месяц (среднее)",since?money(ltv(id)/Math.max(1,Math.floor(Math.max(0,Date.now()-new Date(since))/864e5/30.4))):"—")}</div>`:""}
<div class="card" style="margin-top:12px"><h3>Последние посещения</h3>${att.slice(0,8).map(a=>R(esc(a.date)+" · "+esc(a.group||""),status(a.status))).join("")||'<div class="empty">Отметок пока нет</div>'}</div>
<div class="card" style="margin-top:12px"><h3>Заметки</h3>${(s.notes||[]).map(n=>R(esc(n.t),esc(n.role)+" · "+esc(n.at))).join("")}<input class="field" id="pnote" placeholder="Новая заметка..." style="margin-top:8px"><div class="modalfoot"><button class="btn" onclick="addNote(${id})">Добавить заметку</button></div></div>
<div class="modalfoot"><button class="btn secondary" onclick="closeProfile()">Закрыть</button></div></div>`;
document.body.append(d);
}
function logout(){try{sessionStorage.removeItem(SKEY)}catch(e){}location.reload()}
function fillLogin(p,w){document.getElementById("lg_p").value="+"+p;document.getElementById("lg_w").value=w}
function doLogin(){
const u=users.find(x=>x.phone===nd(document.getElementById("lg_p").value)&&x.pass===document.getElementById("lg_w").value);
if(u)enter(u);else toast("Неверный номер или пароль");
}
function loginScreen(){
const d=document.createElement("div");d.id="login";
d.style.cssText="position:fixed;inset:0;background:#101010;z-index:60;display:grid;place-items:center;padding:16px;overflow:auto";
d.innerHTML=`<div class="modal"><h2>♛ DJIGIT TAU · вход</h2><div class="notice">ДЕМО: пароли не защищают данные. Нажмите на аккаунт ниже, чтобы подставить номер и пароль.</div><div class="formfield"><label>Номер телефона</label><input class="field" id="lg_p" inputmode="tel" placeholder="+7 ..."></div><div class="formfield"><label>Пароль</label><input class="field" id="lg_w" type="password"></div><div class="modalfoot"><button class="btn" onclick="doLogin()">Войти</button></div><div style="margin-top:14px">${DEMO_USERS.map(u=>`<div class="row"><b>${esc(u.role)}</b><button class="mini" onclick="fillLogin('${u.phone}','${u.pass}')">+${u.phone} · ${u.pass}</button></div>`).join("")}</div></div>`;
document.body.append(d);
}
function enter(u){
try{sessionStorage.setItem(SKEY,u.phone)}catch(e){}
role=u.role;BOSS=role==="Руководитель";ready=true;
document.getElementById("login")?.remove();
if(!document.getElementById("outBtn")){const b=document.createElement("button");b.id="outBtn";b.className="btn secondary";b.textContent="Выйти";b.onclick=logout;document.querySelector(".topright").append(b)}
current=sections.flatMap(g=>g[1]).find(allowed);
init();
document.getElementById("whoami").textContent=u.name+" · "+u.role;
}
function addUser(){
const g=id=>document.getElementById(id).value.trim();
const phone=nd(g("nu_phone")),name=g("nu_name"),pass=g("nu_pass");
if(!phone||!name||!pass){toast("Заполните имя, номер и пароль");return}
if(users.some(x=>x.phone===phone)){toast("Такой номер уже есть");return}
users.push({phone,pass,name,role:g("nu_role")});
logAct("Добавлен сотрудник: "+name+" ("+g("nu_role")+")");persist();render();toast("Сотрудник добавлен");
}
views["Команда"]=()=>`<div class="notice">ДЕМО: пароли хранятся открыто в этом браузере. В рабочей версии вход проверяет сервер.</div><div class="card"><h3>Добавить сотрудника</h3><div class="formgrid"><input class="field" id="nu_name" placeholder="Имя"><input class="field" id="nu_phone" inputmode="tel" placeholder="Номер телефона"><input class="field" id="nu_pass" placeholder="Пароль"><select class="field" id="nu_role">${Object.keys(ROLES).filter(r=>r!=="Руководитель").map(r=>`<option>${r}</option>`).join("")}</select></div><div class="modalfoot"><button class="btn" onclick="addUser()">Добавить</button></div></div><div class="card" style="margin-top:14px"><h3>Сотрудники</h3>${users.map(u=>`<div class="row"><b>${esc(u.name)}</b><span>${esc(u.role)} · +${esc(u.phone)}</span></div>`).join("")}</div>`;
function boot(){
let st=null;try{st=JSON.parse(localStorage.getItem(UKEY))}catch(e){}
if(st&&st.db){COLS.forEach(k=>db[k]=st.db[k]||[]);users=st.users||DEMO_USERS.map(u=>({...u}))}
else{demoSeed();users=DEMO_USERS.map(u=>({...u}));persist()}
let sp=null;try{sp=sessionStorage.getItem(SKEY)}catch(e){}
const u=users.find(x=>x.phone===sp);
if(u)enter(u);else loginScreen();
}
boot();
</script>
