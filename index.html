
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJIGIT TAU CRM</title>
<style>
:root{--gold:#c9a45c;--bg:#101114;--panel:#191a1f;--muted:#96979e;--line:#2b2c32;--white:#f5f3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font:15px Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px}
.logo{text-align:center;color:var(--gold);font-size:25px;font-weight:800;letter-spacing:3px}
.sub{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;margin:8px 0 28px}
input,select{width:100%;padding:13px;background:#101114;border:1px solid var(--line);border-radius:10px;color:white;margin:7px 0 15px}
button.primary{background:var(--gold);color:#171717;border:0;padding:13px 18px;border-radius:10px;font-weight:bold}
button.secondary{background:#25262c;color:white;border:1px solid var(--line);padding:10px 14px;border-radius:9px}
.full{width:100%}
#error{color:#ff8c8c;min-height:20px;font-size:13px}
#app{display:none}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:#101114;z-index:3}
.brand{font-weight:800;letter-spacing:2px;color:var(--gold)}
.user{color:var(--muted);font-size:13px}
.layout{max-width:1200px;margin:auto;padding:22px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
nav button{background:var(--panel);border:1px solid var(--line);color:#ddd;padding:11px 14px;border-radius:9px}
nav button.active{background:var(--gold);color:#171717;border-color:var(--gold)}
h1{font-size:26px;margin:8px 0 20px}
h2{font-size:18px;margin-top:0}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin:18px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.metric{font-size:28px;font-weight:bold;color:var(--gold);margin-top:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.toolbar input{max-width:300px;margin:0}
table{width:100%;border-collapse:collapse;min-width:540px}
th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:normal;font-size:13px}
.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.empty{padding:25px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
.tag{color:var(--gold);font-size:12px}
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;place-items:center;padding:18px}
.modal-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
footer{padding:25px 0;color:var(--muted);font-size:12px}
@media(max-width:600px){header{padding:0 14px}.layout{padding:16px}h1{font-size:22px}.user{font-size:11px}}
</style>
</head>
<body>

<section id="login">
 <div class="login-card">
  <div class="logo">DJIGIT TAU</div>
  <div class="sub">СТУДИЯ КАВКАЗСКОГО ТАНЦА · CRM</div>
  <label>Логин</label>
  <input id="loginName" placeholder="Введите логин" autocomplete="username">
  <label>Пароль</label>
  <input id="loginPass" type="password" placeholder="Введите пароль" autocomplete="current-password">
  <div id="error"></div>
  <button class="primary full" onclick="login()">Войти в систему</button>
  <p class="small">Демонстрационный доступ: director, admin, sales, teacher</p>
 </div>
</section>

<div id="app">
 <header>
  <div class="brand">DJIGIT TAU</div>
  <div class="row">
   <span class="user" id="userLabel"></span>
   <button class="secondary" onclick="logout()">Выйти</button>
  </div>
 </header>
 <main class="layout">
  <nav id="nav"></nav>
  <section id="content"></section>
  <footer>DJIGIT TAU CRM · Демонстрационная версия</footer>
 </main>
</div>

<div id="modal">
 <div class="modal-card">
  <div class="row"><h2 id="modalTitle">Добавить</h2><button class="secondary" onclick="closeModal()">Закрыть</button></div>
  <div id="modalFields"></div>
  <button class="primary full" onclick="saveRecord()">Сохранить</button>
 </div>
</div>

<script>
const accounts={
 director:{password:"123456",role:"Руководитель"},
 admin:{password:"123456",role:"Администратор"},
 sales:{password:"123456",role:"Отдел продаж"},
 teacher:{password:"123456",role:"Педагог"}
};
const menus={
 director:["Главная","Заявки","Ученики","Группы","Филиалы","Педагоги","Финансы","Отчёты"],
 admin:["Главная","Заявки","Ученики","Группы","Филиалы","Педагоги","Финансы","Отчёты","AI-помощник"],
 sales:["Заявки","Ученики"],
 teacher:["Мои группы","Посещаемость"]
};
let currentUser=null,currentPage="",activeModal="";
let data={
 "Заявки":[
  {name:"Амина",phone:"+7 700 000 00 01",status:"Новая"},
  {name:"Мурад",phone:"+7 700 000 00 02",status:"Связаться"}
 ],
 "Ученики":[
  {name:"Эльман",phone:"+7 700 000 00 03",group:"Средняя группа",status:"Активный"},
  {name:"Камиль",phone:"+7 700 000 00 04",group:"Младшая группа",status:"Активный"}
 ],
 "Группы":[
  {name:"Младшая группа",teacher:"Педагог 1",branch:"Алмалы"},
  {name:"Средняя группа",teacher:"Педагог 2",branch:"Медеу"}
 ],
 "Филиалы":[
  {name:"Айнабулак",address:"Алматы"},
  {name:"Бостандык",address:"Алматы"},
  {name:"Алмалы",address:"Алматы"},
  {name:"Турксиб",address:"Алматы"},
  {name:"Медеу",address:"Алматы"}
 ],
 "Педагоги":[
  {name:"Педагог 1",phone:"+7 700 000 00 05",groups:"Младшая группа"},
  {name:"Педагог 2",phone:"+7 700 000 00 06",groups:"Средняя группа"}
 ]
};
let attendance={};

function login(){
 const name=document.getElementById("loginName").value.trim().toLowerCase();
 const pass=document.getElementById("loginPass").value;
 if(!accounts[name]||accounts[name].password!==pass){
  document.getElementById("error").textContent="Неверный логин или пароль";
  return;
 }
 currentUser={login:name,...accounts[name]};
 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";
 document.getElementById("userLabel").textContent=currentUser.role;
 buildNav();
 openPage(menus[name][0]);
}
function logout(){
 currentUser=null;
 document.getElementById("app").style.display="none";
 document.getElementById("login").style.display="grid";
 document.getElementById("loginPass").value="";
}
function buildNav(){
 const nav=document.getElementById("nav");
 nav.innerHTML="";
 menus[currentUser.login].forEach(item=>{
  const b=document.createElement("button");
  b.textContent=item;b.onclick=()=>openPage(item);b.id="nav-"+item;
  nav.appendChild(b);
 });
}
function openPage(page){
 currentPage=page;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.textContent===page));
 const c=document.getElementById("content");
 if(page==="Главная")return dashboard(c);
 if(page==="Финансы")return finance(c);
 if(page==="Отчёты")return reports(c);
 if(page==="AI-помощник")return assistant(c);
 if(page==="Мои группы")return teacherGroups(c);
 if(page==="Посещаемость")return attendancePage(c);
 if(data[page])return tablePage(c,page);
 c.innerHTML="<h1>"+page+"</h1><p class='muted'>Раздел</p>";
}
function dashboard(c){
 const students=data["Ученики"].length;
 const leads=data["Заявки"].length;
 c.innerHTML=`
 <h1>Главная панель</h1><p class="muted">Обзор работы студии</p>
 <div class="grid">
  <div class="card">Всего учеников<div class="metric">${students}</div></div>
  <div class="card">Заявки<div class="metric">${leads}</div></div>
  <div class="card">Группы<div class="metric">${data["Группы"].length}</div></div>
  <div class="card">Филиалы<div class="metric">${data["Филиалы"].length}</div></div>
 </div>
 <div class="grid">
  <div class="card"><h2>Воронка заявок</h2><p>Новые обращения: ${leads}</p><p class="muted">Здесь будут этапы работы с клиентами</p></div>
  <div class="card"><h2>Посещаемость</h2><p class="muted">Отметки педагогов будут отображаться здесь</p></div>
 </div>`;
}
function tablePage(c,page){
 const rows=data[page];
 const canAdd=["director","admin"].includes(currentUser.login) &&
  !(currentUser.login==="sales"&&page==="Ученики");
 let html=`<div class="row"><div><h1>${page}</h1><p class="muted">Управление разделом</p></div>
 ${canAdd?'<button class="primary" onclick="addRecord()">＋ Добавить</button>':""}</div>
 <div class="toolbar"><input id="search" placeholder="Поиск..." oninput="filterRows()"></div>
 <div class="table-wrap"><table><thead><tr>`;
 const keys=rows.length?Object.keys(rows[0]):["name"];
 keys.forEach(k=>html+=`<th>${({name:"Имя / название",phone:"Телефон",status:"Статус",group:"Группа",teacher:"Педагог",branch:"Филиал",address:"Адрес",groups:"Группы"})[k]||k}</th>`);
 html+="</tr></thead><tbody id='tableBody'>";
 rows.forEach((r,i)=>html+=rowHtml(r,i,keys));
 html+="</tbody></table></div>";
 c.innerHTML=html;
}
function rowHtml(r,i,keys){
 return "<tr>"+keys.map(k=>`<td>${escapeHtml(r[k]||"—")}</td>`).join("")+"</tr>";
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function filterRows(){
 const q=document.getElementById("search").value.toLowerCase();
 const rows=data[currentPage],keys=Object.keys(rows[0]||{name:""});
 document.getElementById("tableBody").innerHTML=rows
 .map((r,i)=>({r,i})).filter(x=>keys.some(k=>String(x.r[k]||"").toLowerCase().includes(q)))
 .map(x=>rowHtml(x.r,x.i,keys)).join("");
}
function addRecord(){
 activeModal=currentPage;
 const fields={
  "Заявки":[["name","Имя"],["phone","Телефон"],["status","Статус"]],
  "Ученики":[["name","Имя ученика"],["phone","Телефон родителя"],["group","Группа"],["status","Статус"]],
  "Группы":[["name","Название группы"],["teacher","Педагог"],["branch","Филиал"]],
  "Филиалы":[["name","Название филиала"],["address","Адрес"]],
  "Педагоги":[["name","Имя педагога"],["phone","Телефон"],["groups","Группы"]]
 }[activeModal]||[];
 document.getElementById("modalTitle").textContent="Добавить: "+activeModal;
 document.getElementById("modalFields").innerHTML=fields.map(([id,label])=>
 `<label>${label}</label><input id="field-${id}" placeholder="${label}">`).join("");
 document.getElementById("modal").style.display="grid";
}
function closeModal(){document.getElementById("modal").style.display="none"}
function saveRecord(){
 const fields=[...document.querySelectorAll("#modalFields input")];
 const record={};
 fields.forEach(f=>record[f.id.replace("field-","")]=f.value.trim());
 if(!record.name){alert("Заполните имя или название");return}
 data[activeModal].push(record);
 closeModal();openPage(activeModal);
}
function finance(c){
 if(currentUser.login==="admin"){
  c.innerHTML="<h1>Финансы</h1><div class='card'><h2>Операционные платежи</h2><p class='muted'>Администратор может вести оплату и задолженности. Сводные финансовые показатели доступны руководителю.</p></div>";
  return;
 }
 c.innerHTML=`<h1>Финансы</h1><div class="grid">
 <div class="card">Доходы<div class="metric">0 ₸</div></div>
 <div class="card">Расходы<div class="metric">0 ₸</div></div>
 <div class="card">Долги<div class="metric">0 ₸</div></div>
 <div class="card">Прибыль<div class="metric">0 ₸</div></div></div>
 <p class="muted">Демонстрационные значения. Подключение реальных платежей ещё не настроено.</p>`;
}
function reports(c){
 c.innerHTML="<h1>Отчёты</h1><div class='card'><p>Отчёты по ученикам, заявкам, посещаемости, финансам, педагогам, группам и филиалам.</p><p class='muted'>Экспорт Excel и PDF будет подключён в следующей версии.</p></div>";
}
function assistant(c){
 c.innerHTML=`<h1>AI-помощник</h1><div class="card"><h2>Помощник администратора</h2>
 <p class="muted">Здесь можно будет анализировать заявки, посещаемость и работу филиалов.</p>
 <p class="small">AI-функции пока не подключены.</p></div>`;
}
function teacherGroups(c){
 const groups=data["Группы"].filter(g=>g.teacher.toLowerCase().includes("педагог"));
 c.innerHTML="<h1>Мои группы</h1><div class='grid'>"+
 (groups.length?groups.map(g=>`<div class="card"><h2>${escapeHtml(g.name)}</h2><p class="muted">${escapeHtml(g.branch)}</p><span class="tag">${escapeHtml(g.teacher)}</span></div>`).join(""):"<div class='card'>Группы пока не назначены этому педагогу.</div>")+"</div>";
}
function attendancePage(c){
 const groups=data["Группы"];
 c.innerHTML=`<h1>Посещаемость</h1><div class="card">
 <p>Выберите группу и отметьте присутствие учеников.</p>
 <label>Группа</label><select id="attGroup">${groups.map(g=>`<option>${escapeHtml(g.name)}</option>`).join("")}</select>
 <label>Ученик</label><select id="attStudent">${data["Ученики"].map(s=>`<option>${escapeHtml(s.name)}</option>`).join("")}</select>
 <label>Статус</label><select id="attStatus"><option>Присутствовал</option><option>Отсутствовал</option><option>Уважительная причина</option></select>
 <button class="primary" onclick="saveAttendance()">Сохранить отметку</button>
 <p id="attMessage" class="muted"></p></div>`;
}
function saveAttendance(){
 const item={group:document.getElementById("attGroup").value,student:document.getElementById("attStudent").value,status:document.getElementById("attStatus").value,date:new Date().toLocaleDateString("ru-RU")};
 attendance[item.date+"-"+item.student]=item;
 document.getElementById("attMessage").textContent="Отметка сохранена: "+item.student+" — "+item.status;
}
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&document.getElementById("login").style.display!=="none")login();
});
</script>
</body>
</html>
