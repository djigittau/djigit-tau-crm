
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJIGIT TAU CRM</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --gold:#b58a36;--gold2:#d9bd7c;--bg:#f7f7f5;
  --white:#fff;--text:#282722;--muted:#89877f;
  --line:#ece9e1;--soft:#faf7ef;--green:#26845b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}
.layout{min-height:100vh}
.sidebar{
 position:fixed;left:0;top:0;bottom:0;width:255px;
 background:white;border-right:1px solid var(--line);
 padding:22px 14px;overflow:auto;z-index:5
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 25px}
.logo{
 width:43px;height:43px;border-radius:13px;
 background:linear-gradient(145deg,#dfc88f,#a77c2d);
 color:white;display:grid;place-items:center;
 font-size:18px;font-weight:900
}
.brand b{font-size:13px;letter-spacing:1.5px}
.brand small{display:block;font-size:9px;color:var(--muted);margin-top:5px;letter-spacing:1.5px}
.nav-title{font-size:10px;color:#aaa397;letter-spacing:1.4px;
 font-weight:800;padding:14px 12px 7px}
.nav{
 width:100%;border:0;background:transparent;color:#68665f;
 display:flex;align-items:center;gap:11px;text-align:left;
 padding:11px 12px;border-radius:9px;margin:2px 0;
 cursor:pointer;font-size:13px
}
.nav:hover{background:#faf7ef}
.nav.active{background:#f5efdf;color:#896625;font-weight:700}
.nav .ico{width:19px;text-align:center;font-size:16px}
.main{margin-left:255px;padding:25px 30px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}
.topbar h1{font-size:23px;margin:0;font-weight:750}
.topbar p{font-size:12px;color:var(--muted);margin:6px 0 0}
.top-actions{display:flex;gap:9px;align-items:center}
.btn{
 border:1px solid var(--line);background:white;border-radius:9px;
 padding:10px 14px;cursor:pointer;color:var(--text);font-size:12px
}
.btn.gold{background:var(--gold);color:white;border-color:var(--gold)}
.btn:hover{filter:brightness(.97)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.card{
 background:white;border:1px solid var(--line);border-radius:13px;
 padding:17px;min-width:0
}
.card-label{font-size:11px;color:var(--muted);margin-bottom:12px}
.card-value{font-size:25px;font-weight:750;overflow-wrap:anywhere}
.card-note{font-size:10px;color:var(--muted);margin-top:7px}
.card-icon{float:right;color:var(--gold);font-size:19px}
.panel{background:white;border:1px solid var(--line);border-radius:13px;margin-bottom:17px;overflow:hidden}
.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);
 display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel-head h2{font-size:14px;margin:0}
.panel-head span{font-size:11px;color:var(--muted)}
.panel-body{padding:18px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sheet-card{
 border:1px solid var(--line);background:white;border-radius:10px;
 padding:13px;text-align:left;cursor:pointer;min-width:0
}
.sheet-card:hover{border-color:var(--gold2);background:#fdfbf6}
.sheet-card b{font-size:12px;display:block;overflow-wrap:anywhere}
.sheet-card small{display:block;color:var(--muted);font-size:10px;margin-top:7px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.search{
 border:1px solid var(--line);background:white;border-radius:9px;
 padding:10px 12px;min-width:220px;outline:none;font-size:12px
}
.search:focus{border-color:var(--gold)}
.table-wrap{overflow:auto;max-height:65vh}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:11px}
th{
 position:sticky;top:0;background:#faf8f3;color:#756b56;
 text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);
 font-weight:750;z-index:1
}
td{padding:11px 13px;border-bottom:1px solid #f0eee8;max-width:320px;
 overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#fdfbf6}
.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}
.pagination{display:flex;align-items:center;justify-content:space-between;
 padding:13px 17px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.badge{display:inline-block;background:#f5efdf;color:#896625;
 padding:5px 9px;border-radius:20px;font-size:10px}
.status{padding:9px 12px;border-radius:9px;background:#f5efdf;color:#896625;font-size:11px}
.notice{padding:13px;border-radius:9px;background:#faf7ef;
 color:#76623b;font-size:11px;line-height:1.6}
.mobile-head{display:none}
@media(max-width:950px){
 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sheet-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
 .sidebar{position:relative;width:100%;height:auto;bottom:auto;padding:12px}
 .brand{padding:4px 5px 12px}
 .nav-title{display:none}
 .nav-list{display:flex;overflow-x:auto;gap:5px;padding-bottom:5px}
 .nav{width:auto;white-space:nowrap;padding:9px 11px}
 .main{margin:0;padding:16px 12px}
 .topbar{align-items:flex-start}
 .topbar h1{font-size:19px}
 .top-actions{flex-wrap:wrap;justify-content:flex-end}
 .cards{gap:9px}
 .card{padding:13px}
 .card-value{font-size:20px}
 .sheet-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .search{min-width:100%;width:100%}
 .panel-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
 <div class="brand">
  <div class="logo">JT</div>
  <div><b>DJIGIT TAU</b><small>MANAGEMENT SYSTEM</small></div>
 </div>
 <div class="nav-title">ГЛАВНОЕ МЕНЮ</div>
 <div class="nav-list">
  <button class="nav active" data-page="Главная"><span class="ico">⌂</span>Главная</button>
  <button class="nav" data-page="Ученики"><span class="ico">♙</span>Ученики</button>
  <button class="nav" data-page="Проекты"><span class="ico">▣</span>Проекты</button>
  <button class="nav" data-page="Операции"><span class="ico">₸</span>Операции</button>
  <button class="nav" data-page="ДДС"><span class="ico">⇄</span>ДДС</button>
  <button class="nav" data-page="ОПУ"><span class="ico">▥</span>ОПУ</button>
  <button class="nav" data-page="Баланс"><span class="ico">◫</span>Баланс</button>
  <button class="nav" data-page="Все таблицы"><span class="ico">▤</span>Все таблицы</button>
 </div>
 <div class="nav-title">СИСТЕМА</div>
 <button class="nav" data-page="Настройки"><span class="ico">⚙</span>Настройки</button>
</aside>

<main class="main">
 <header class="topbar">
  <div>
   <h1 id="pageTitle">Главная</h1>
   <p id="pageSubtitle">Обзор деятельности DJIGIT TAU</p>
  </div>
  <div class="top-actions">
   <span class="status" id="loadStatus">Загрузка данных...</span>
   <button class="btn gold" onclick="document.getElementById('excelFile').click()">＋ Загрузить Excel</button>
   <input id="excelFile" type="file" accept=".xlsx,.xls" hidden>
  </div>
 </header>

 <section id="content">
  <div class="panel"><div class="empty">Загружаем таблицу...</div></div>
 </section>
</main>
</div>

<script>
const EXPECTED_SHEETS = [
 "Лист17","ОПЕРАЦИИ","ПРОЕКТЫ","ст","ОПУ Филиалы ",
 "Для руководителя","ОПУ категории","ОПУ тренера",
 "ДДС день","ДДС месяц","ОПУ месяц","БАЛАНС",
 "ОТЧЕТ по проекту","ДАШБОРД","ДАШБОРД (ДДС)",
 "справочник","настройки","настройки(дашбордОПУ)",
 "настройки(дашбордДДС)"
];

let workbook = null;
let sheets = {};
let activeSheet = "";
let currentPage = 1;
const PAGE_SIZE = 100;
let filteredRows = [];

const $ = id => document.getElementById(id);

function cleanName(name){
 return String(name || "").trim().toLowerCase();
}
function findSheet(names){
 const keys = Object.keys(sheets);
 for(const wanted of names){
  const found = keys.find(k => cleanName(k) === cleanName(wanted));
  if(found) return found;
 }
 return null;
}
function sheetRows(name){
 return name && sheets[name] ? sheets[name].rows : [];
}
function formatNumber(n){
 return Number(n || 0).toLocaleString("ru-RU");
}
function setStatus(text){$("loadStatus").textContent=text;}

function loadWorkbook(wb){
 workbook = wb;
 sheets = {};
 wb.SheetNames.forEach(name=>{
  const ws = wb.Sheets[name];
  const rows = XLSX.utils.sheet_to_json(ws,{
   header:1,defval:"",raw:false,blankrows:false
  }).filter(row=>row.some(v=>String(v).trim()!==""));
  sheets[name] = {rows};
 });
 setStatus("Excel загружен · "+wb.SheetNames.length+" листов");
 renderPage("Главная");
}

async function loadDefaultExcel(){
 try{
  const response = await fetch("./data.xlsx");
  if(!response.ok) throw new Error("data.xlsx не найден");
  const buffer = await response.arrayBuffer();
  const wb = XLSX.read(buffer,{type:"array",cellDates:true});
  loadWorkbook(wb);
 }catch(error){
  setStatus("Нужно загрузить Excel");
  renderPage("Настройки");
 }
}

$("excelFile").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  const buffer=await file.arrayBuffer();
  const wb=XLSX.read(buffer,{type:"array",cellDates:true});
  loadWorkbook(wb);
 }catch(err){
  alert("Не удалось прочитать Excel. Проверь формат файла.");
 }
});

function getSheetForPage(page){
 const map={
  "Ученики":["ст","Лист17"],
  "Проекты":["ПРОЕКТЫ"],
  "Операции":["ОПЕРАЦИИ"],
  "ДДС":["ДДС месяц","ДДС день"],
  "ОПУ":["ОПУ месяц","ОПУ Филиалы ","ОПУ категории","ОПУ тренера"],
  "Баланс":["БАЛАНС"]
 };
 return findSheet(map[page]||[]);
}

function renderPage(page){
 document.querySelectorAll(".nav").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===page);
 });
 $("pageTitle").textContent=page;
 const descriptions={
  "Главная":"Обзор деятельности DJIGIT TAU",
  "Ученики":"Учёт учеников и контактных данных",
  "Проекты":"Проекты и карточки клиентов",
  "Операции":"Финансовые операции из Excel",
  "ДДС":"Движение денежных средств",
  "ОПУ":"Доходы, расходы и прибыль",
  "Баланс":"Остатки по счетам",
  "Все таблицы":"Все листы исходной книги Excel",
  "Настройки":"Загрузка и состояние данных"
 };
 $("pageSubtitle").textContent=descriptions[page]||"Данные CRM";
 if(page==="Главная") return renderDashboard();
 if(page==="Все таблицы") return renderAllSheets();
 if(page==="Настройки") return renderSettings();
 if(page==="ДДС"||page==="ОПУ") return renderFinancialGroup(page);
 const sheet=getSheetForPage(page);
 if(!sheet){
  $("content").innerHTML='<div class="panel"><div class="empty">В исходной книге не найден подходящий лист.</div></div>';
  return;
 }
 renderTable(sheet);
}

document.querySelectorAll(".nav").forEach(btn=>{
 btn.addEventListener("click",()=>renderPage(btn.dataset.page));
});

function renderDashboard(){
 const names=Object.keys(sheets);
 const totalRows=names.reduce((sum,n)=>sum+sheets[n].rows.length,0);
 const students=findSheet(["ст","Лист17"]);
 const projects=findSheet(["ПРОЕКТЫ"]);
 const operations=findSheet(["ОПЕРАЦИИ"]);
 const cards=[
  ["Листов Excel",names.length,"Листы исходной книги","▤"],
  ["Записей всего",formatNumber(totalRows),"Все заполненные строки","▥"],
  ["Ученики",formatNumber(sheetRows(students).length),"Строк в листе учеников","♙"],
  ["Операции",formatNumber(sheetRows(operations).length),"Строк финансовых операций","₸"]
 ];
 $("content").innerHTML=`
 <div class="cards">
 ${cards.map(c=>`<div class="card"><span class="card-icon">${c[3]}</span>
 <div class="card-label">${c[0]}</div><div class="card-value">${c[1]}</div>
 <div class="card-note">${c[2]}</div></div>`).join("")}
 </div>
 <div class="panel">
  <div class="panel-head"><h2>Финансовые разделы</h2><span>Данные из Excel</span></div>
  <div class="panel-body">
   <div class="sheet-grid">
    ${[
     ["ОПЕРАЦИИ","Финансовые поступления и расходы"],
     ["ДДС день","Движение денег по дням"],
     ["ДДС месяц","Движение денег по месяцам"],
     ["ОПУ месяц","Доходы и расходы по месяцам"],
     ["ОПУ Филиалы ","Финансовые показатели филиалов"],
     ["ОПУ категории","Аналитика по категориям"],
     ["ОПУ тренера","Аналитика по тренерам"],
     ["БАЛАНС","Остатки по счетам"]
    ].map(x=>`<button class="sheet-card" onclick="openSheet('${x[0].replace(/'/g,"\\'")}')">
     <b>${x[0]}</b><small>${x[1]}</small></button>`).join("")}
   </div>
  </div>
 </div>
 <div class="panel">
  <div class="panel-head"><h2>Все разделы книги</h2><span>${names.length} листов</span></div>
  <div class="panel-body"><div class="sheet-grid">
   ${names.map(n=>`<button class="sheet-card" onclick="openSheet('${n.replace(/'/g,"\\'")}')">
    <b>${escapeHtml(n)}</b><small>${formatNumber(sheets[n].rows.length)} строк</small>
   </button>`).join("")}
  </div></div>
 </div>
 <div class="notice">Это демонстрационный просмотр исходной Excel-книги. Данные отображаются из таблицы; финансовые формулы, автоматические начисления, права доступа и синхронизация пока не подключены.</div>
 `;
}

function renderAllSheets(){
 const names=Object.keys(sheets);
 $("content").innerHTML=`
 <div class="panel">
  <div class="panel-head"><h2>Листы Excel</h2><span>${names.length} листов</span></div>
  <div class="panel-body"><div class="sheet-grid">
   ${names.map(n=>`<button class="sheet-card" onclick="openSheet('${n.replace(/'/g,"\\'")}')">
   <b>${escapeHtml(n)}</b><small>${formatNumber(sheets[n].rows.length)} строк</small></button>`).join("")}
  </div></div>
 </div>`;
}

function renderFinancialGroup(page){
 const names=page==="ДДС"
 ? ["ДДС день","ДДС месяц"]
 : ["ОПУ месяц","ОПУ Филиалы ","ОПУ категории","ОПУ тренера"];
 const available=names.filter(n=>findSheet([n]));
 $("content").innerHTML=`
 <div class="panel">
  <div class="panel-head"><h2>${page} — финансовая аналитика</h2>
  <span>Исходные листы Excel</span></div>
  <div class="panel-body"><div class="sheet-grid">
   ${available.map(n=>`<button class="sheet-card" onclick="openSheet('${n.replace(/'/g,"\\'")}')">
   <b>${escapeHtml(n.trim())}</b><small>${formatNumber(sheetRows(findSheet([n])).length)} строк</small></button>`).join("")}
  </div></div>
 </div>`;
 if(available.length) renderTable(findSheet([available[0]]),true);
}

function renderSettings(){
 $("content").innerHTML=`
 <div class="panel">
  <div class="panel-head"><h2>Источник данных</h2><span>Excel</span></div>
  <div class="panel-body">
   <div class="notice">Для автоматической загрузки через GitHub Pages положи исходную книгу в корень репозитория и назови её <b>data.xlsx</b>. Файл index.html загрузит её автоматически.</div>
   <p style="font-size:12px;margin-top:18px">Или выбери Excel прямо с устройства:</p>
   <button class="btn gold" onclick="document.getElementById('excelFile').click()">Выбрать Excel-файл</button>
   <p style="font-size:11px;color:#888;margin-top:18px">Ожидаемые листы: ${EXPECTED_SHEETS.length}. Фактически найдено: ${Object.keys(sheets).length}.</p>
   <div style="margin-top:15px">
   ${Object.keys(sheets).map(n=>`<div style="padding:9px 0;border-bottom:1px solid #eee;font-size:12px">
   ${escapeHtml(n)} <span style="float:right;color:#999">${formatNumber(sheets[n].rows.length)} строк</span></div>`).join("")}
   </div>
  </div>
 </div>`;
}

function openSheet(name){
 if(!sheets[name])return;
 activeSheet=name;
 currentPage=1;
 renderTable(name);
 $("pageTitle").textContent=name.trim();
 $("pageSubtitle").textContent="Просмотр данных исходной таблицы";
 document.querySelectorAll(".nav").forEach(b=>b.classList.remove("active"));
}

function renderTable(name,insideFinancial=false){
 activeSheet=name;
 currentPage=1;
 const rows=sheets[name]?.rows||[];
 if(!rows.length){
  $("content").innerHTML='<div class="panel"><div class="empty">На этом листе нет заполненных строк.</div></div>';
  return;
 }
 // Первая непустая строка используется как заголовок.
 let headerIndex=0;
 let bestScore=-1;
 rows.slice(0,15).forEach((r,i)=>{
  const score=r.filter(v=>typeof v==="string"&&v.trim()).length;
  if(score>bestScore){bestScore=score;headerIndex=i;}
 });
 const headers=rows[headerIndex].map((v,i)=>String(v||"").trim()||("Столбец "+(i+1)));
 const data=rows.slice(headerIndex+1);
 filteredRows=data;
 $("content").innerHTML=`
 <div class="panel">
  <div class="panel-head">
   <div><h2>${escapeHtml(name.trim())}</h2><span>${formatNumber(data.length)} строк данных</span></div>
   <div class="toolbar">
    <input class="search" id="tableSearch" placeholder="Поиск по таблице...">
    <button class="btn" onclick="exportCurrentSheet()">Экспорт CSV</button>
   </div>
  </div>
  <div class="table-wrap" id="tableArea"></div>
  <div class="pagination">
   <span id="pageInfo"></span>
   <div class="toolbar">
    <button class="btn" onclick="changePage(-1)">← Назад</button>
    <button class="btn" onclick="changePage(1)">Вперёд →</button>
   </div>
  </div>
 </div>`;
 $("tableSearch").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase().trim();
  filteredRows=data.filter(row=>row.some(v=>String(v).toLowerCase().includes(q)));
  currentPage=1;drawTable(headers);
 });
 drawTable(headers);
}

function drawTable(headers){
 const total=filteredRows.length;
 const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
 currentPage=Math.min(currentPage,pages);
 const start=(currentPage-1)*PAGE_SIZE;
 const visible=filteredRows.slice(start,start+PAGE_SIZE);
 let html="<table><thead><tr>";
 headers.forEach(h=>html+=`<th>${escapeHtml(h)}</th>`);
 html+="</tr></thead><tbody>";
 visible.forEach(row=>{
  html+="<tr>";
  headers.forEach((_,i)=>{
   html+=`<td title="${escapeHtml(row[i]??"")}">${escapeHtml(row[i]??"")}</td>`;
  });
  html+="</tr>";
 });
 html+="</tbody></table>";
 if(!visible.length)html='<div class="empty">Ничего не найдено</div>';
 $("tableArea").innerHTML=html;
 $("pageInfo").textContent=`Показано ${total?start+1:0}–${Math.min(start+PAGE_SIZE,total)} из ${total}`;
}

function changePage(delta){
 const pages=Math.max(1,Math.ceil(filteredRows.length/PAGE_SIZE));
 currentPage=Math.max(1,Math.min(pages,currentPage+delta));
 const rows=sheets[activeSheet]?.rows||[];
 let headerIndex=0,bestScore=-1;
 rows.slice(0,15).forEach((r,i)=>{
  const score=r.filter(v=>typeof v==="string"&&v.trim()).length;
  if(score>bestScore){bestScore=score;headerIndex=i;}
 });
 const headers=rows[headerIndex].map((v,i)=>String(v||"").trim()||("Столбец "+(i+1)));
 drawTable(headers);
}

function exportCurrentSheet(){
 if(!activeSheet)return;
 const rows=sheets[activeSheet].rows;
 const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=activeSheet.replace(/[^\wа-яА-ЯёЁ-]/g,"_")+".csv";
 a.click();
 URL.revokeObjectURL(a.href);
}

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

loadDefaultExcel();
</script>
</body>
</html>
