<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1DFA8">
<title>DJIGIT TAU CRM · демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Forum&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem("djigit_crm_theme")||"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.skin=localStorage.getItem("djigit_crm_skin")||"gold"}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --bg:#FBF8F1;--panel:#FFFFFF;--pale:#FBF3DE;--line:#EFE6D3;--line2:#F5EFE2;
  --text:#2A2418;--muted:#7D7262;--faint:#ADA190;
  --gold:#D9B568;--gold-deep:#A47E35;--ink:#1A1916;
  --green:#3E8E4E;--green-bg:#E5F3E6;--red:#C7392F;--red-bg:#FBE4E1;--blue:#2F5F8A;--blue-bg:#E2ECF5;--warn:#8A5A12;--warn-bg:#F8EBCF;
  --s1:#F4E8C8;--s2:#ECD9A6;--s3:#DFC17F;--s4:#CFA65C;--lost:#F0CFCB;
  --panel2:#FFFDF8;--hover:#F4F1EA;--hl:#FFF4D6;--inkbg:#3B3020;--colm:rgba(44,36,21,.72);
  --goldbar:linear-gradient(90deg,#E9D6A6,#CDA963);
  --r:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(120,90,30,.05),0 8px 24px rgba(120,90,30,.06);
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:var(--safe-b)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* sidebar: dark with gold glow, as in the mockup */
.app{display:flex;min-height:100vh}
.side{width:236px;background:radial-gradient(140% 38% at 20% 108%,rgba(214,176,98,.55) 0%,rgba(214,176,98,.12) 45%,transparent 70%),linear-gradient(180deg,#161616 0%,#0F0F0F 100%);color:#D9D4CA;padding:calc(16px + var(--safe-t)) 0 18px;position:fixed;top:0;bottom:0;left:0;overflow:auto;z-index:20;display:flex;flex-direction:column}
.brand{padding:4px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:center}
.brand img{width:184px;height:auto;display:block}
.nav{padding-top:10px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#D4CEC3;padding:10px 22px;text-align:left;font-size:14px;position:relative}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.active{background:linear-gradient(90deg,#B8924B 0%,#8A6A2E 70%,rgba(138,106,46,.35) 100%);color:#fff;font-weight:600}
.nav .cnt{margin-left:auto;background:#C8A55F;color:#1A1916;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 8px}
.sidefoot{margin-top:auto;padding:16px 22px 0;color:#9B9488;font-size:12px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--inkbg);color:#E9D6A6;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 42px}
.scrim{display:none}

/* top bar */
.main{margin-left:236px;width:calc(100% - 236px);min-width:0}
.top{min-height:62px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:calc(10px + var(--safe-t)) 24px 10px;position:sticky;top:0;z-index:10;gap:14px}
.gsearch{position:relative;flex:1;max-width:560px}
.gsearch input{width:100%;border:1px solid var(--line);background:#FAFAF8;border-radius:10px;padding:9px 12px 9px 36px;font-size:13.5px}
.gsearch input:focus{outline:none;border-color:var(--gold);background:var(--panel)}
.gsearch>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gres,.pop{position:absolute;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(26,25,22,.12);z-index:30;display:none;max-height:380px;overflow:auto}
.gres{left:0;right:0}.gres.on,.pop.on{display:block}
.gres button,.pop .it{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13.5px}
.gres button:hover,.pop .it:hover{background:#FBF7EC}
.gres small,.pop small{color:var(--muted);font-size:12px;display:block}
.gres .k{margin-left:auto;font-size:11.5px;color:var(--gold-deep);background:var(--pale);border-radius:8px;padding:1px 7px;white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.branchsel{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:0 4px 0 12px;font-size:13px;color:var(--muted);background:var(--panel)}
.branchsel select{border:0;background:none;font-weight:600;color:var(--ink);padding:8px 4px;max-width:200px;font-size:13px}
.branchsel select:focus{outline:none}
.iconbtn{position:relative;border:0;background:none;padding:6px;color:var(--ink);border-radius:8px}
.iconbtn:hover{background:var(--hover)}
.iconbtn svg.i{width:22px;height:22px}
.badge{position:absolute;top:1px;right:1px;min-width:17px;height:17px;border-radius:9px;background:#C8A55F;color:#1A1916;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--panel)}
.badge[hidden],.cnt[hidden]{display:none}
.pop{right:0;width:330px}
.pop h4{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line2)}
.mewrap,.bellwrap{position:relative}
.me{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 6px;border-radius:10px;text-align:left}
.me:hover{background:var(--hover)}
.av{width:38px;height:38px;border-radius:50%;background:#1A1916;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:0 0 38px}
.me b{display:block;font-size:13.5px;line-height:1.2}.me small{display:block;font-size:12px;color:var(--muted)}
.select{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;max-width:240px}
.page{max-width:1500px;margin:auto;padding:20px 24px 60px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.heading-r{display:flex;gap:10px;align-items:center}
.monthsel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 6px 0 10px;color:var(--muted)}
.monthsel select{border:0;background:none;padding:8px 2px;font-size:13px;color:var(--ink)}
.monthsel select:focus{outline:none}
.heading h1{font-weight:700;font-size:24px;line-height:1.2;margin:0}
.sub{font-size:13px;color:var(--muted)}
.btn{border:1px solid #A8853F;border-radius:var(--r-sm);padding:8px 15px;background:linear-gradient(180deg,#D3B26E,#B8924B);color:#1A1916;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.btn:hover{filter:brightness(1.05)}
.btn.secondary{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{border-color:var(--gold)}
.btn.danger{background:#8E2A35;border-color:#8E2A35;color:#fff}
.mini{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 9px;font-size:12.5px}
.mini:hover{border-color:var(--gold)}
.mini.del{color:#8E2A35}

/* cards & stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat strong{display:block;font-weight:700;font-size:26px;line-height:1.15}
.stat label{display:block;color:var(--ink);font-size:13px;margin-top:6px}
.stat small{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin:0 0 2px}
.card .hint{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.barrow{display:grid;grid-template-columns:minmax(110px,200px) 1fr minmax(44px,auto);gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar{height:16px;background:#F3EFE6;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--goldbar);border-radius:5px}
.barrow b{text-align:right;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px}
.row b{font-weight:500}
.row span{color:var(--muted);text-align:right}
.tablewrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:720px}
.table th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:9px 12px;background:#FAF7EF;border-bottom:1px solid var(--line);white-space:nowrap}
.table th:first-child{border-radius:6px 0 0 0}.table th:last-child{border-radius:0 6px 0 0}
.table td{padding:10px 12px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
.table td b{font-weight:600;white-space:nowrap}
.table .num{white-space:nowrap}
.table tbody tr:hover td{background:#FCF8EE}
.table td.acts{white-space:nowrap}
.table td.acts .mini{margin:2px 2px 2px 0}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;background:var(--green-bg);color:var(--green);font-size:12px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.blue{background:var(--blue-bg);color:var(--blue)}.tag.red{background:var(--red-bg);color:var(--red)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.toolbar input{max-width:360px;flex:1}
.field{width:100%;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;outline:none}
.aichat{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow:auto;padding:4px 2px 8px}
.aimsg{padding:10px 13px;border-radius:var(--r);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-width:85%}
.aimsg.u{align-self:flex-end;background:var(--pale);border:1px solid var(--line)}
.aimsg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.aimeta{margin-top:6px;font-size:11px;color:var(--muted)}
.aimsg.err{border-color:var(--red);background:var(--red-bg)}
.aiform{display:flex;gap:8px;margin-top:10px}.aiform textarea{flex:1;resize:vertical;min-height:44px}
.field:focus{border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(199,155,53,.18)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.notice{background:var(--hl);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:#5C4B2A;margin-bottom:14px}

/* pipeline (amo-style) */
.pipebar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pipebar .total{margin-left:auto;font-size:13px;color:var(--muted)}.pipebar .total b{color:var(--ink)}
.columns{display:flex;gap:10px;overflow-x:auto;padding-bottom:100px;align-items:flex-start}
.col{flex:1 0 250px;max-width:340px;display:flex;flex-direction:column}
.colhead{border-radius:var(--r) var(--r) 0 0;padding:10px 12px 9px;border-bottom:3px solid rgba(44,36,21,.18)}
.colhead .n{font-weight:600;font-size:13.5px;display:flex;justify-content:space-between}
.colhead .m{font-size:12px;color:var(--colm);margin-top:2px}
.colbody{background:rgba(255,252,243,.55);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:8px;display:flex;flex-direction:column;gap:7px;min-height:140px;transition:background .15s}
.colbody.over{background:var(--pale)}
.quick{border:1px dashed var(--line);background:none;border-radius:var(--r-sm);padding:7px;color:var(--faint);font-size:13px;text-align:left}
.quick:hover{color:var(--ink);border-color:var(--gold)}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px 8px;box-shadow:var(--shadow);cursor:grab}
.lead:hover{border-color:var(--gold)}
.lead.dragging{opacity:.45}
.lead.waiting{border-color:#E7A0A8;box-shadow:0 0 0 1px #F3CDD1 inset}
.lead .lbadges{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap}.lead .wait{font-size:11px;font-weight:600;padding:1px 8px;border-radius:9px;background:var(--red-bg);color:var(--red)}.lead .stu{font-size:11px;padding:1px 8px;border-radius:9px;background:var(--green-bg);color:var(--green)}
.lead .last{margin-top:5px;font-size:12.5px;color:var(--ink);opacity:.85;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead .mgr{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted)}.lead .mgr i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--pale);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink)}.lead .mgr span{margin-left:auto;color:var(--faint)}
.cguide{font-size:12px;color:var(--muted);padding:6px 8px 4px;cursor:pointer}.cguide .rl{margin-bottom:3px}.cguide .wd{font-weight:600;color:var(--ink)}.cguide .gt{display:none;margin-top:4px;line-height:1.45}.cguide.open .gt{display:block}.cguide.open .wd{color:var(--gold-deep)}
.dtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}@media(max-width:800px){.dtiles{grid-template-columns:repeat(2,1fr)}}
.dtile{border:0;border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--ink)}.dtile span{font-size:12.5px;opacity:.8}.dtile b{font-size:26px;font-weight:700}
.dtile.t1{background:#F6D9E0}.dtile.t2{background:#DCE8F5}.dtile.t3{background:#F7E3D3}.dtile.t4{background:#E3EEDB}
[data-theme=dark] .dtile.t1{background:#4a2e35}[data-theme=dark] .dtile.t2{background:#2c3a4a}[data-theme=dark] .dtile.t3{background:#4a3a2c}[data-theme=dark] .dtile.t4{background:#33422c}
.qr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qarow{border-bottom:1px solid var(--line);padding:6px 0}.qachecks{display:flex;gap:6px;flex-wrap:wrap}.tag.red{background:var(--red-bg);color:var(--red)}
.lead .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lead b{font-weight:600}
.lead .d{font-size:11.5px;color:var(--faint);white-space:nowrap}
.lead small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.lead .price{font-weight:600;font-size:13px;margin-top:4px}
.lead .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lead .tags span{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--pale);color:var(--muted)}
.lead .ltv{margin-top:6px;font-size:12px;padding:4px 8px;border-radius:6px;background:var(--hl);border:1px solid #EBD38E;color:#6B4F12}
.lead .ltv b{font-weight:600}
.colhead .f{font-size:12px;color:var(--colm)}
.actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.dropbar{position:fixed;left:236px;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;height:80px;transform:translateY(100%);visibility:hidden;transition:transform .18s,visibility 0s .18s;z-index:25}
.dropbar.on{transform:none;visibility:visible;transition:transform .18s}
.dropbar div{display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;text-align:center;border-top:3px solid rgba(0,0,0,.15)}
.dropbar .lost{background:#8E2A35}.dropbar .del{background:#6B5C3F}
.dropbar div.over{filter:brightness(1.15)}
.dropbar.nodel{grid-template-columns:1fr}.dropbar.nodel .del{display:none}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(44,36,21,.4);display:none;place-items:center;z-index:40;padding:14px}
.modal{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-height:90vh;overflow:auto;box-shadow:0 14px 40px rgba(44,36,21,.25)}
.modal h2{font-weight:700;font-size:21px;margin:0 0 14px;line-height:1.2}
.modal .card{background:var(--panel2)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.formfield{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.formfield label{font-size:12.5px;color:var(--muted)}
.formfield.full{grid-column:1/-1}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translate(-50%,20px);background:var(--inkbg);color:#F7E7B6;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hamb{display:none;background:none;border:0;padding:6px;color:var(--ink)}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:grid;place-items:center;background:var(--inkbg);color:#E9D6A6;font-size:28px;font-weight:600;flex:0 0 84px}

/* amoCRM-style deal card, tasks, robots */
.ptabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ptabs button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--muted)}
.hubtabs{margin:-6px 0 16px}.hubtabs button{font-size:14px;padding:8px 16px}
.ptabs button.on{background:var(--inkbg);color:#fff;border-color:var(--ink);font-weight:600}
.ptabs button b{margin-left:6px;font-weight:600}
.lead .task{margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:12px;display:flex;gap:6px;align-items:flex-start;color:var(--text)}
.tdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:4px;background:var(--green)}
.tdot.late{background:var(--red)}.tdot.none{background:#E3A23A}
.lead .rsn{font-size:11.5px;color:var(--red)}
#askbg,#reasonbg{z-index:70}
#dealbg{position:fixed;inset:0;background:rgba(26,25,22,.35);z-index:45;display:none}
#dealbg.on{display:block}
#deal{position:fixed;top:0;right:0;bottom:0;width:min(1040px,100%);background:var(--bg);z-index:46;display:grid;grid-template-columns:380px 1fr;transform:translateX(100%);transition:transform .22s ease;box-shadow:-10px 0 34px rgba(26,25,22,.2)}
#deal.on{transform:none}
.dl{background:var(--panel);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dh .x{float:right;border:0;background:none;font-size:24px;line-height:1;color:var(--muted);padding:0 4px}
.dh h2{margin:0 0 2px;font-size:20px;font-weight:700;line-height:1.2}
.dh .meta{font-size:12px;color:var(--muted)}
.sbar{display:flex;gap:3px;margin:12px 0 8px}.sbar i{flex:1;height:7px;border-radius:2px;background:#ECE7DC}.sbar i.on{background:var(--gold)}
.dh select{width:100%;font-weight:600}
.dup{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
.dup button{border:0;background:none;color:var(--blue);text-decoration:underline;padding:0;font-size:12.5px}
.df{padding:12px 18px;display:grid;gap:10px}
.df .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.df label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.df .field{padding:7px 9px}

html[data-theme="dark"] .left{background:#1E2A18;border-color:#33452A}

/* ===== Воронка: фильтры, список, массовые действия ===== */
.pfbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pfbar .field{width:auto;max-width:190px;padding:7px 9px;font-size:13px}.pfbar input.field{max-width:240px;flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;color:var(--muted)}.seg button.on{background:var(--inkbg);color:#fff;font-weight:600}
.pviews{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.chip{display:inline-flex;border:1px solid var(--line);border-radius:20px;background:var(--panel);overflow:hidden;font-size:12.5px}
.chip button{border:0;background:none;padding:4px 10px}.chip button+button{padding:4px 8px 4px 2px;color:var(--faint)}.chip button:hover{color:var(--gold-deep)}
.tg{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--blue-bg);color:var(--blue)}
.lead .tags span.tg{background:var(--blue-bg);color:var(--blue)}
.aip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}.aip.hi{background:var(--green-bg);color:var(--green)}.aip.mid{background:var(--warn-bg);color:var(--warn)}.aip.lo{background:var(--red-bg);color:var(--red)}
.lead .tags span.aip.hi{background:var(--green-bg);color:var(--green)}.lead .tags span.aip.mid{background:var(--warn-bg);color:var(--warn)}.lead .tags span.aip.lo{background:var(--red-bg);color:var(--red)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--hl);border-radius:var(--r) var(--r) 0 0;position:sticky;top:0;z-index:2}
.bulk .field{width:auto;max-width:180px;padding:6px 8px;font-size:13px}
.plist td{vertical-align:top}.plist tr.sel td{background:var(--hl)}.plist .late{color:var(--red)}
.plist .stg{font-size:12px;padding:2px 8px;border-radius:9px;white-space:nowrap;color:var(--text)}
.lnk{border:0;background:none;padding:0;font-weight:600;color:var(--text);text-align:left}.lnk:hover{color:var(--gold-deep);text-decoration:underline}
.pvnew{display:inline-flex;gap:6px}.pvnew .field{max-width:200px}
.shist{margin:4px 0 10px;font-size:13px}.shist summary{cursor:pointer;color:var(--muted);padding:4px 0}
.aideal{display:flex;flex-direction:column;gap:10px}
.aideal .mini.on{border-color:var(--gold);background:var(--hl)}
.aiout{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2);max-height:240px;overflow:auto}
.aiout.err{border-color:var(--red);background:var(--red-bg);color:var(--red)}
/* ===== Плавность ===== */
#content.fade{animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lead{transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.lead:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(26,25,22,.06),0 10px 24px rgba(26,25,22,.08)}
.card{transition:border-color .15s}
@media(max-width:760px){.pfbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.pfbar>*{flex:0 0 auto}.pfbar input.field{flex:0 0 190px}}
@media(max-width:760px){.columns{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.col{scroll-snap-align:start}}
@media(prefers-reduced-motion:reduce){#content.fade{animation:none}.lead:hover{transform:none}}
/* ===== Палитра команд (Ctrl+K) ===== */
#cmdk{position:fixed;inset:0;z-index:60;display:none;background:rgba(17,16,14,.45);backdrop-filter:blur(3px);padding:12vh 16px 16px}
#cmdk.on{display:block}
#cmdk .box{max-width:620px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;animation:fadeIn .14s ease-out}
#cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:16px;outline:none}
#cmdk .list{max-height:55vh;overflow:auto;padding:6px}
#cmdk .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;font-size:14px}
#cmdk .it small{color:var(--muted);margin-left:auto;font-size:12px}
#cmdk .it.on{background:var(--hover)}
#cmdk .foot{border-top:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--faint)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--faint);margin-left:6px;white-space:nowrap}

.brandwho{font-size:12px;color:var(--muted);padding:0 22px 6px;text-align:center}
@media(max-width:760px){.jtable thead{display:none}.jtable,.jtable tbody,.jtable tr,.jtable td{display:block;width:100%}.jtable tr{padding:10px 0;border-bottom:1px solid var(--line)}.jtable td{border:0!important;padding:2px 0!important}.jtable{min-width:0!important}.jtable .seg{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;margin-top:6px}.jtable .seg button{padding:9px 2px;font-size:12.5px;white-space:nowrap;min-width:0}}

function delta(cur,prev,unit="%"){if(!prev&&!cur)return'<small>—</small>';if(unit==="pp"){const d=Math.round(cur-prev);return `<small class="${d>=0?"up":"down"}">${d>=0?"+":"−"}${Math.abs(d)} п.п.</small>`}
  if(!prev)return'<small class="up">новые</small>';const d=Math.round((cur-prev)/prev*100);return `<small class="${d>=0?"up":"down"}">${d>=0?"+":"−"}${Math.abs(d)}%</small>`}
function monthEnd(ym){return shiftMonth(ym,1)+"-00"}
function attRate(ym){const a=db.attendance.filter(inBranch).filter(x=>(x.date||"").startsWith(ym));const ok=a.filter(x=>x.status==="Присутствовал"||x.status==="Опоздал").length;return{a,ok,rate:a.length?ok/a.length*100:0}}
function lineChart(pts){
  const W=460,H=150,L=70,R=14,T=10,B=26,max=Math.max(...pts.map(p=>p.v),1),min=Math.min(...pts.map(p=>p.v));
  if(max<=0){pts=pts.map(p=>({...p}));}
  const step=Math.pow(10,Math.floor(Math.log10(Math.max(1,max-min||max))));let lo=Math.max(0,Math.floor(min*0.9/step)*step),hi=Math.ceil(max*1.05/step)*step;if(max<=1){lo=0;hi=1000000}if(hi===lo)hi=lo+step;
  const x=i=>L+(W-L-R)*(pts.length===1?0.5:i/(pts.length-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[0,1,2,3,4].map(i=>lo+(hi-lo)*i/4);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=line+`L${x(pts.length-1)},${H-B}L${x(0)},${H-B}Z`;
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Выручка по месяцам"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#D2AE66" stop-opacity=".55"/><stop offset="1" stop-color="#D2AE66" stop-opacity=".04"/></linearGradient></defs>
    ${ticks.map(t=>`<text x="${L-8}" y="${y(t)+4}" text-anchor="end">${Math.round(t).toLocaleString("ru-RU").replace(/\u00a0/g," ")}</text>`).join("")}
    <line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#E4DED2"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#E4DED2"/>
    <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#B8924B" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#B8924B"><title>${p.l}: ${money(p.v)}</title></circle><text x="${x(i)}" y="${H-8}" text-anchor="middle">${p.l}</text>`).join("")}</svg>`;
}
function donut(pct){const r=34,c=2*Math.PI*r,v=Math.max(0,Math.min(100,pct));
  return `<svg width="104" height="104" viewBox="0 0 90 90" role="img" aria-label="Посещаемость ${Math.round(v)}%"><defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#E5CB8E"/><stop offset="1" stop-color="#B38A41"/></linearGradient></defs>
  <circle cx="45" cy="45" r="${r}" fill="none" stroke="#EFEBE3" stroke-width="10"/>${v>0?`<circle cx="45" cy="45" r="${r}" fill="none" stroke="url(#gd)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 45 45)"/>`:""}
  <text x="45" y="50" text-anchor="middle" style="font:700 15px var(--font);fill:#1A1916">${Math.round(v)}%</text></svg>`}

function debts(){const t=today();return db.students.filter(inBranch).filter(s=>s.status!=="Архив"&&s.status!=="Пауза"&&s.status!=="Пробное").map(s=>{const ms=db.memberships.filter(m=>m.student===s.id).sort((a,b)=>(b.expires||"").localeCompare(a.expires||""));
  const act=ms.find(m=>m.total-m.used>0&&(!m.expires||m.expires>=t));return (!act||s.status==="Нужна оплата")?{s,amount:Number(ms[0]?.price||0)}:null}).filter(Boolean)}
function homeView(){

  const rNow=total(payIn(M).filter(isInc)),rPrev=total(payIn(P).filter(isInc));
  const aN=attRate(M),aP=attRate(P);
  const leads=db.leads.filter(inBranch);

/* Поиск по всей CRM */
function globalSearch(){
  const q=$("gq").value.trim().toLowerCase(),box=$("gres");
  if(q.length<2){box.classList.remove("on");box.innerHTML="";return}
  const dq=q.replace(/\D/g,"");
  const hit=(...v)=>v.some(x=>String(x||"").toLowerCase().includes(q))||(dq.length>=3&&v.some(x=>String(x||"").replace(/\D/g,"").includes(dq)));
  const res=[];
  if(allowed("Ученики"))db.students.filter(s=>hit(s.name,s.phone)).slice(0,6).forEach(s=>res.push({k:"Ученик",t:s.name,sub:s.phone+" · "+branchName(s.branch),fn:()=>openProfile(s.id)}));
  if(allowed("Заявки и воронка"))db.leads.filter(l=>hit(l.name,l.phone)).slice(0,6).forEach(l=>res.push({k:"Заявка",t:l.name,sub:l.stage+" · "+l.phone,fn:()=>openDeal(l.id)}));
  if(allowed("Группы"))db.groups.filter(g=>hit(g.name,g.teacher)).slice(0,3).forEach(g=>res.push({k:"Группа",t:g.name,sub:(g.teacher||"")+" · "+(g.days||""),fn:()=>go("Группы")}));
  box.innerHTML=res.map((r,i)=>`<button data-i="${i}"><span><b>${esc(r.t)}</b><small>${esc(r.sub)}</small></span><span class="k">${r.k}</span></button>`).join("")||'<div class="empty" style="padding:14px">Ничего не найдено</div>';
  box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{box.classList.remove("on");$("gq").value="";res[+b.dataset.i].fn()});
  box.classList.add("on");
}
/* Уведомления: заканчивающиеся абонементы, долги, платежи на 3 дня, новые заявки */
function updateBell(){
  if(!me)return;
  const t=today(),soon=new Date(Date.now()+3*864e5).toISOString().slice(0,10),items=[];
  {const lt=myTasks().filter(isLateT);if(lt.length&&(allowed("Задачи")))items.push({t:"Просроченные задачи",s:plural(lt.length,"задача","задачи","задач")+": "+lt.slice(0,2).map(x=>x.text).join("; "),go:"Задачи"})}
  if(allowed("Заявки и воронка")){const n=db.leads.filter(inBranch).filter(l=>l.stage===STAGES[0]).length;if(n)items.push({t:"Новые заявки ждут ответа",s:plural(n,"заявка","заявки","заявок"),go:"Заявки и воронка"})}
  if(allowed("Абонементы")){db.memberships.filter(inBranch).filter(m=>m.total-m.used<=2&&m.total-m.used>0||(m.expires&&m.expires>=t&&m.expires<=new Date(Date.now()+7*864e5).toISOString().slice(0,10))).slice(0,4).forEach(m=>{const s=db.students.find(x=>x.id===m.student);if(s)items.push({t:"Заканчивается абонемент: "+s.name,s:(m.total-m.used)+" из "+m.total+" занятий · до "+(m.expires||"—"),go:"Абонементы"})});
    const dl=debts();if(dl.length)items.push({t:"Задолженность",s:plural(dl.length,"ученик","ученика","учеников")+" · "+money(dl.reduce((a,x)=>a+x.amount,0)),go:"Ученики"})}
  if(allowed("Панель владельца"))db.planned.filter(x=>!x.done&&x.date<=soon).forEach(x=>items.push({t:"Платёж: "+x.title,s:money(x.amount)+" · "+x.date,go:"Панель владельца"}));
  $("bellN").hidden=!items.length;$("bellN").textContent=items.length;
  $("bellPop").innerHTML=`<h4>Уведомления</h4>`+(items.map((x,i)=>`<button class="it" data-b="${i}"><span><b style="font-weight:600">${esc(x.t)}</b><small>${esc(x.s)}</small></span></button>`).join("")||'<div class="empty" style="padding:14px">Всё спокойно</div>');
  $("bellPop").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{$("bellPop").classList.remove("on");go(items[+b.dataset.b].go)});
}

function shiftMonth(ym,k){const[y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
const isInc=p=>p.type==="Доход",isExp=p=>p.type==="Расход";
const total=(a)=>a.reduce((s,p)=>s+Number(p.amount||0),0);
function payIn(ym,list=db.payments.filter(inBranch)){return list.filter(p=>!p.noCash&&(p.date||"").startsWith(ym))}
function marginPill(m){return `<span class="mg ${m<.1?"lo":m<.25?"mid":"hi"}">${Math.round(m*100)} %</span>`}
function accBalance(name,i){const def=settings.accounts[0]?.name;let b=Number(settings.accounts[i].start||0);db.payments.forEach(p=>{if(p.noCash)return;const a=p.account||def,v=Number(p.amount||0);if(p.type==="Перевод"){if(a===name)b-=v;if(p.toAccount===name)b+=v}else if(a===name){if(isInc(p))b+=v;else if(isExp(p)||p.type==="Вывод")b-=v}});return b}

  const cats={};ps.filter(isExp).forEach(p=>{const c=EXP_CATS.includes(p.category)?p.category:"Прочее";cats[c]=(cats[c]||0)+Number(p.amount||0)});
  return {b,inc,exp,res:inc-exp,m:inc?(inc-exp)/inc:0,cats,students:db.students.filter(s=>s.branch===b.id&&s.status!=="Архив").length}}

/* Импорт операций из Excel / Google Таблицы (CSV) */
function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":",";
  const split=l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===sep&&!q){out.push(cur);cur=""}else cur+=c}out.push(cur);return out.map(v=>v.trim())};
  return lines.map(split);
}

    });

async function setStage(id,stage){
  const x=findDeal(id);if(!x||x.stage===stage)return;
  if(stage===LOST){const r=await askReason(x);if(!r)return;x.reason=r.reason;if(r.note)feedAdd(x,"note","Причина отказа: "+r.reason+". "+r.note)}

  toast(added?"Ученик добавлен в базу студии":stage===LOST?"Сделка закрыта: "+x.reason:"Этап: "+stage);
}
function applyStage(x,stage){
  const from=x.stage;x.stage=stage;x.updated=today();x.stageAt=nowISO();
  feedAdd(x,"sys",`Этап: «${from}» → «${stage}»${stage===LOST?" · "+x.reason:""}`);touchContact(x);
  logAct((x.pipeline==="renew"?"Продление «":"Заявка «")+x.name+"» → "+stage);

async function saveForm(e){
  e.preventDefault();
  const key=T2K[formType],obj={};
  new FormData(e.target).forEach((v,k)=>obj[k]=typeof v==="string"?v.trim():v);
  if(key==="lessons"){const c=lessonClash(obj,editing?.id);if(c&&!await ask(`Накладка: ${obj.date} в ${obj.time} уже есть занятие «${c.group}» (${c.teacher&&c.teacher===obj.teacher?"тот же тренер: "+c.teacher:"тот же зал: "+c.room}). Всё равно сохранить?`,"Сохранить"))return}
  // Защита от дублей: спрашиваем до создания заявки
  if(key==="leads"&&!editing){const dp=dupOf({id:-1,phone:obj.phone});if(dp.length&&!await ask(`Этот номер уже есть в базе: ${dp.map(d=>d.k.toLowerCase()+" «"+d.n+"» ("+d.st+")").join(", ")}. Всё равно создать новую заявку?`,"Создать"))return}
  NUMS.forEach(k=>{if(obj[k]!==undefined)obj[k]=Number(obj[k])||0});
  if(formType==="membership"&&obj.used>obj.total){toast("Использовано больше, чем всего занятий");return}
  let rec;
  if(editing){const i=db[key].findIndex(x=>x.id===editing.id);db[key][i]=rec={...db[key][i],...obj}}
  else{rec={...obj,id:nid()};if(key==="leads"){rec.created=rec.updated=today();rec.createdAt=nowISO();rec.pipeline="sales";rec.feed=[];feedAdd(rec,"sys","Заявка создана · "+(rec.source||"источник не указан"));const dp=dupOf(rec);if(dp.length)feedAdd(rec,"sys","Внимание, номер уже есть в базе: "+dp.map(d=>d.n).join(", "));onEnterStage(rec)}db[key].push(rec)}
  afterSave(key,rec,!editing);
  logAct((editing?"Изменено: ":"Добавлено: ")+NAMES[formType]+(obj.name||obj.title?" «"+(obj.name||obj.title)+"»":""));
  const added=key==="leads"&&leadToStudent(rec);
  persist();closeModal();init();
  if(key==="leads"&&!editing){const dp=dupOf(rec);toast(dp.length?"Заявка создана. Этот номер уже есть: "+dp[0].n:"Заявка создана, робот поставил задачу");openDeal(rec.id)}else toast(added?"Сохранено. Ученик добавлен в базу студии":"Сохранено");
}
async function deleteItem(key,id){
  if(!isBoss()&&!(role==="Управляющий"&&["trials","rent","utilities","salaries","insurance","expenses","fines"].includes(key)))return;
  const x=db[key].find(i=>i.id===id);if(!x)return;
  if(!await ask(`Удалить ${NAMES[K2T[key]]}${x.name?" «"+x.name+"»":""}? Это действие нельзя отменить.`))return;
  db[key]=db[key].filter(i=>i.id!==id);
  if(key==="attendance")undoVisit(x);
  if(key==="students"){db.memberships=db.memberships.filter(m=>m.student!==id);db.attendance=db.attendance.filter(a=>a.student!==id)}
  if(key==="leads"||key==="renewals")db.tasks=db.tasks.filter(t=>t.dealId!==id);
  logAct("Удалено: "+NAMES[K2T[key]]+(x.name?" «"+x.name+"»":""));
  persist();render();toast("Запись удалена");
}
function quickAttendance(id){
  const s=db.students.find(x=>x.id===id);if(!s)return;
  if(db.attendance.some(a=>a.student===id&&a.date===today())){toast("Сегодня уже отмечен");return}
  const a={id:nid(),student:id,date:today(),group:s.group,branch:s.branch,status:"Присутствовал"};db.attendance.push(a);deductVisit(a);
  logAct("Посещение: "+s.name);persist();toast("Посещение отмечено");
  if(allowed("Посещаемость"))go("Посещаемость");
}

const XL={

    const cd=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cd,true);e.setUint32(16,off,true);

  x:s=>String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
  col(i){let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s},

        if(hd)return `<c r="${ref}" t="inlineStr" s="1"><is><t>${XL.x(v)}</t></is></c>`;
        if((t==="n"||t==="money")&&v!==""&&isFinite(+v))return `<c r="${ref}" s="${t==="money"?2:0}"><v>${+v}</v></c>`;
        if(t==="date"&&/^\d{4}-\d{2}-\d{2}/.test(v)){const ms=Date.UTC(+v.slice(0,4),+v.slice(5,7)-1,+v.slice(8,10));const tm=/T(\d{2}):(\d{2})/.exec(v);const frac=tm?(+tm[1]*60+ +tm[2])/1440:0;return `<c r="${ref}" s="${tm?4:3}"><v>${ms/864e5+25569+frac}</v></c>`}

async function saveFile(name,blob){
  try{const dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:blob});toast("Файл сохранён: "+name);return}}
  catch(e){if(e&&e.code==="declined"){toast("Сохранение отменено");return}
    if(e&&e.code&&!["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code)){toast("Не удалось сохранить файл ("+e.code+")");return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("Файл скачивается: "+name);
}

  if(left<=0){toast("Лимит заморозки по этому абонементу исчерпан ("+freezeMax()+" дн.)");return}
  const v=await askForm("Заморозка абонемента",`<p class="hint" style="margin:0 0 8px">Абонемент «${esc(m.title)}». Можно заморозить ещё на ${left} дн. (лимит ${freezeMax()} дн. на абонемент — меняется в «Настройках»).</p>
    ${FF("from","С какого дня",`<input class="field" type="date" value="${today()}" required>`)}${FF("days","На сколько дней",`<input class="field" type="number" min="1" max="${left}" value="${Math.min(14,left)}" required>`)}
    ${FF("reason","Причина",`<select class="field">${["Болезнь","Отпуск / отъезд","Учёба / экзамены","Травма","Другое"].map(r=>`<option>${r}</option>`).join("")}</select>`)}`,"Заморозить");
  if(!v)return;const days=Math.max(1,Math.min(left,Number(v.days)||0));
  (m.freezes=m.freezes||[]).push({from:v.from||today(),days,reason:v.reason,until:addDays(v.from||today(),days)});if(m.expires)m.expires=addDays(m.expires,days);
  const s=db.students.find(x=>x.id===m.student);if(s&&(v.from||today())<=today()&&s.status!=="Архив"){s.pausedBy=m.id;s.status="Пауза"}
  logAct("Заморозка: "+(s?.name||"")+" на "+days+" дн.");persist();render();toast("Абонемент заморожен на "+days+" дн., срок продлён до "+(m.expires||"—"))}
function robotUnfreeze(){let ch=false;const t=today();db.memberships.forEach(m=>{(m.freezes||[]).forEach(f=>{const s=db.students.find(x=>x.id===m.student);if(!s)return;
    if(f.from<=t&&f.until>t&&s.status!=="Архив"&&s.status!=="Пауза"){s.status="Пауза";s.pausedBy=m.id;ch=true}
    if(f.until<=t&&s.status==="Пауза"&&s.pausedBy===m.id){s.status="Активен";delete s.pausedBy;ch=true}})});return ch}

const SEGMENTS=[["active","Все активные ученики"],["debt","Должники (нужна оплата)"],["expiring","Абонемент кончается в 7 дней"],["group","Группа…"],["bday","Дни рождения в этом месяце"],["left","Ушедшие за 90 дней — вернуть"],["trial","Заявки на пробном, не купили"],["newleads","Новые заявки без ответа"]];

  const S=s=>{const m=lastM(s.id);return {id:"s"+s.id,name:s.name,phone:s.phone,branch:s.branch,price:m?.price||0,expires:m?.expires||"",note:s.group||""}};
  if(mSeg==="active")return st.filter(s=>s.status==="Активен").map(S);
  if(mSeg==="debt")return debts().map(d=>({...S(d.s),price:d.amount}));
  if(mSeg==="expiring"){const lim=addDays(t,7);return st.filter(s=>s.status!=="Архив"&&(m=>m&&m.expires>=t&&m.expires<=lim)(lastM(s.id))).map(S)}

  return L.filter(l=>l.stage===STAGES[0]&&!l.firstContactAt).map(l=>({id:"l"+l.id,name:l.name,phone:l.phone,branch:l.branch,price:l.price,expires:"",note:"заявка"}))}

/* ===== ОПУ, ДДС и Баланс — по правилам таблицы «Камран_УО» =====
   ОПУ (прибыль): по месяцу ОПУ, только статьи из справочника. Продажи → Себестоимость (ЗП тренеров) → Маржа
   → Переменные → Валовая прибыль → Постоянные → Головной → Операционная прибыль → Налоги бизнеса (% от продаж) → Чистая.
   Расход, который относится к колонке (филиал / категория / тренер), идёт в неё; остальное делится по доле продаж.
   ДДС (деньги): по дате оплаты. Баланс: остатки по счетам. */
const CAT2GRP={"Зарплата тренеров":"Себестоимость","Комиссия банка":"Переменные","ЗП персонала и бонусы":"Переменные","Аренда":"Постоянные","Реклама":"Постоянные","Костюмы и инвентарь":"Постоянные","Налоги":"Налоги","Прочее":"Головной"};
const OPU_GROUPS=["Себестоимость","Переменные","Постоянные","Головной"];
const opuM=p=>p.opu||(p.date||"").slice(0,7);
function opuGrp(p){if(p.type==="Перевод")return"";if(p.grp)return p.grp;if(isInc(p))return"Продажи";if(p.type==="Вывод")return"Вывод";return CAT2GRP[p.category]||"Головной"}
const opuArt=p=>p.art||(isInc(p)?"Продажи "+branchName(p.branch):p.category||"Прочее");
/* Ставка налога бизнеса: заданная в «Экономике», иначе 3% до 2025 г. и 4% с 2026 г. (упрощёнка ИП) */
const bizTax=per=>settings.taxRate!==undefined&&settings.taxRate!==""?Number(settings.taxRate):(Number(String(per).slice(0,4))<=2025?3:4);
const OPU_DIMS={branch:"Филиалы",cat:"Категории",teacher:"Тренеры",month:"Месяцы"};
function opuKey(p,dim){if(dim==="branch")return p.branch?String(p.branch):"";if(dim==="cat")return isInc(p)?(p.category||""):(p.pcat||"");if(dim==="teacher")return p.teacher||"";return opuM(p)}
function opuLabel(k,dim){if(dim==="branch")return branchName(+k)||"—";if(dim==="month"){const[y,m]=k.split("-");return ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"][+m-1]+" "+y}return k||"—"}
function opuReport(dim,per,bid=null){
  const ps=db.payments.filter(p=>p.type!=="Перевод"&&opuM(p).startsWith(per)&&(bid==null?inBranch(p):p.branch===bid));
  const sales=ps.filter(p=>opuGrp(p)==="Продажи"),S={},N={},O={};
  sales.forEach(p=>{const k=opuKey(p,dim);S[k]=(S[k]||0)+Number(p.amount||0);if(p.kind==="Новенький")N[k]=(N[k]||0)+1;else if(p.kind==="Действующий")O[k]=(O[k]||0)+1});
  let cols=Object.keys(S);cols=dim==="month"?cols.sort():cols.sort((a,b)=>S[b]-S[a]);
  const tot=cols.reduce((a,k)=>a+S[k],0),G={},A={},U={},UA={};cols.forEach(k=>{G[k]={};A[k]={}});
  ps.forEach(p=>{const g=opuGrp(p);if(!OPU_GROUPS.includes(g))return;const k=opuKey(p,dim),a=Number(p.amount||0),art=opuArt(p);
    if(k in G){G[k][g]=(G[k][g]||0)+a;A[k][g+"|"+art]=(A[k][g+"|"+art]||0)+a}else{U[g]=(U[g]||0)+a;UA[g+"|"+art]=(UA[g+"|"+art]||0)+a}});
  const col=k=>{const sh=tot?S[k]/tot:0,v=g=>(G[k][g]||0)+(U[g]||0)*sh,arts={};
    Object.entries(A[k]).forEach(([ga,x])=>arts[ga]=(arts[ga]||0)+x);Object.entries(UA).forEach(([ga,x])=>arts[ga]=(arts[ga]||0)+x*sh);
    const r={k,label:opuLabel(k,dim),nNew:N[k]||0,nOld:O[k]||0,sales:S[k],cogs:v("Себестоимость"),vari:v("Переменные"),fixed:v("Постоянные"),head:v("Головной"),arts};
    r.margin=r.sales-r.cogs;r.gross=r.margin-r.vari;r.oper=r.gross-r.fixed-r.head;r.tax=r.sales*bizTax(per)/100;r.net=r.oper-r.tax;return r};
  const rows=cols.map(col);
  const T={k:"",label:"Итого",nNew:0,nOld:0,sales:tot,arts:{}};["cogs","vari","fixed","head","margin","gross","oper","tax","net","nNew","nOld"].forEach(f=>T[f]=rows.reduce((a,r)=>a+r[f],0));
  if(!rows.length){["cogs","vari","fixed","head"].forEach((f,i)=>T[f]=U[OPU_GROUPS[i]]||0);T.margin=-T.cogs;T.gross=T.margin-T.vari;T.oper=T.gross-T.fixed-T.head;T.tax=0;T.net=T.oper}
  rows.forEach(r=>Object.entries(r.arts).forEach(([ga,x])=>T.arts[ga]=(T.arts[ga]||0)+x));if(!rows.length)Object.assign(T.arts,UA);
  const wd=total(ps.filter(p=>opuGrp(p)==="Вывод"));
  return {dim,per,rows,T,wd}}

  ${L("− Постоянные расходы",c=>c.fixed)}${det("Постоянные")}${L("− Головной (общие)",c=>c.head)}${det("Головной")}${L("= Операционная прибыль",c=>c.oper,{b:1})}

/* ===== LTV и профиль ученика ===== */
/* LTV: фактические оплаты ученика (доходы минус возвраты) или сумма цен его абонементов — что больше
   (часть старых оплат может быть не привязана к ученику, тогда выручают цены абонементов) */
let _ltvIdx=null;   // индекс сумм по ученикам; сбрасывается при каждом сохранении
function ltvIndex(){if(_ltvIdx)return _ltvIdx;const paid={},memb={};
  db.payments.forEach(p=>{if(!p.student)return;const v=Number(p.amount||0);if(isInc(p))paid[p.student]=(paid[p.student]||0)+v;else if(isExp(p)&&p.action==="Возвраты")paid[p.student]=(paid[p.student]||0)-v});
  db.memberships.forEach(m=>{memb[m.student]=(memb[m.student]||0)+Number(m.price||0)});return _ltvIdx={paid,memb}}
function ltv(id){const x=ltvIndex();return Math.max(x.paid[id]||0,x.memb[id]||0)}
function canLtv(){return allowed("Финансы")||allowed("Абонементы")}
/* Средний LTV платящего ученика: на него опирается прогноз по воронке */
function avgLtv(list=db.students){const v=list.map(s=>ltv(s.id)).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
/* Уже клиент: ученики с тем же телефоном (родитель приводит второго ребёнка) */
function clientsByPhone(phone){const p=nd(phone);return p?db.students.filter(s=>nd(s.phone)===p):[]}
function ltvCard(){
  const st=db.students.filter(inBranch),v=st.map(s=>ltv(s.id)),tot=v.reduce((a,b)=>a+b,0),pay=v.filter(x=>x>0).length;
  const top=[...st].filter(s=>ltv(s.id)>0).sort((a,b)=>ltv(b.id)-ltv(a.id)).slice(0,5);
  const srcs=[...new Set(st.map(s=>s.source).filter(x=>x&&x!=="—"))].map(src=>{const g=st.filter(s=>s.source===src);return [src,Math.round(avgLtv(g)),g.length]}).sort((a,b)=>b[1]-a[1]);
  const maxS=Math.max(1,...srcs.map(r=>r[1]));
  return `<div class="grid2"><div class="card"><h3>LTV по источникам</h3><div class="hint">Средний LTV платящего ученика по каналу, откуда он пришёл. Помогает понять, в какую рекламу вкладывать.</div>${srcs.map(([src,v,n])=>`<div class="barrow"><span>${esc(src)} <span class="sub">· ${plural(n,"ученик","ученика","учеников")}</span></span><div class="bar"><i style="width:${v/maxS*100}%;background:var(--s4)"></i></div><b class="num" style="width:auto">${money(v)}</b></div>`).join("")||'<div class="empty">Укажите у учеников, откуда они пришли</div>'}</div>
  <div class="card"><h3>LTV учеников</h3><div class="hint">Сумма купленных абонементов на одного ученика</div><div class="row"><b>Средний LTV платящих</b><span class="num">${money(pay?tot/pay:0)}</span></div><div class="row"><b>Общий LTV</b><span class="num">${money(tot)}</span></div><div class="row"><b>Платящих учеников</b><span>${pay} из ${st.length}</span></div>${top.map(s=>`<div class="row"><b>${esc(s.name)}</b><span class="num">${money(ltv(s.id))}</span></div>`).join("")}</div></div>`;
}

async function enter(u){
  // Временный пароль: при первом входе сотрудник задаёт свой

    while(!ok){const v=await askForm("Задайте свой пароль",`<div class="hint">Вы вошли с временным паролем. Придумайте новый — минимум 8 символов.</div>`+FF("a","Новый пароль",`<input class="field" type="password" minlength="8" required autocomplete="new-password">`)+FF("b","Повторите пароль",`<input class="field" type="password" minlength="8" required autocomplete="new-password">`),"Сохранить");

      if((v.a||"").length<8)toast("Минимум 8 символов");else if(v.a!==v.b)toast("Пароли не совпадают");else if(v.a===u.pass)toast("Новый пароль должен отличаться от временного");else{u.pass=v.a;delete u.mustChange;persist();ok=true;toast("Пароль сохранён")}}}

function addUser(){
  if(!isBoss())return;
  const g=id=>$(id).value.trim();

  if(!phone||!name||!pass){toast("Заполните имя, номер и пароль");return}

/* ===== Данные студии из репозитория (зашифрованы) =====
   Репозиторий публичный, поэтому таблица лежит в studio-data.enc.json только в виде шифра
   (gzip → AES-256-GCM, ключ из пароля через PBKDF2-SHA256). Пароль знает только студия;
   он вводится один раз на устройстве, нигде не сохраняется. */
let encData=null,encLater=false;
async function loadEnc(){if(encData!==null)return encData;try{const r=await fetch("studio-data.enc.json",{cache:"no-cache"});encData=r.ok?await r.json():false}catch(e){encData=false}return encData}
function encBanner(){if(!encData||settings.xlsVersion===encData.v)return"";
  return `<div class="notice" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:220px"><b>Таблица студии ещё не загружена на это устройство.</b> Все 17 листов таблицы «Камран_УО» (ученики, оплаты, группы, операции, отчёты ОПУ и ДДС) ждут загрузки — нужен пароль данных.</span><button class="btn" data-act="encload">Загрузить данные студии</button></div>`}
async function checkEncData(){if(!me)return;const e=await loadEnc();if(!e||settings.xlsVersion===e.v)return;if(current==="Главная")render();if(!encLater)showEncPrompt()}
async function decryptEnc(e,pass){const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),S=crypto.subtle;
  const base=await S.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await S.deriveKey({name:"PBKDF2",salt:u(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const raw=await S.decrypt({name:"AES-GCM",iv:u(e.iv)},key,u(e.ct));
  return JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text())}
async function showEncPrompt(){const e=await loadEnc();if(!e){toast("Файл данных студии в репозитории не найден");return}if($("encbg"))return;
  const d=document.createElement("div");d.className="modalbg";d.id="encbg";d.style.display="grid";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  d.innerHTML=`<form class="modal" style="width:min(420px,100%)"><h2>Данные студии</h2><p class="hint" style="margin:0 0 10px">В CRM есть таблица студии (обновлена ${esc(e.v.replace("sheet-",""))}): ученики, оплаты, группы, операции. Она зашифрована, потому что сайт открыт всем. Введите пароль данных — его достаточно ввести один раз на этом устройстве.</p>
    <input class="field" id="encPass" type="password" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" aria-label="Пароль данных"><div class="sub" id="encErr" style="color:var(--red);min-height:18px;margin-top:6px"></div>
    <div class="modalfoot"><button type="button" class="btn secondary" id="encLater">Позже</button><button class="btn" id="encGo">Загрузить</button></div></form>`;
  document.body.append(d);$("encPass").focus();
  $("encLater").onclick=()=>{encLater=true;d.remove();if(current==="Главная")render()};
  d.querySelector("form").onsubmit=async ev=>{ev.preventDefault();const p=$("encPass").value.trim().toUpperCase();if(!p)return;$("encGo").disabled=true;$("encGo").textContent="Расшифровка…";$("encErr").textContent="";
    let data;try{data=await decryptEnc(e,p)}catch(_){$("encErr").textContent="Неверный пароль";$("encGo").disabled=false;$("encGo").textContent="Загрузить";return}
    XLS=data;importXls();persist();d.remove();init();toast("Данные студии загружены: "+data.students.length+" учеников, "+data.payments.length+" операций")}}

   tier "heavy" (разборы, сводки): сначала сильные. Внутри группы — по доле израсходованного дневного лимита;

function openCmd(){const bg=$("cmdk"),inp=$("cmdq"),list=$("cmdl");let items=[],sel=0;

    list.innerHTML=items.map((r,i)=>`<button class="it ${i===sel?"on":""}" role="option" data-i="${i}"><b>${esc(r.t)}</b><small>${esc(r.k)}</small></button>`).join("")||'<div class="empty" style="padding:14px">Ничего не найдено</div>';
    list.querySelector(".on")?.scrollIntoView({block:"nearest"})};
  const run=i=>{const r=items[i];if(!r)return;close();r.fn()},close=()=>{bg.classList.remove("on");inp.onkeydown=inp.oninput=null};
  inp.value="";sel=0;draw();bg.classList.add("on");inp.focus();

  ${simpleTable(["Филиал","Вид","Сумма","Месяц","Дата оплаты","Статус","Согласование","Комментарий"],A,x=>[esc(branchName(x.branch)),esc(x.kind),money(x.amount),esc(x.month||"—"),esc(x.payDate||"—"),payTag(x.status),approveCell("utilities",x),esc(x.comment||"")],"utilities")}`};
views["Зарплаты"]=()=>{const A=db.salaries.filter(inBranch),tot=x=>Number(x.base||0)+Number(x.extra||0)-Number(x.deduct||0);
  return `<div class="stats">${statsCard("Начислено",money(A.reduce((a,x)=>a+tot(x),0)),"")}${statsCard("Выплачено",money(A.filter(x=>x.status==="Выплачено").reduce((a,x)=>a+tot(x),0)),"")}${statsCard("К выплате",money(A.filter(x=>x.status!=="Выплачено").reduce((a,x)=>a+tot(x),0)),"")}</div>
  ${simpleTable(["Сотрудник","Должность","Филиал","Оклад","Доплаты","Удержания","К выплате","Дата выплаты","Статус"],A,x=>[esc(x.who),esc(x.position||"—"),esc(branchName(x.branch)),money(x.base),money(x.extra),money(x.deduct),`<b>${money(tot(x))}</b>`,esc(x.payDate||"—"),payTag(x.status||"Не выплачено")],"salaries")}`};
views["Медстраховка"]=()=>{const A=db.insurance.filter(inBranch);return `<div class="stats">${statsCard("Полисов",A.length,"")}${statsCard("Сумма",money(sumBy(A)),"")}${statsCard("Не оплачено",money(sumBy(A.filter(x=>x.status!=="Оплачено"))),"")}</div>
  ${simpleTable(["Сотрудник","Страховая компания","Сумма","Период действия","Дата оплаты","Статус","Согласование"],A,x=>[esc(x.who),esc(x.company),money(x.amount),esc(x.period||"—"),esc(x.payDate||"—"),payTag(x.status),approveCell("insurance",x)],"insurance")}`};
views["Доп. расходы"]=()=>{const A=db.expenses.filter(inBranch);return `<div class="row" style="margin-bottom:12px">${catBtn("ecat")}</div><div class="stats">${statsCard("Расходы за месяц",money(sumBy(A.filter(x=>(x.date||"").startsWith(ym())))),"")}${statsCard("На согласовании",A.filter(x=>x.approval!=="Согласовано").length,"")}${statsCard("Не оплачено",money(sumBy(A.filter(x=>x.status!=="Оплачено"))),"")}</div>
  ${simpleTable(["Название","Категория","Сумма","Дата","Филиал","Ответственный","Статус","Согласование","Комментарий"],A,x=>[esc(x.title),esc(x.category||"—"),money(x.amount),esc(x.date||"—"),esc(branchName(x.branch)),esc(x.responsible||"—"),payTag(x.status),approveCell("expenses",x),esc(x.comment||"")],"expenses")}`};
views["Штрафы"]=()=>{const A=db.fines.filter(inBranch),c=st=>A.filter(x=>(x.status||"Назначен")===st);
  const per={};A.forEach(x=>{(per[x.who]=per[x.who]||[]).push(x)});
  return `<div class="stats">${["Назначен","Оспаривается","Удержан","Отменён"].map(st=>statsCard(st,c(st).length,money(sumBy(c(st))))).join("")}</div>
  ${simpleTable(["Сотрудник","Должность","Филиал","Причина","Сумма","Дата","Кто назначил","Статус","Комментарий"],A.sort((a,b)=>(b.date||"").localeCompare(a.date||"")),x=>[esc(x.who),esc(x.position||"—"),esc(branchName(x.branch)),esc(x.reason),money(x.amount),esc(x.date||"—"),esc(x.by||"—"),esc(x.status||"Назначен"),esc(x.comment||"")],"fines")}
  <div class="card"><h3>История штрафов по сотрудникам</h3>${Object.entries(per).map(([w,L])=>`<div class="row"><b>${esc(w)}</b><span class="sub">${plural(L.length,"штраф","штрафа","штрафов")} · ${money(sumBy(L.filter(x=>x.status!=="Отменён")))}</span></div>`).join("")||'<div class="empty">Пока нет данных</div>'}</div>`};

/* --- Контроль управляющего --- */
views["Контроль"]=()=>{const t=today(),W=db.workShifts.filter(inBranch),T=db.trials.filter(inBranch);
  const pend=[["rent","Аренда"],["utilities","Коммунальные"],["insurance","Страховка"],["expenses","Доп. расходы"]].flatMap(([k,n])=>db[k].filter(inBranch).filter(x=>x.approval!=="Согласовано").map(x=>({k,n,x})));
  const debts=[["rent","Аренда"],["utilities","Коммунальные"],["insurance","Страховка"],["expenses","Доп. расходы"]].flatMap(([k,n])=>db[k].filter(inBranch).filter(x=>x.status!=="Оплачено").map(x=>({k,n,x})));
  return `<div class="stats">${statsCard("На смене сейчас",W.filter(x=>!x.end).length,"")}${statsCard("Опоздания сегодня",W.filter(x=>x.start.startsWith(t)&&lateMin(x)).length,"")}${statsCard("Пробники сегодня",T.filter(x=>x.date===t).length,"")}${statsCard("Расходы на согласовании",pend.length,money(pend.reduce((a,p)=>a+Number(p.x.amount||0),0)))}${statsCard("Задолженности по расходам",money(debts.reduce((a,p)=>a+Number(p.x.amount||0),0)),plural(debts.length,"запись","записи","записей"))}</div>
  <div class="card"><h3>Расходы на согласовании</h3>${pend.map(p=>`<div class="row"><b>${esc(p.n)}: ${esc(p.x.title||p.x.kind||p.x.landlord||p.x.company||"")}</b><span>${money(p.x.amount)} · ${esc(branchName(p.x.branch))} ${approveCell(p.k,p.x)}</span></div>`).join("")||'<div class="empty">Пока нет данных</div>'}</div>
  <div class="card"><h3>Смены сотрудников сегодня</h3>${W.filter(x=>x.start.startsWith(t)).map(x=>`<div class="row"><b>${esc(x.user)}</b><span>${wsRow(x).slice(4).join(" · ")}</span></div>`).join("")||'<div class="empty">Пока нет данных</div>'}</div>
  <div class="card"><h3>Пробные занятия сегодня</h3>${T.filter(x=>x.date===t).map(x=>`<div class="row"><b>${esc(x.name)}</b><span>${esc(x.time||"")} · ${esc(x.status||"Новый пробник")} · ${esc(x.manager||"")}</span></div>`).join("")||'<div class="empty">Пока нет данных</div>'}</div>`};

/* --- Ученики тренера: только свои группы, без денег --- */
views["Ученики"]=(old=>()=>{if(!isTeacher())return old();const who=myTeacher(),G=db.groups.filter(g=>isMine(g.teacher,who)).map(g=>g.name),S=db.students.filter(s=>G.includes(s.group)&&s.status!=="Архив");
  const age=b=>b?Math.floor((Date.now()-new Date(b))/315576e5):"—",att=id=>db.attendance.filter(a=>a.student===id&&(a.date||"").startsWith(ym())&&a.status==="Присутствовал").length;
  return simpleTable(["ФИО","Возраст","Контакт родителя","Группа","Дата зачисления","Посещений за месяц"],S,x=>[`<b>${esc(x.name)}</b>`,esc(age(x.birth)),esc((x.parent?x.parent+" · ":"")+(x.phone||"")),esc(x.group),esc(x.since||"—"),String(att(x.id))])})(views["Ученики"]);
after["Ученики"]=(old=>()=>{if(!isTeacher())old&&old()})(after["Ученики"]);

/* --- Профиль сотрудника (не тренера) --- */
views["Профиль"]=(old=>()=>{if(isTeacher()||isBoss())return old();const mon=db.workShifts.filter(x=>x.user===me?.name&&x.start.startsWith(ym())),T=db.trials.filter(x=>x.manager===me?.name);
  return `<div class="card"><h3>${esc(me.name)}</h3><div class="row"><span class="sub">Роль</span><b>${esc(roleLbl(role))}</b></div><div class="row"><span class="sub">Телефон</span><b>${esc(me.phone||"—")}</b></div><div class="row"><span class="sub">Должность</span><b>${esc(me.position||roleLbl(role))}</b></div><div class="row"><span class="sub">Филиал</span><b>${esc(me.branch?branchName(me.branch):"Все филиалы")}</b></div></div>
  <div class="stats">${statsCard("Смен за месяц",mon.length,"")}${statsCard("Часов за месяц",Math.round(sumBy(mon,"hours")*10)/10,"")}${role==="Отдел продаж"?statsCard("Мои пробники",T.length,"")+statsCard("Купили абонемент",T.filter(x=>x.status==="Купил абонемент").length,""):""}</div>`})(views["Профиль"]);
after["Профиль"]=(old=>()=>{if(isTeacher()||isBoss())old&&old()})(after["Профиль"]);

/* Новые записи: статус, автор, журнал */
{const _as=afterSave;afterSave=function(key,rec,isNew){
  if(isNew){if(key==="trials"){rec.status=rec.status||"Новый пробник";rec.manager=rec.manager||me?.name||"";rec.created=today();trialLog(rec,"Пробник создан")}
    if(key==="fines"){rec.by=me?.name||"";rec.status=rec.status||"Назначен"}
    if(["rent","utilities","insurance","expenses"].includes(key)){rec.approval=canApprove()?"Согласовано":"На согласовании";if(canApprove()){rec.approvedBy=me?.name||"";rec.approvedAt=nowISO()}}}
  return _as(key,rec,isNew)}}
/* ТЗ v2: CRM начинается пустой — только филиалы студии и 5 тестовых аккаунтов (временный пароль меняется при первом входе) */
const RESET_V="tz2-empty-2026-11-24";
/* Филиалы студия добавляет сама. Список ниже — только чтобы убрать филиалы, созданные версией b5a6669 */
const SEEDED_BRANCHES=["Айнабулак 3 101а","Мкр Грэсс, Гагарина 11","Мкр Алатау (ияф), Ибрагимова 12","Аксай 1, дом 10, 3-3 подъезд","Орбита 3, дом 4а","Достык, 105а/1","Халык Арена","Талгар, тд Адимак 4 этаж","Абая, 115 4 этаж","Конаев, Мкр4 16/1","Ауэзова 5","Водник","Асыл Арман","Алматы Арена","Астана Левый берег","Астана Правый берег","Тастак","Каскелен","Узнагаш","Пятилетка","Карабулак","Чилик","Иссык"];
const TZ2_USERS=[["Директор","director@djigittau.kz","Руководитель"],["Управляющий","manager@djigittau.kz","Управляющий"],["Администратор","admin@djigittau.kz","Администратор"],["Отдел продаж","sales@djigittau.kz","Отдел продаж"],["Тренер","trainer@djigittau.kz","Тренер"]];
async function tz2Reset(){
  // Резервная копия прежних данных этого браузера — на случай, если их нужно вернуть
  try{const raw=localStorage.getItem(ZKEY)||localStorage.getItem(UKEY);if(raw&&!localStorage.getItem(UKEY+"_backup_before_tz2"))localStorage.setItem(UKEY+"_backup_before_tz2",raw)}catch(e){}
  COLS.forEach(k=>db[k]=[]);
  users=TZ2_USERS.map(([name,email,role])=>({name,email,role,phone:"",pass:"DJigitTest2026!",mustChange:true}));
  const keep={theme:settings.theme,xlsVersion:XLS?XLS.v:settings.xlsVersion,lastImport:settings.lastImport};// встроенная таблица студии не подтягивается заново
  settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),keep,{resetV:RESET_V,accounts:DEFAULT_SETTINGS.accounts.map(a=>({...a,start:0}))});
  try{sessionStorage.removeItem(SKEY)}catch(e){}
  persistNow(true);
  try{localStorage.setItem(UKEY+"_resetV",RESET_V)}catch(e){}
}
(async function boot(){
  let st=null;try{const z=localStorage.getItem(ZKEY);st=z&&window.DecompressionStream?JSON.parse(await gunz(z)):JSON.parse(localStorage.getItem(UKEY))}catch(e){try{st=JSON.parse(localStorage.getItem(UKEY))}catch(_){}}
  if(st&&st.db){COLS.forEach(k=>db[k]=Array.isArray(st.db[k])?st.db[k]:[]);settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),st.settings||{});users=Array.isArray(st.users)&&st.users.length?st.users:DEMO_USERS.map(u=>({...u}))}
  else{cleanSeed();users=DEMO_USERS.map(u=>({...u}));persist()}
  // флаг хранится отдельно от настроек: «Демо-данные» и импорт не должны запускать сброс повторно
  let rv=null;try{rv=localStorage.getItem(UKEY+"_resetV")}catch(e){}
  if(rv!==RESET_V&&settings.resetV!==RESET_V)await tz2Reset();
  // Один раз убрать 23 автоматически созданных филиала, если к ним ещё ничего не привязано
  try{if(!localStorage.getItem(UKEY+"_seedBrCleared")){const used=new Set(COLS.filter(k=>k!=="branches").flatMap(k=>db[k].map(x=>String(x.branch))));
    db.branches=db.branches.filter(b=>!(SEEDED_BRANCHES.includes(b.name)&&!b.address&&!used.has(String(b.id))));persistNow(true);localStorage.setItem(UKEY+"_seedBrCleared","1")}}catch(e){}
  settings.teacherAcc=1;if(oneBoss())persist();
  db.leads.forEach(l=>{if(l.price===undefined)l.price=0;l.pipeline=l.pipeline||"sales";l.feed=l.feed||[];if(l.stage===LOST&&!l.reason)l.reason="Другое"});
  settings.robots=settings.robots||{};settings.templates=settings.templates||{};if(!settings.sla)settings.sla=15;
  if(XLS&&settings.xlsVersion!==XLS.v){importXls();persist()}
  linkPayments();
  {const cm=new Date().toISOString().slice(0,7);if(!db.payments.some(p=>isInc(p)&&(p.date||"").startsWith(cm))){const last=db.payments.filter(isInc).map(p=>(p.date||"").slice(0,7)).filter(Boolean).sort().pop();if(last)panelMonth=last}}
  let sp=null;try{sp=sessionStorage.getItem(SKEY)}catch(e){}
  const u=sp?users.find(x=>x.phone===sp||x.email===sp):null;
  if(u)enter(u);else loginScreen();
})();
</script>
