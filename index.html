<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF5E6">
<title>DJIGIT TAU CRM</title>
<style>
:root{
  --bg:#F6F2E9;--card:#fff;--ink:#1A1712;--ink2:#4A3F2C;--muted:#857B69;--line:#ECE3CF;
  --gold:#B8913A;--gold-d:#9A7629;--gold-l:#D9BE7C;--gold-s:#F5ECD6;--side:#FBF5E6;--side2:#F3E6C6;
  --ok:#2F8F5B;--bad:#C0473A;--warn:#C98A1B;--info:#3B6FB6;
  --sw:252px;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold-d)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- вход ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#FFF9EA,transparent),var(--bg)}
.login-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 28px;box-shadow:0 20px 60px rgba(90,65,15,.10)}
.login-card img{display:block;width:210px;margin:0 auto 6px}
.login-card h1{text-align:center;font-size:15px;letter-spacing:.18em;font-weight:600;color:var(--gold-d);margin:0 0 22px}
.login-card label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:22px 0 12px}
.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}
.roles{display:grid;gap:8px}
.roles button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#FFFCF5;text-align:left}
.roles button:hover{border-color:var(--gold-l);background:var(--gold-s)}
.roles small{margin-left:auto;color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* ---------- каркас ---------- */
.shell{display:flex;min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:linear-gradient(180deg,var(--side),var(--side2));border-right:1px solid #E6D6AE;display:flex;flex-direction:column;z-index:40;transition:width .2s ease,transform .25s ease}
.side .brand{height:72px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #E9DBB6}
.side .brand img{height:30px}
.side .brand b{font-size:15px;letter-spacing:.06em;white-space:nowrap}
.side .brand span{display:block;font-size:10px;letter-spacing:.3em;color:var(--gold-d);font-weight:700}
.nav{flex:1;overflow:auto;padding:12px 10px}
.nav .it{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink2);text-align:left;white-space:nowrap;font-weight:500}
.nav .it:hover{background:rgba(184,145,58,.13)}
.nav .it.on{background:linear-gradient(135deg,#C9A24D,#A98130);color:#fff;box-shadow:0 4px 12px rgba(169,129,48,.28)}
.nav .it .chev{margin-left:auto;transition:transform .2s}
.nav .grp.open>.it .chev{transform:rotate(90deg)}
.nav .sub{display:none;padding:2px 0 6px 18px;position:relative}
.nav .sub:before{content:"";position:absolute;left:21px;top:2px;bottom:8px;width:1px;background:#E2CF9F}
.nav .grp.open>.sub{display:block}
.nav .sub .it{height:34px;font-weight:400;font-size:13.5px;padding-left:20px}
.nav .grp.has-on>.it{color:var(--gold-d);font-weight:600}
.side .foot{padding:10px;border-top:1px solid #E9DBB6}
.side .foot .it{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink2);white-space:nowrap}
.side .foot .it:hover{background:rgba(184,145,58,.13)}
.side.mini{--sw:72px}
.side.mini .brand b,.side.mini .it span,.side.mini .it .chev,.side.mini .sub{display:none}
.side.mini .brand{justify-content:center;padding:0}
.side.mini .it{justify-content:center;padding:0}
.main{flex:1;margin-left:var(--sw);min-width:0;transition:margin .2s}
.side.mini~.main{margin-left:72px}
.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.burger{display:none}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold-s);color:var(--gold-d);font-weight:700;font-size:12px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.chip small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.content{padding:24px;max-width:1440px}
.banner{display:flex;gap:10px;align-items:center;font-size:12.5px;color:#7A5B12;background:#FFF6DF;border:1px solid #F0DDAA;border-radius:12px;padding:9px 14px;margin-bottom:18px}
.dim{position:fixed;inset:0;background:rgba(26,23,18,.35);z-index:35;display:none}

/* ---------- элементы ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(60,45,10,.04)}
.card.pad{padding:18px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .l svg{color:var(--gold)}
.kpi .v{font-size:25px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.kpi .f{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.gold{background:linear-gradient(135deg,#FFFBF0,#F6E8C5);border-color:#EBD7A4}
.kpi.gold .v{color:var(--gold-d)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;border:1px solid transparent;background:linear-gradient(135deg,#C49C46,#A98130);color:#fff;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--ink2);border-color:var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--gold-l);background:#FFFCF4}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted)}
.ib:hover{background:var(--gold-s);color:var(--gold-d)}
.ib.del:hover{background:#FBEDEA;color:var(--bad)}
input.in,select.in,textarea.in{width:100%;height:40px;padding:0 12px;border:1px solid #E3D9C3;border-radius:10px;background:#fff;outline:none}
textarea.in{height:84px;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,145,58,.15)}
.in:disabled{background:#F7F4EC;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .search{position:relative;flex:1;min-width:200px;max-width:360px}
.bar .search svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.bar .search input{padding-left:36px}
.bar select.in{width:auto;min-width:150px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px}
.ph p{margin:2px 0 0;color:var(--muted)}
.ph .sp{flex:1}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:#FCFAF5;white-space:nowrap;user-select:none}
th.s{cursor:pointer}
th.s:hover{color:var(--gold-d)}
td{padding:11px 14px;border-bottom:1px solid #F3EDDF;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FFFCF4}
td.num,th.num{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap;width:1%}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#F1ECE0;color:var(--ink2);white-space:nowrap}
.b-ok{background:#E6F4EC;color:var(--ok)}.b-bad{background:#FBEAE7;color:var(--bad)}.b-warn{background:#FFF3DB;color:#9A6A0F}.b-info{background:#E8F0FA;color:var(--info)}.b-gold{background:var(--gold-s);color:var(--gold-d)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--gold-l);margin-bottom:8px}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:34px;height:34px}
.muted{color:var(--muted)}
.right{margin-left:auto}
.hbars .row{display:grid;grid-template-columns:140px 1fr 110px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbars .track{height:10px;border-radius:6px;background:#F3EDDF;overflow:hidden}
.hbars .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#D9BE7C,#B8913A)}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.cols .c i{display:block;width:100%;max-width:42px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#D9BE7C,#B8913A);min-height:3px}
.cols .c b{color:var(--ink);font-size:11px;font-weight:600}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}
.formula .t{padding:8px 12px;border-radius:10px;background:#FCFAF5;border:1px solid var(--line)}
.formula .t small{display:block;font-size:11px;color:var(--muted)}
.formula .eq{color:var(--muted);font-size:18px}
.formula .t.res{background:linear-gradient(135deg,#FFFBF0,#F6E8C5);border-color:#EBD7A4;font-weight:700}

/* воронка */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 260px;background:#FBF8F1;border:1px solid var(--line);border-radius:14px;min-height:200px}
.kcol.drag{background:var(--gold-s);border-color:var(--gold-l)}
.kcol h4{margin:0;padding:12px 14px 10px;font-size:13px;display:flex;align-items:center;gap:8px;border-top:3px solid var(--c);border-radius:14px 14px 0 0}
.kcol h4 .badge{margin-left:auto}
.kcards{padding:0 10px 10px;display:grid;gap:8px;min-height:60px}
.kc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:grab;box-shadow:0 1px 2px rgba(60,45,10,.05)}
.kc:hover{border-color:var(--gold-l)}
.kc b{display:block;font-size:13.5px}
.kc .m{font-size:12px;color:var(--muted);margin-top:3px}
.kc select{margin-top:8px;height:30px;font-size:12px;padding:0 8px}

/* расписание / посещаемость */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto}
.day{background:#FBF8F1;border:1px solid var(--line);border-radius:12px;min-height:140px}
.day h4{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.day.today h4{color:var(--gold-d)}
.slot{margin:8px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;font-size:12.5px;cursor:pointer}
.slot b{display:block}
.att{display:flex;gap:6px}
.att button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px}
.att button.p.on{background:#E6F4EC;border-color:#BFE2CC;color:var(--ok);font-weight:600}
.att button.a.on{background:#FBEAE7;border-color:#F0C9C2;color:var(--bad);font-weight:600}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid #F3EDDF}
.task:last-child{border-bottom:0}
.task input{width:18px;height:18px;margin-top:2px;accent-color:var(--gold)}
.task.done b{text-decoration:line-through;color:var(--muted)}
.perm{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3EDDF}
.perm:last-of-type{border:0}
.perm input{width:18px;height:18px;accent-color:var(--gold)}

/* модальное окно */
.ov{position:fixed;inset:0;background:rgba(26,23,18,.45);z-index:60;display:grid;place-items:center;padding:20px;animation:f .15s}
@keyframes f{from{opacity:0}}
.modal{width:100%;max-width:600px;max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(40,30,10,.25)}
.modal header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.modal header h3{margin:0;font-size:17px}
.modal .body{padding:6px 20px 8px;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.modal .body .full{grid-column:1/-1}
.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.hist{font-size:12.5px;border:1px solid var(--line);border-radius:10px;max-height:160px;overflow:auto}
.hist div{padding:7px 10px;border-bottom:1px solid #F3EDDF}
.hist div:last-child{border:0}
.photo{display:flex;align-items:center;gap:12px}
.photo .av{width:56px;height:56px;font-size:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2)}

@media (max-width:900px){
  .side,.side.mini{transform:translateX(-100%);--sw:272px;box-shadow:0 0 40px rgba(0,0,0,.15)}
  .side.mini .brand b,.side.mini .it span,.side.mini .it .chev{display:revert}
  .side.mini .grp.open>.sub{display:block}
  .side.mini .it{justify-content:flex-start;padding:0 12px}
  .side.open{transform:none}
  .side.open~.dim{display:block}
  .side .collapse{display:none!important}
  .main,.side.mini~.main{margin-left:0}
  .burger{display:inline-grid}
  .top{padding:0 12px;gap:8px}
  .top h2{font-size:16px}
  .chip .nm{display:none}
  .content{padding:14px}
  .two{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:12px 14px}.kpi .v{font-size:20px}
  .modal .body{grid-template-columns:1fr}
  .ov{padding:0;align-items:end}
  .modal{max-height:92vh;border-radius:18px 18px 0 0}
  .hbars .row{grid-template-columns:96px 1fr 84px}
  .bar .search{max-width:none}
  .top select.in{max-width:140px!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* Предпоказ DJIGIT TAU CRM. Данные — только в этом браузере (localStorage). Supabase подключается после согласования дизайна. */
const KEY="djigit_tau_preview_v1";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>Math.round(+n||0).toLocaleString("ru-RU")+" ₸";
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const month=()=>today().slice(0,7);
const fdate=d=>d?String(d).split("-").reverse().join("."):"";
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
const ini=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ---------- иконки ---------- */
const IP={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
 building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/>',
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 010 6M21 20c0-2.6-1.6-4.8-4-5.6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
 layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
 music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 check:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/>',

 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/><path d="M6 6l9-3 1 3"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>',
 percent:'<path d="M19 5L5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
 coins:'<ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M9 15v3c0 1.7 2.7 3 6 3s6-1.3 6-3v-5c0-1.7-2.7-3-6-3"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>',
 tasks:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
 log:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9l-6-6z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
 out:'<path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/>',
 side:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 debt:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',

const R=()=>UI.role;
function scope(ent,rows){
  const r=R(),me=UI.me;rows=rows||S[ent]||[];
  if(r==="badmin"&&!S.perms.badminOther){
    const b=me.branch;if(!b) return [];
    if(ent==="schedule"||ent==="attendance") return rows.filter(x=>grpBranch(x.group)===b);
    if(ent==="branches") return rows.filter(x=>x.id===b);
    if(E[ent]?.f.some(f=>f[0]==="branch")) return rows.filter(x=>x.branch===b);
  }
  if(r==="trainer"){
    const gs=S.groups.filter(g=>g.trainer===me.trainer).map(g=>g.id);
    if(ent==="groups") return rows.filter(g=>gs.includes(g.id));
    if(ent==="students") return rows.filter(s=>gs.includes(s.group));
    if(ent==="schedule"||ent==="attendance") return rows.filter(x=>gs.includes(x.group));
    if(ent==="tasks") return rows.filter(t=>t.assignee===me.trainer);
    if(["sales","refunds","expenses","leads","users"].includes(ent)) return [];
  }
  if(r==="sales"){
    if(ent==="sales") return rows.filter(x=>x.manager===me.name);
    if(ent==="refunds") return rows.filter(x=>x.by===me.name||S.sales.some(s=>s.manager===me.name&&s.student===x.student));
    if(ent==="leads") return rows.filter(x=>!x.manager||x.manager===me.name);
  }
  return rows;
}

  if(r==="badmin") return ["students","groups","schedule","attendance","sales","tasks"].includes(ent);
  if(r==="trainer") return ["tasks","attendance"].includes(ent);
  if(r==="sales") return ["leads","sales","students"].includes(ent)||(ent==="refunds"&&S.perms.salesRefunds);
  return false;
}
function locked(ent,k){
  const r=R();
  if(r==="badmin"&&k==="branch"&&!S.perms.badminOther) return true;
  if(r==="sales"&&(k==="manager"||k==="by")) return true;
  if(r==="sales"&&ent==="sales"&&(k==="discount"||k==="discountReason")&&!S.perms.salesDiscounts) return true;
  if(r==="trainer"&&k==="assignee") return true;
  return false;
}

function saveForm(form){
  const [ent,id]=form.dataset.save.split(":"),d=E[ent],fd=new FormData(form);
  const old=id?S[ent].find(r=>r.id===id):null,x=old?{...old}:{id:uid(),created:new Date().toISOString(),...defaults(ent)};
  for(const [k,l,t,,req] of d.f){
    if(locked(ent,k)) continue;
    if(t==="check"){x[k]=fd.has(k);continue}
    if(!fd.has(k)) continue;
    let v=fd.get(k);v=t==="money"||t==="num"?(v===""?"":+v):String(v).trim();
    if(req&&v==="") return toast(`Заполните поле «${l}»`);
    if(t==="money"&&v!==""&&(v<0||!isFinite(v))) return toast(`«${l}»: введите сумму 0 или больше`);
    x[k]=v;
  }
  if(ent==="sales"){
    if(x.newStudent){
      if(!canEdit("students")&&R()!=="badmin") return toast("Нет прав на добавление клиентов");
      const st={id:uid(),name:x.newStudent,branch:x.branch,status:"Активный",created:x.created};S.students.push(st);x.student=st.id;logIt("Добавил","students",st)}
    delete x.newStudent;
    if(!x.student) return toast("Выберите ученика или впишите нового клиента");
    x.price=+x.price||0;x.discount=+x.discount||0;
    if(x.discount>x.price) return toast("Скидка не может быть больше стоимости");
    if(x.paid==="") x.paid=x.price-x.discount;
    if(!x.branch) x.branch=S.students.find(s=>s.id===x.student)?.branch||"";
  }
  if(ent==="refunds"&&!x.branch) x.branch=S.students.find(s=>s.id===x.student)?.branch||"";
  if(ent==="leads"){
    x.hist=[...(x.hist||[])];const note=(fd.get("_note")||"").trim(),at=new Date().toISOString();
    if(!old) x.hist.push({at,text:"Заявка создана: "+x.stage});
    else if(old.stage!==x.stage) x.hist.push({at,text:`Этап: ${old.stage} → ${x.stage}`});
    if(note) x.hist.push({at,text:note});
  }
  if(old) Object.assign(old,x); else S[ent].push(x);
  logIt(old?"Изменил":"Добавил",ent,x);save();closeModal();render();toast("Сохранено");
}

/* ---------- расчёты ---------- */
const F=()=>UI.f;
function fSales(list){
  const f=F(),st=id=>S.students.find(s=>s.id===id);
  return scope("sales",list).filter(s=>(!f.branch||s.branch===f.branch)&&(!f.month||String(s.date).startsWith(f.month))&&(!f.cat||s.category===f.cat)&&(!f.emp||s.manager===f.emp)
    &&(!f.dance||S.groups.find(g=>g.id===st(s.student)?.group)?.dance===f.dance));
}
const fRef=()=>{const f=F();return scope("refunds").filter(r=>(!f.branch||r.branch===f.branch)&&(!f.month||String(r.date).startsWith(f.month))&&(!f.emp||r.by===f.emp))};
const fExp=()=>{const f=F();return scope("expenses").filter(r=>(!f.branch||r.branch===f.branch)&&(!f.month||String(r.date).startsWith(f.month)))};
/* Выручка = фактически оплачено. Скидка хранится отдельно и из выручки повторно не вычитается. */
function totals(){
  const s=fSales(),rev=sum(s,"paid"),disc=sum(s,"discount"),gross=sum(s,"price"),ref=sum(fRef(),"amount"),cost=sum(fExp(),"amount");
  return {s,rev,disc,gross,ref,cost,profit:rev-ref-cost,avg:s.length?rev/s.length:0};
}
const attRate=rows=>pct(rows.filter(a=>a.status==="Был").length,rows.length);
const kpi=(l,v,f="",icon="chart",cls="")=>`<div class="card kpi ${cls}"><div class="l">${ic(icon)}${esc(l)}</div><div class="v">${v}</div>${f?`<div class="f">${f}</div>`:""}</div>`;
function hbars(pairs,fmt=money){
  const mx=Math.max(1,...pairs.map(p=>p[1]));
  if(!pairs.some(p=>p[1])) return empty("Нет данных за выбранный период","chart");
  return `<div class="hbars">${[...pairs].sort((a,b)=>b[1]-a[1]).map(([l,v])=>`<div class="row"><span>${esc(l||"Без названия")}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><b style="text-align:right">${fmt(v)}</b></div>`).join("")}</div>`;
}
function monthCols(list,key,val){
  const ms=[],d=new Date();
  for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"))}
  const vals=ms.map(m=>list.filter(r=>String(r[key]).startsWith(m)).reduce((t,r)=>t+(+val(r)||0),0)),mx=Math.max(1,...vals);
  if(!vals.some(Boolean)) return empty("График появится после первых продаж","chart");
  return `<div class="cols">${ms.map((m,i)=>`<div class="c"><b>${vals[i]?(vals[i]>=1000?Math.round(vals[i]/1000)+" тыс":vals[i]):""}</b><i style="height:${vals[i]/mx*130}px"></i>${new Date(m+"-01T00:00").toLocaleString("ru-RU",{month:"short"})}</div>`).join("")}</div>`;
}
const groupBy=(list,keyFn,valFn)=>{const m=new Map();for(const x of list){const k=keyFn(x);m.set(k,(m.get(k)||0)+valFn(x))}return[...m]};

function moveLead(id,stage){
  const l=S.leads.find(x=>x.id===id);if(!l||l.stage===stage||!STAGES.includes(stage))return;
  l.hist=[...(l.hist||[]),{at:new Date().toISOString(),text:`Этап: ${l.stage} → ${stage}`}];l.stage=stage;
  if(!l.manager&&R()==="sales") l.manager=UI.me.name;
  logIt("Изменил","leads",l);save();render();toast("Этап: "+stage);
}

  if(ds.grp!=null){
    if(UI.mini&&innerWidth>900){UI.mini=false;localStorage.setItem(KEY+"_mini","0");UI.open[ds.grp]=true;return render()}
    const g=t.parentElement;g.classList.toggle("open");UI.open[ds.grp]=g.classList.contains("open");t.setAttribute("aria-expanded",UI.open[ds.grp]);keepUI();return}
  if(ds.add) return openForm(ds.add);
  if(ds.edit){const [en,id,fo]=ds.edit.split(":");return openForm(en,id,fo)}
  if(ds.del){const [en,id]=ds.del.split(":"),x=S[en].find(r=>r.id===id);if(!x)return;
    if(!confirm(`Удалить «${x.name||x.title||nm("students",x.student)||"запись"}»?`))return;
    S[en]=S[en].filter(r=>r.id!==id);logIt("Удалил",en,x);save();render();return toast("Удалено")}
  if(ds.sort){const [en,i]=ds.sort.split(":");const s=UI.sort[en];UI.sort[en]={i:+i,dir:s&&s.i===+i?-s.dir:1};return render()}
  if(ds.mark){const [sid,st]=ds.mark.split(":");let a=S.attendance.find(x=>x.group===UI.attG&&x.date===UI.attD&&x.student===sid);
    if(!a){a={id:uid(),group:UI.attG,date:UI.attD,student:sid};S.attendance.push(a)}a.status=st;if(st==="Был")a.reason="";
    logIt("Изменил","attendance",{name:nm("students",sid)+" — "+st+", "+fdate(UI.attD)});save();return render()}
  if(ds.conv){const l=S.leads.find(x=>x.id===ds.conv);const st={id:uid(),name:l.name,age:l.age,parent:l.parent,phone:l.phone,branch:l.branch,status:"Активный",created:new Date().toISOString()};
    S.students.push(st);l.hist=[...(l.hist||[]),{at:new Date().toISOString(),text:"Переведён в ученики"}];logIt("Добавил","students",st);save();closeModal();render();return toast("Ученик создан — теперь оформите продажу")}
  if(ds.block){const u=S.users.find(x=>x.id===ds.block);u.status=u.status==="Заблокирован"?"Активен":"Заблокирован";logIt(u.status==="Заблокирован"?"Заблокировал":"Разблокировал","users",u);save();return render()}
  switch(ds.act){
    case "close": return closeModal();
    case "mini": UI.mini=!UI.mini;localStorage.setItem(KEY+"_mini",UI.mini?"1":"0");return render();
    case "logout": UI.role=null;UI.me={};return render();
    case "openSide": return $("#side").classList.add("open");
    case "closeSide": return $("#side").classList.remove("open");
    case "resetF": UI.f={branch:"",month:"",cat:"",dance:"",emp:""};return render();
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();$("#side")?.classList.remove("open")}});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.form==="login"){$("#loginNote").textContent="Вход по паролю включится, когда подключим базу данных. Сейчас выберите роль ниже.";return}
  if(f.dataset.save) saveForm(f);
});
document.addEventListener("input",e=>{
  const t=e.target,ds=t.dataset;
  if(ds.q!=null){UI.q[ds.q]=t.value;focusKey=ds.q;return render()}
  if(ds.reason){const a=S.attendance.find(x=>x.group===UI.attG&&x.date===UI.attD&&x.student===ds.reason);if(a){a.reason=t.value;save()}}
});
document.addEventListener("change",e=>{
  const t=e.target,ds=t.dataset;
  if(ds.bf){UI.bf[ds.bf]=t.value;return render()}
  if(ds.f){UI.f[ds.f]=t.value;return render()}
  if(ds.me){UI.me[ds.me]=t.value;UI.me.name=ds.me==="trainer"?nm("trainers",t.value):"Администратор филиала";return render()}
  if(ds.att){if(ds.att==="g")UI.attG=t.value;else UI.attD=t.value||today();return render()}
  if(ds.stagesel) return moveLead(ds.stagesel,t.value);
  if(ds.perm){S.perms[ds.perm]=t.checked;logIt("Изменил","users",{name:"Права доступа"});save();return toast("Права сохранены")}
  if(ds.done!=null){const x=S.tasks.find(r=>r.id===ds.done);x.done=t.checked;logIt(t.checked?"Выполнил":"Изменил","tasks",x);save();return render()}
  if(t.matches("[data-photo]")&&t.files[0]){
    const img=new Image(),rd=new FileReader();
    rd.onload=()=>{img.onload=()=>{const c=document.createElement("canvas"),s=160,k=Math.max(s/img.width,s/img.height);c.width=c.height=s;
      c.getContext("2d").drawImage(img,(s-img.width*k)/2,(s-img.height*k)/2,img.width*k,img.height*k);
      const url=c.toDataURL("image/jpeg",.82);t.closest("form").querySelector('[name="photo"]').value=url;$("#phPrev").innerHTML=`<img src="${url}" alt="">`};img.src=rd.result};
    rd.readAsDataURL(t.files[0]);
  }
});
// перетаскивание карточек воронки
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".kc");if(c){e.dataTransfer.setData("text/plain",c.dataset.lead);e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const col=e.target.closest?.(".kcol");if(col){e.preventDefault();document.querySelectorAll(".kcol.drag").forEach(x=>x!==col&&x.classList.remove("drag"));col.classList.add("drag")}});
document.addEventListener("dragleave",e=>{const col=e.target.closest?.(".kcol");if(col&&!col.contains(e.relatedTarget))col.classList.remove("drag")});
document.addEventListener("drop",e=>{const col=e.target.closest?.(".kcol");if(!col)return;e.preventDefault();col.classList.remove("drag");moveLead(e.dataTransfer.getData("text/plain"),col.dataset.stage)});

render();
</script>
</body>
</html>
