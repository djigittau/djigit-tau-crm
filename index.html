
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>DJIGIT TAU CRM</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
--bg:#101010;--panel:#191919;--panel2:#22201c;
--line:#34312a;--text:#f3f0e9;--muted:#999185;
--gold:#c7a35b;--gold2:#e0c17b;--green:#83ae83;
--red:#d47b70;box-sizing:border-box
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.side{
position:fixed;left:0;top:0;bottom:0;width:245px;
background:#151515;border-right:1px solid var(--line);
padding:18px 13px;overflow:auto;z-index:10
}
.brand{display:flex;align-items:center;gap:12px;padding:5px 8px 22px;border-bottom:1px solid var(--line)}
.logo{width:43px;height:43px;border-radius:12px;background:linear-gradient(140deg,var(--gold2),#80602e);display:grid;place-items:center;color:#17130b;font-size:23px}
.brand b{letter-spacing:1.5px}
.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:2px;margin-top:5px}
.navgroup{margin-top:20px}
.navtitle{font-size:9px;color:#777168;letter-spacing:1.5px;padding:0 10px 8px;font-weight:bold}
.nav button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 10px;margin:2px 0;border:0;border-radius:8px;background:none;color:#b8b2a7;text-align:left;font-size:12px}
.nav button.active,.nav button:hover{background:#332b1e;color:var(--gold2)}
.nav .ico{width:20px;text-align:center;font-size:16px}
.main{margin-left:245px;min-width:0}
.top{height:66px;position:sticky;top:0;z-index:5;background:#151515;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 25px;gap:10px}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:white}
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.page{max-width:1500px;margin:auto;padding:25px}
.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}
.eyebrow{font-size:9px;color:var(--gold);letter-spacing:2px;font-weight:bold}
h1{font-size:25px;margin:8px 0 5px}
.sub{font-size:11px;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:11px 15px;background:linear-gradient(135deg,var(--gold2),#a47b3b);color:#17130b;font-weight:bold;font-size:11px}
.btn.secondary{background:#292720;color:#e8d8b5;border:1px solid #4a402e}
.btn.danger{background:#49251f;color:#ffd0c8;border:1px solid #784137}
.field{width:100%;padding:11px;background:#111;border:1px solid #403c33;color:white;border-radius:7px;font-size:12px;outline:none}
.field:focus{border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;min-width:0}
.stat label{font-size:11px;color:#aaa397}
.stat strong{display:block;font-size:24px;margin:10px 0 5px}
.stat small{font-size:10px;color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:14px}
.card h3{font-size:13px;margin:0 0 7px}
.hint{font-size:10px;color:var(--muted);margin-bottom:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:11px}
.row span{color:#aaa397;text-align:right}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.toolbar input{max-width:400px}
.tablewrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:700px}
.table th{text-align:left;color:#898276;font-size:9px;padding:12px;border-bottom:1px solid var(--line)}
.table td{padding:12px;border-bottom:1px solid #292722;font-size:10px;color:#c8c1b5}
.table td b{color:white}
.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#293126;color:#9bc293;font-size:9px}
.tag.warn{background:#382d1e;color:#e0ba73}
.tag.blue{background:#202c36;color:#9dbad2}
.tag.red{background:#402723;color:#e8a49a}
.mini{border:1px solid #51452e;background:#30291e;color:#d9bb7a;border-radius:6px;padding:6px 8px;font-size:9px}
.notice{background:#29251d;border:1px solid #55452b;color:#d8c397;border-radius:8px;padding:12px;font-size:10px;line-height:1.6;margin-bottom:14px}
.empty{text-align:center;padding:25px;color:var(--muted)}
.columns{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px;overflow:auto}
.col{background:#181818;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:180px}
.colhead{padding:6px;border-bottom:1px solid var(--line);font-size:11px;font-weight:bold;display:flex;justify-content:space-between}
.lead{background:#24221e;border:1px solid #39352d;border-radius:8px;padding:11px;margin-top:9px}
.lead b{font-size:11px}
.lead small{display:block;color:var(--muted);font-size:9px;margin-top:6px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.modalbg{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:30;padding:12px}
.modal{width:min(520px,100%);background:#1c1b18;border:1px solid #55462e;border-radius:13px;padding:20px;max-height:92vh;overflow:auto}
.modal h2{font-size:18px;margin:0 0 18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.formfield{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.formfield label{font-size:10px;color:#bdb5a8}
.full{grid-column:1/-1}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:18px;right:18px;background:#2a281f;border:1px solid #76603a;color:#f0ddb2;padding:12px 16px;border-radius:8px;z-index:70;font-size:11px}
.hamb{display:none;background:none;color:white;border:0;font-size:21px}
.bar{height:7px;background:#333029;border-radius:8px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--gold)}
@media(max-width:950px){
.side{width:210px}.main{margin-left:210px}
.stats{grid-template-columns:repeat(2,1fr)}
.page{padding:18px}.grid2{grid-template-columns:1fr}
}
@media(max-width:680px){
.side{transform:translateX(-100%);transition:.2s;width:250px}
.side.open{transform:none}
.main{margin-left:0}
.hamb{display:block}
.top{padding:8px 12px}
.page{padding:16px 11px}
h1{font-size:22px}
.heading .btn{font-size:0;padding:10px}
.heading .btn:after{content:"+";font-size:18px}
.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:20px}
.formgrid{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style>
</head>
<body>

<div class="app">
<aside class="side" id="side">
 <div class="brand">
  <div class="logo">♛</div>
  <div><b>DJIGIT TAU</b><small>STUDIO CRM</small></div>
 </div>
 <div class="nav" id="nav"></div>
 <div class="sub" style="padding:20px 10px">● DJIGIT TAU · CRM</div>
</aside>

<main class="main">
<header class="top">
 <button class="hamb" onclick="side.classList.toggle('open')">☰</button>
 <div class="crumb">DJIGIT TAU › <b id="crumb">Главная</b></div>
 <div class="topright">
  <span class="sub" id="whoami"></span>
  <select class="field" style="width:auto" id="branchFilter" onchange="render()">
   <option value="all">Все филиалы</option>
  </select>
  <button class="btn secondary" onclick="exportData()">Экспорт</button>
  <button class="btn secondary" onclick="logout()">Выйти</button>
 </div>
</header>

<div class="page">
 <div class="heading">
  <div>
   <div class="eyebrow">УПРАВЛЕНИЕ СТУДИЕЙ</div>
   <h1 id="title">Главная</h1>
   <div class="sub" id="subtitle"></div>
  </div>
  <button class="btn" id="primary" onclick="openCreate()">＋ Добавить</button>
 </div>
 <div id="content"></div>
</div>
</main>
</div>

<div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()">
 <form class="modal" id="editForm" onsubmit="saveForm(event)">
  <h2 id="modalTitle">Добавить</h2>
  <div id="formFields"></div>
  <div class="modalfoot">
   <button type="button" class="btn secondary" onclick="closeModal()">Отмена</button>
   <button class="btn" type="submit">Сохранить</button>
  </div>
 </form>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
/* =========================
   DJIGIT TAU CRM
========================= */

const $=id=>document.getElementById(id);
const KEY="djigit_tau_crm_v3";
const SESSION="djigit_tau_session_v3";

const STAGES=[
 "Новая заявка",
 "Связались",
 "Пробное занятие",
 "Купили абонемент"
];

const ROLES={
 "Руководитель":null,
 "Администратор":["Ученики","Посещаемость","Расписание","Группы","Тренеры","Абонементы","Финансы","Проекты"],
 "Тренер":["Ученики","Посещаемость","Расписание","Группы"],
 "Отдел продаж":["Заявки и воронка","Ученики","Абонементы"]
};

const NAV=[
 ["РАБОТА С КЛИЕНТАМИ",["Главная","Заявки и воронка","Ученики","Посещаемость"]],
 ["СТУДИЯ",["Расписание","Группы","Тренеры","Абонементы"]],
 ["ПРОЕКТЫ",["Проекты"]],
 ["УПРАВЛЕНИЕ",["Финансы","ДДС","ОПУ","Филиалы","Аналитика","Команда","Журнал","Настройки"]]
];

const ICON={
 "Главная":"▦","Заявки и воронка":"◫","Ученики":"♙",
 "Посещаемость":"✓","Расписание":"▦","Группы":"♧",
 "Тренеры":"♙","Абонементы":"▤","Проекты":"◈",
 "Финансы":"₸","ДДС":"₸","ОПУ":"▥","Филиалы":"⌂",
 "Аналитика":"◷","Команда":"♟","Журнал":"☰","Настройки":"⚙"
};

const BRANCHES=[
"Айнабулак 3 101а",
"Мкр Грэсс, Гагарина 11",
"Мкр Алатау (ияф), Ибрагимова 12",
"Аксай 1, дом 10, 3-3 подъезд",
"Орбита 3, дом 4а",
"Достык, 105а/1",
"Халык Арена",
"Талгар, тд Адимак 4 этаж",
"Абая, 115 4 этаж",
"Конаев, Мкр4 16/1",
"Ауэзова 5",
"Водник",
"Асыл Арман",
"Алматы Арена",
"Астана Левый берег",
"Астана Правый берег",
"Тастак",
"Каскелен",
"Узнагаш",
"Пятилетка",
"Карабулак",
"Чилик",
"Иссык"
];

const DEMO_USERS=[
 {phone:"70000000001",pass:"1111",name:"Камран",role:"Руководитель"},
 {phone:"70000000002",pass:"2222",name:"Администратор",role:"Администратор"},
 {phone:"70000000003",pass:"3333",name:"Вугар",role:"Тренер"},
 {phone:"70000000004",pass:"4444",name:"Менеджер",role:"Отдел продаж"}
];

let db={
 branches:BRANCHES.map((name,i)=>({id:i+1,name,address:name})),
 students:[],leads:[],groups:[],teachers:[],
 memberships:[],attendance:[],payments:[],
 lessons:[],projects:[],log:[],balances:[],
 users:DEMO_USERS.map(x=>({...x}))
};

let current="Главная";
let role="Руководитель";
let me=null;
let editing=null;
let formType="";

const MAP={
 student:"students",lead:"leads",group:"groups",
 teacher:"teachers",branch:"branches",
 membership:"memberships",payment:"payments",
 attendance:"attendance",lesson:"lessons",
 project:"projects"
};

const NAMES={
 student:"ученика",lead:"заявку",group:"группу",
 teacher:"тренера",branch:"филиал",
 membership:"абонемент",payment:"операцию",
 attendance:"посещение",lesson:"занятие",
 project:"проект"
};

const SUBS={
 "Главная":"Общая картина работы сети студий",
 "Заявки и воронка":"От первого обращения до покупки",
 "Ученики":"Единая база учеников всех филиалов",
 "Посещаемость":"Посещения и пропуски",
 "Расписание":"Расписание занятий",
 "Группы":"Группы и распределение",
 "Тренеры":"Команда тренеров",
 "Абонементы":"Продажи и остатки занятий",
 "Проекты":"Индивидуальные постановки и заказы",
 "Финансы":"Доходы и расходы",
 "ДДС":"Движение денежных средств",
 "ОПУ":"Отчёт о прибылях и убытках",
 "Филиалы":"Управление филиалами",
 "Аналитика":"Показатели студии",
 "Команда":"Пользователи и роли",
 "Журнал":"История действий",
 "Настройки":"Импорт и резервное копирование"
};

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function id(){return Date.now()*1000+Math.floor(Math.random()*1000)}
function money(v){return Number(v||0).toLocaleString("ru-RU")+" ₸"}
function toast(t){
 $("toast").textContent=t;
 $("toast").style.display="block";
 setTimeout(()=>$("toast").style.display="none",2800);
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db))}
 catch(e){toast("Недостаточно памяти. Сделайте резервную копию.")}
}
function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  if(x)db={...db,...x};
 }catch(e){}
}
function logAct(t){
 db.log.unshift({
  id:id(),text:t,role,
  date:new Date().toLocaleString("ru-RU")
 });
 db.log=db.log.slice(0,500);
}
function branchName(n){
 return db.branches.find(x=>x.id==n)?.name||"—";
}
function inBranch(x){
 const f=$("branchFilter").value;
 return f==="all"||String(x.branch)===f;
}
function allowed(n){
 return !ROLES[role]||ROLES[role].includes(n);
}
function isBoss(){return role==="Руководитель"}

function status(s){
 let c="";
 if(["Нужна оплата","Отсутствовал","Расход","Просрочен"].includes(s))c="warn";
 if(["Пробное","На проверке","Опоздал"].includes(s))c="blue";
 if(["Архив","Отменён"].includes(s))c="red";
 return `<span class="tag ${c}">${esc(s)}</span>`;
}

/* =========================
   LOGIN
========================= */

function normPhone(v){
 let s=String(v).replace(/\D/g,"");
 if(s.startsWith("8"))s="7"+s.slice(1);
 return s;
}
function loginScreen(){
 const d=document.createElement("div");
 d.id="login";
 d.style.cssText="position:fixed;inset:0;background:#101010;z-index:100;display:grid;place-items:center;padding:15px";
 d.innerHTML=`
 <div class="modal">
  <h2>♛ DJIGIT TAU CRM</h2>
  <div class="eyebrow">АВТОРИЗАЦИЯ</div>
  <div class="formfield" style="margin-top:20px">
   <label>Номер телефона</label>
   <input class="field" id="lgPhone" placeholder="+7..." inputmode="tel">
  </div>
  <div class="formfield">
   <label>Пароль</label>
   <input class="field" id="lgPass" type="password" placeholder="Пароль">
  </div>
  <button class="btn" style="width:100%;margin-top:8px" onclick="doLogin()">Войти</button>
  <div class="notice" style="margin-top:16px">
   Демо-доступы для проверки. Перед реальной эксплуатацией подключите серверную авторизацию.
  </div>
  ${DEMO_USERS.map(u=>`
   <div class="row">
    <b>${esc(u.role)}</b>
    <button class="mini" onclick="fillLogin('${u.phone}','${u.pass}')">${u.phone} / ${u.pass}</button>
   </div>`).join("")}
 </div>`;
 document.body.append(d);
}
function fillLogin(p,w){
 $("lgPhone").value="+"+p;
 $("lgPass").value=w;
}
function doLogin(){
 const p=normPhone($("lgPhone").value);
 const w=$("lgPass").value;
 const u=db.users.find(x=>normPhone(x.phone)===p&&x.pass===w);
 if(!u){toast("Неверный номер или пароль");return}
 enter(u);
}
function enter(u){
 me=u;
 role=u.role;
 sessionStorage.setItem(SESSION,u.phone);
 $("login")?.remove();
 $("whoami").textContent=u.name+" · "+u.role;
 init();
}
function logout(){
 sessionStorage.removeItem(SESSION);
 location.reload();
}

/* =========================
   NAVIGATION
========================= */

function init(){
 $("nav").innerHTML=NAV.map(g=>{
  const items=g[1].filter(allowed);
  if(!items.length)return "";
  return `<div class="navgroup">
   <div class="navtitle">${g[0]}</div>
   ${items.map(n=>`
    <button data-page="${n}" onclick="go('${n}')">
     <span class="ico">${ICON[n]}</span>${n}
    </button>`).join("")}
  </div>`;
 }).join("");

 const old=$("branchFilter").value||"all";
 $("branchFilter").innerHTML='<option value="all">Все филиалы</option>'+
 db.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");
 $("branchFilter").value=old;
 if(!allowed(current))current=NAV.flatMap(g=>g[1]).find(allowed);
 render();
}
function go(n){
 current=n;
 $("side").classList.remove("open");
 render();
}
function render(){
 $("title").textContent=current;
 $("crumb").textContent=current;
 $("subtitle").textContent=SUBS[current]||"";
 document.querySelectorAll("[data-page]").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===current);
 });
 $("primary").style.display=[
 "Главная","Аналитика","ДДС","ОПУ","Журнал","Настройки","Команда"
 ].includes(current)?"none":"inline-block";
 $("content").innerHTML=(views[current]||views["Главная"])();
}

/* =========================
   STATISTICS
========================= */

function stat(l,v,n){
 return `<div class="stat">
 <label>${l}</label><strong>${v}</strong><small>${n}</small>
 </div>`;
}
function total(type){
 return db.payments.filter(inBranch).filter(x=>x.type===type)
 .reduce((s,x)=>s+Number(x.amount||0),0);
}
function bars(rows){
 const max=Math.max(1,...rows.map(x=>x[1]));
 return rows.map(x=>`
 <div class="row">
  <span>${esc(x[0])}</span>
  <div class="bar"><i style="width:${x[1]/max*100}%"></i></div>
  <b>${x[1]}</b>
 </div>`).join("");
}
function groupBy(arr,key){
 const obj={};
 arr.forEach(x=>{
  const k=x[key]||"Не указано";
  obj[k]=(obj[k]||0)+Number(x.amount||0);
 });
 return Object.entries(obj).sort((a,b)=>b[1]-a[1]);
}

/* =========================
   PAGES
========================= */

const views={

"Главная":()=>{
 const s=db.students.filter(inBranch);
 const l=db.leads.filter(inBranch);
 const g=db.groups.filter(inBranch);
 const inc=total("Доход"),exp=total("Расход");
 return `
 <div class="stats">
 ${stat("УЧЕНИКИ",s.length,"В выбранных филиалах")}
 ${stat("ЗАЯВКИ",l.length,"В воронке")}
 ${stat("ГРУППЫ",g.length,"Всего групп")}
 ${stat("ДОХОДЫ",money(inc),"Финансовые операции")}
 </div>
 <div class="grid2">
  <div class="card">
   <h3>Ученики по филиалам</h3>
   <div class="hint">Количество учеников</div>
   ${bars(db.branches.map(b=>[
    b.name,db.students.filter(s=>s.branch===b.id).length
   ]))}
  </div>
  <div class="card">
   <h3>Финансовый баланс</h3>
   <div class="hint">По выбранным филиалам</div>
   <div class="row"><b>Доходы</b><span>${money(inc)}</span></div>
   <div class="row"><b>Расходы</b><span>${money(exp)}</span></div>
   <div class="row"><b>Баланс</b><span>${money(inc-exp)}</span></div>
  </div>
 </div>
 <div class="grid2">
  <div class="card">
   <h3>Последние заявки</h3>
   ${db.leads.filter(inBranch).slice(-5).reverse().map(x=>`
    <div class="row"><b>${esc(x.name)}</b><span>${esc(x.stage)}</span></div>
   `).join("")||'<div class="empty">Заявок пока нет</div>'}
  </div>
  <div class="card">

   ${db.lessons.filter(inBranch).slice(0,6).map(x=>`

function filterRows(){

}

function openCreate(){
 const map={
 "Ученики":"student",

function editItem(key,id){
 formType=Object.keys(MAP).find(k=>MAP[k]===key);
 editing={key,id};
 showForm();
}
function showForm(){
 const key=MAP[formType];
 const old=editing?db[key].find(x=>x.id===editing.id):{};
 $("modalTitle").textContent=(editing?"Изменить: ":"Добавить: ")+NAMES[formType];
 $("formFields").innerHTML=`<div class="formgrid">
 ${FORMS[formType].map(([name,label,type,req])=>{
  const value=old?.[name]??"";
  let input="";
  if(type.startsWith("select:")){
   input=`<select class="field" name="${name}" ${req?"required":""}>
    ${type.slice(7).split("|").map(v=>`<option value="${esc(v)}" ${v===value?"selected":""}>${esc(v)}</option>`).join("")}
   </select>`;
  }else if(type==="branch"){
   input=`<select class="field" name="${name}" required>
    ${db.branches.map(b=>`<option value="${b.id}" ${b.id==value?"selected":""}>${esc(b.name)}</option>`).join("")}
   </select>`;
  }else if(type==="student"){
   input=`<select class="field" name="${name}">
    ${db.students.map(s=>`<option value="${s.id}" ${s.id==value?"selected":""}>${esc(s.name)}</option>`).join("")}
   </select>`;
  }else if(type==="group"){
   input=`<select class="field" name="${name}">
    <option value="">Не выбрано</option>
    ${db.groups.map(g=>`<option ${g.name===value?"selected":""}>${esc(g.name)}</option>`).join("")}
   </select>`;
  }else{
   input=`<input class="field" name="${name}" type="${type}" value="${esc(value)}" ${req?"required":""}>`;
  }
  return `<div class="formfield ${["name","description","comment"].includes(name)?"full":""}">
   <label>${label}</label>${input}</div>`;
 }).join("")}
 </div>`;
 $("modalbg").style.display="grid";
}
function closeModal(){$("modalbg").style.display="none"}
function saveForm(e){
 e.preventDefault();
 const key=MAP[formType];
 const obj={};
 new FormData(e.target).forEach((v,k)=>obj[k]=v);
 ["branch","student","total","used","price","amount","paid","debt","expenses","margin","profitability"].forEach(k=>{
  if(obj[k]!==undefined)obj[k]=Number(obj[k]||0);
 });
 if(editing){
  const i=db[key].findIndex(x=>x.id===editing.id);
  db[key][i]={...db[key][i],...obj};
 }else{
  obj.id=id();
  db[key].push(obj);
 }
 logAct((editing?"Изменено: ":"Добавлено: ")+NAMES[formType]);
 save();
 closeModal();
 init();
 toast("Сохранено");
}
function deleteItem(key,idv){
 if(!isBoss())return;
 if(!confirm("Удалить запись?"))return;
 db[key]=db[key].filter(x=>x.id!==idv);
 logAct("Удалена запись из "+key);
 save();render();toast("Удалено");
}

}

/* =========================
   EXCEL IMPORT
========================= */

function findBranch(value){
 const s=String(value??"").trim().toLowerCase();
 if(!s)return 0;
 const i=db.branches.findIndex(b=>b.name.toLowerCase()===s);
 if(i>=0)return db.branches[i].id;
 const aliases=[
  ["айнабулак","Айнабулак"],
  ["грэс","Грэсс"],
  ["алатау","Алатау"],
  ["аксай","Аксай"],
  ["орбита","Орбита"],
  ["достык","Достык"],
  ["талгар","Талгар"],
  ["конаев","Конаев"]
 ];
 const a=aliases.find(x=>s.includes(x[0]));
 if(a){
  const j=db.branches.findIndex(b=>b.name.toLowerCase().includes(a[1].toLowerCase()));
  if(j>=0)return db.branches[j].id;
 }
 return 0;
}
function val(r,i){return r?.[i]??""}
function dateVal(v){
 if(v instanceof Date)return v.toISOString().slice(0,10);
 if(typeof v==="number"){
  const d=XLSX.SSF.parse_date_code(v);
  if(d)return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
 }
 return String(v||"").slice(0,10);
}
function rowsOf(wb,name){
 const ws=wb.Sheets[name];
 return ws?XLSX.utils.sheet_to_json(ws,{header:1,defval:""}):[];
}
function uniqueTeachers(names){
 const out=[];
 names.forEach(n=>{
  const s=String(n||"").trim();
  if(s&&!out.some(x=>x.name===s)){
   out.push({id:id(),name:s,phone:"",branch:0,role:"Тренер"});
  }
 });
 return out;
}
async function importExcel(){
 if(!isBoss()){toast("Импорт доступен руководителю");return}
 if(!window.XLSX){toast("Не загрузилась библиотека Excel");return}
 const file=$("excelFile").files[0];
 if(!file){toast("Выбери Excel-файл");return}
 if(!confirm("Заменить импортируемые разделы текущей CRM? Сначала скачай резервную копию."))return;
 $("importStatus").textContent="Чтение Excel...";
 try{
  const buffer=await file.arrayBuffer();
  const wb=XLSX.read(buffer,{type:"array",cellDates:true});

  const sr=rowsOf(wb,"ст");
  const pr=rowsOf(wb,"ПРОЕКТЫ");
  const op=rowsOf(wb,"ОПЕРАЦИИ");
  const br=rowsOf(wb,"Лист17");
  const bal=rowsOf(wb,"БАЛАНС");

  const students=[];
  const seen=new Set();
  const teacherNames=[];

  /* Ученики */
  sr.slice(1).forEach(r=>{
   const name=String(val(r,1)||"").trim();
   if(!name||name==="НЕ УДАЛЯТЬ")return;
   const phone=String(val(r,5)||"").trim();
   const branch=findBranch(val(r,6));
   const key=phone.replace(/\D/g,"")||name+"_"+branch;
   if(seen.has(key))return;
   seen.add(key);
   const teacher=String(val(r,3)||"").trim();
   if(teacher)teacherNames.push(teacher);
   students.push({
    id:id(),name,phone,branch,group:"",
    teacher,status:"На проверке",kind:"Действующий",
    birth:"",since:"",
    excelPeriod:String(val(r,2)||""),
    schedule:String(val(r,7)||""),
    time:String(val(r,8)||""),
    monthlyPrice:Number(val(r,9)||0),
    notes:[{
     t:"Родитель: "+String(val(r,4)||""),
     role:"Импорт Excel",
     at:new Date().toLocaleDateString("ru-RU")
    }]
   });
  });

  /* Филиалы */
  const branchNames=[...BRANCHES];
  br.slice(1).forEach(r=>{
   const n=String(val(r,3)||"").trim();
   if(n&&!branchNames.some(x=>x.toLowerCase()===n.toLowerCase())){
    branchNames.push(n);
   }
  });
  db.branches=branchNames.map((n,i)=>({id:i+1,name:n,address:n}));

  /* Повторное сопоставление филиалов после загрузки */
  students.forEach(s=>{
   const original=sr.find(r=>String(val(r,1)||"").trim()===s.name);
   if(original)s.branch=findBranch(val(original,6));
  });

  /* Проекты */
  const projects=[];
  pr.slice(4).forEach(r=>{
   const name=String(val(r,1)||"").trim();
   if(!name)return;
   const teacher=String(val(r,3)||"").trim();
   if(teacher)teacherNames.push(teacher);
   projects.push({
    id:id(),date:dateVal(val(r,0)),name,
    period:String(val(r,2)||""),
    teacher,
    parent:String(val(r,4)||""),
    phone:String(val(r,5)||""),
    branch:findBranch(val(r,6)),
    schedule:String(val(r,7)||""),
    time:String(val(r,8)||""),
    status:String(val(r,32)||""),
    comment:String(val(r,33)||""),
    paid:Number(val(r,34)||0),
    debt:Number(val(r,35)||0),
    expenses:Number(val(r,36)||0),
    margin:Number(val(r,37)||0),
    profitability:Number(val(r,38)||0)
   });
  });

  /* Финансовые операции */
  const payments=[];
  op.slice(2).forEach(r=>{
   const amount=Number(val(r,4)||0);
   const dt=val(r,0);
   if(!dt||!amount)return;
   const article=String(val(r,2)||"");
   let type=String(val(r,18)||"").toUpperCase();
   if(type!=="ДОХОД"&&type!=="РАСХОД"){
    type=article.toUpperCase().includes("ДОХОД")?"ДОХОД":
         article.toUpperCase().includes("РАСХОД")?"РАСХОД":
         amount>=0?"ДОХОД":"РАСХОД";
   }
   const teacher=String(val(r,10)||"").trim();
   if(teacher)teacherNames.push(teacher);
   payments.push({
    id:id(),date:dateVal(dt),
    type:type==="ДОХОД"?"Доход":"Расход",
    amount:Math.abs(amount),
    description:article,
    account:String(val(r,3)||""),
    project:String(val(r,5)||""),
    sender:String(val(r,7)||""),
    comment:String(val(r,8)||""),
    branch:findBranch(val(r,9)),
    teacher,
    dance:String(val(r,11)||""),
    category:String(val(r,12)||""),
    studentType:String(val(r,13)||""),
    action:String(val(r,14)||""),
    month:String(val(r,15)||""),
    year:String(val(r,16)||"")
   });
  });

  /* Остатки */
  const balances=bal.slice(1).filter(r=>val(r,0)!=="").map(r=>({
   account:String(val(r,0)),
   balance:Number(val(r,1)||0)
  }));

  db.students=students;
  db.projects=projects;
  db.payments=payments;
  db.teachers=uniqueTeachers(teacherNames);
  db.balances=balances;

  /* Другие разделы не заполняются вымышленными данными */
  db.groups=[];
  db.memberships=[];
  db.attendance=[];
  db.lessons=[];
  db.leads=[];

  logAct("Импорт Excel: "+students.length+" учеников, "+
   projects.length+" проектов, "+payments.length+" операций");
  save();
  init();

  $("importStatus").textContent=
   "Готово: учеников "+students.length+
   ", проектов "+projects.length+
   ", операций "+payments.length+
   ", тренеров "+db.teachers.length+
   ", филиалов "+db.branches.length;
  toast("Импорт завершён");
 }catch(e){
  console.error(e);
  $("importStatus").textContent="Ошибка чтения Excel: "+e.message;
  toast("Не удалось прочитать книгу");
 }
}

function exportData(){

 const a=document.createElement("a");

 a.download="djigit-tau-backup.json";
 a.click();
 URL.revokeObjectURL(a.href);
}
function importBackup(){
 if(!isBoss())return;
 const f=$("backupFile").files[0];
 if(!f){toast("Выбери файл JSON");return}
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!d.students||!d.branches)throw Error();
   db={...db,...d};
   save();init();toast("Резервная копия восстановлена");
  }catch(e){toast("Неверный файл копии")}
 };
 r.readAsText(f);
}
